<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeBug — Контакты и реквизиты</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <link rel="stylesheet" href="theme-dark.css">
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #020617;
            color: #e2e8f0;
        }
        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 20px 56px;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 32px;
        }
        .card {
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.75);
            padding: 18px;
        }
        .row {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        }
        .row:last-child {
            border-bottom: 0;
        }
        .label {
            color: #94a3b8;
        }
        .value {
            color: #e2e8f0;
            word-break: break-word;
        }
        a {
            color: #7dd3fc;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        @media (max-width: 700px) {
            .row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Контакты и реквизиты</h1>
        <section class="card">
            <div class="row">
                <div class="label">ФИО самозанятого</div>
                <div class="value">Лазутин Афанасий Федорович</div>
            </div>
            <div class="row">
                <div class="label">ИНН</div>
                <div class="value">772798628497</div>
            </div>
            <div class="row">
                <div class="label">Контакт (Telegram)</div>
                <div class="value"><a href="https://t.me/afony_l" target="_blank" rel="noopener">@afony_l</a></div>
            </div>
        </section>
    </main>
</body>
</html>
