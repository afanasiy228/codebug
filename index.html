<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBug</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090b0d;
            --bg-2: #0b0f12;
            --ink: #cfd9e2;
            --muted: #8693a0;
            --line: #1b252c;
            --green: #2f7a56;
            --green-soft: #3d9468;
            --red-soft: #9f6464;
            --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, var(--bg), var(--bg-2));
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: thin;
            scrollbar-color: #27323a #0a0d10;
        }

        .screen {
            min-height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 8;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 11, 13, 0.34);
            border-bottom: 1px solid rgba(29, 39, 46, 0.42);
            backdrop-filter: blur(4px);
        }

        .top-nav-inner {
            width: min(1180px, 96vw);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .top-nav .logo {
            font-size: 14px;
            font-weight: 700;
            color: #d2dde5;
            letter-spacing: 0.2px;
        }

        .top-nav nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .top-nav nav a {
            margin: 0;
            color: #8f9daa;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .top-nav nav a:hover {
            color: #cbd6df;
        }

        .hero {
            position: relative;
            overflow: hidden;
            display: grid;
            align-items: center;
            justify-items: center;
            padding: 24px;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(900px 460px at 82% 16%, rgba(38, 96, 68, 0.14), transparent 70%),
                radial-gradient(620px 380px at 8% 74%, rgba(31, 63, 50, 0.09), transparent 68%),
                radial-gradient(700px 320px at 55% 62%, rgba(22, 44, 36, 0.12), transparent 72%);
            pointer-events: none;
        }

        .code-fog {
            position: absolute;
            inset: -14% -16% -14%;
            z-index: 1;
            transform: rotate(-1.15deg);
            pointer-events: none;
            filter: blur(1.05px);
            opacity: 0.72;
            overflow: hidden;
        }

        .code-block {
            position: absolute;
            display: grid;
            gap: 0;
            width: 42vw;
            will-change: transform, opacity;
        }

        .code-row {
            display: grid;
            grid-template-columns: 38px 1fr;
            font-family: var(--mono);
            font-size: 12px;
            color: #687a89;
            line-height: 1.48;
            transition: opacity .48s ease, color .48s ease, background-color .7s ease;
            opacity: .22;
            padding: 1px 0;
            transform: translateY(0);
        }

        .code-row:nth-child(2n) {
            opacity: .28;
        }

        .code-row .ln {
            text-align: right;
            padding-right: 8px;
            color: #4e5e6d;
            user-select: none;
        }

        .code-row .txt {
            white-space: pre;
            overflow-x: auto;
        }

        .code-row.hover {
            opacity: .42;
            color: #8ea2b2;
        }

        .code-row.hot-red {
            opacity: .66;
            color: #cfb1b1;
            background: rgba(122, 63, 63, 0.17);
        }

        .code-row.hot-green {
            opacity: .66;
            color: #b1d7c2;
            background: rgba(45, 107, 76, 0.18);
        }

        .code-row.muted-hide {
            opacity: .08;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: min(920px, 92vw);
            text-align: left;
            display: grid;
            justify-items: start;
            gap: 10px;
        }

        .brand {
            margin: 0;
            font-size: clamp(32px, 5.1vw, 54px);
            line-height: 1;
            font-weight: 700;
            color: rgba(118, 169, 143, 0.67);
            letter-spacing: 0.2px;
        }

        .subtitle {
            margin: 0;
            color: #9ca8b4;
            font-size: clamp(16px, 2.2vw, 24px);
            line-height: 1.28;
            max-width: 560px;
        }

        .cta {
            margin-top: 4px;
            border: 1px solid rgba(67, 136, 99, 0.46);
            border-radius: 9px;
            padding: 10px 15px;
            background: rgba(16, 24, 21, 0.44);
            color: #bfd1c6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background .2s ease, border-color .2s ease, color .2s ease;
        }

        .cta:hover {
            background: rgba(27, 56, 43, 0.65);
            border-color: rgba(83, 158, 119, 0.64);
            color: #d2e1d9;
        }

        .news {
            padding: 84px 18px 34px;
            display: grid;
            align-content: center;
        }

        .news-shell {
            width: min(780px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 10px;
        }

        .news-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .news-head h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #d6dfe8;
        }

        .news-head a {
            border: 1px solid #2a3640;
            border-radius: 8px;
            color: #a8b6c3;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            padding: 5px 9px;
        }

        .news-list {
            display: grid;
            gap: 0;
        }

        .news-item {
            display: grid;
            gap: 4px;
            padding: 10px 0;
            border-bottom: 1px solid #19242b;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-meta {
            font-family: var(--mono);
            color: #7f8d9b;
            font-size: 11px;
        }

        .news-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: #d2dce5;
        }

        .news-text {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.35;
        }

        .news-open {
            margin-top: 2px;
            width: fit-content;
            color: #b7c4d0;
            text-decoration: none;
            font-size: 12px;
            border-bottom: 1px solid #2b3741;
            padding-bottom: 1px;
        }

        .news-empty {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 760px) {
            .top-nav {
                height: 50px;
                justify-content: center;
                border-bottom-color: rgba(27, 37, 44, 0.55);
            }

            .top-nav-inner {
                width: calc(100vw - 22px);
            }

            .hero-content {
                transform: none;
                width: min(560px, 92vw);
                justify-items: center;
                text-align: center;
            }

            .brand {
                color: rgba(145, 196, 170, 0.88);
            }

            .subtitle {
                font-size: 21px;
            }

            .code-fog {
                inset: -12% -38% -16%;
                transform: rotate(-0.8deg);
                opacity: 0.48;
            }

            .code-block {
                width: 92vw;
            }
        }
    </style>
</head>

<body>
    <div class="top-nav">
        <div class="top-nav-inner">
            <span class="logo">CodeBug</span>
            <nav id="nav-links"></nav>
        </div>
    </div>

    <section class="screen hero" id="heroScreen">
        <div class="code-fog" id="codeFog" aria-hidden="true"></div>

        <div class="hero-content">
            <h1 class="brand">CodeBug</h1>
            <p class="subtitle">Где-то здесь ошибка.</p>
            <a class="cta" href="train.html">К тренировке</a>
        </div>
    </section>

    <section class="screen news">
        <div class="news-shell">
            <div class="news-head">
                <h2>Новости</h2>
                <a href="news.html" id="homeNewsArchiveLink">Открыть</a>
            </div>
            <div id="homeNewsList" class="news-list"></div>
            <div id="homeNewsEmpty" class="news-empty" style="display:none;">Пока нет новостей.</div>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="globalsubmissions.js"></script>
    <script src="submit.js"></script>
    <script>
        function escapeHtml(text) {
            return (text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function trimText(text, limit) {
            if (!text) return "";
            const oneLine = text.replace(/\s+/g, " ").trim();
            if (oneLine.length <= limit) return oneLine;
            return oneLine.slice(0, limit).trimEnd() + "...";
        }

        function formatDate(ts) {
            if (!ts) return "без даты";
            const d = new Date(Number(ts));
            if (Number.isNaN(d.getTime())) return "без даты";
            return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
        }

        function renderHomeNews(items) {
            const list = document.getElementById("homeNewsList");
            const empty = document.getElementById("homeNewsEmpty");
            const archiveLink = document.getElementById("homeNewsArchiveLink");
            list.innerHTML = "";

            if (!items.length) {
                empty.style.display = "block";
                if (archiveLink) archiveLink.style.display = "none";
                return;
            }

            empty.style.display = "none";
            if (archiveLink) archiveLink.style.display = "inline-flex";

            items.slice(0, 5).forEach(item => {
                const article = document.createElement("article");
                article.className = "news-item";
                const title = item.title || "Обновление тренировки";
                const body = trimText(item.text || "", 72) || "Новые задачи.";
                article.innerHTML = `
                    <div class="news-meta">${formatDate(item.created)}</div>
                    <h3 class="news-title">${escapeHtml(title)}</h3>
                    <p class="news-text">${escapeHtml(body)}</p>
                    <a class="news-open" href="news.html">Подробнее</a>
                `;
                list.appendChild(article);
            });
        }

        async function loadHomeNews() {
            const items = [];
            try {
                const latestSnap = await db.ref("site/announcement").get();
                if (latestSnap.exists()) {
                    items.push({
                        source: "latest",
                        ...latestSnap.val(),
                        created: latestSnap.val().created || 0
                    });
                }
            } catch (err) {
                console.warn("Latest announcement not loaded", err);
            }

            try {
                const listSnap = await db.ref("site/announcements").get();
                if (listSnap.exists()) {
                    const data = listSnap.val();
                    Object.keys(data).forEach(key => {
                        items.push({
                            id: key,
                            source: "list",
                            ...data[key]
                        });
                    });
                }
            } catch (err) {
                console.warn("Announcements list not loaded", err);
            }

            items.sort((a, b) => (b.created || 0) - (a.created || 0));
            const unique = [];
            const seen = new Set();
            for (const item of items) {
                const fingerprint = `${item.title || ""}|${item.text || ""}|${item.created || 0}|${item.author || ""}`;
                if (seen.has(fingerprint)) continue;
                seen.add(fingerprint);
                unique.push(item);
            }
            renderHomeNews(unique);
        }

        function initCodeEffect() {
            const hero = document.getElementById("heroScreen");
            const fog = document.getElementById("codeFog");
            if (!hero || !fog) return;

            const codeTemplates = [
                "for (int i = 0; i <= n; ++i) pref[i] = pref[i - 1] + a[i];",
                "while (lo <= hi) { int mid = (lo + hi) / 2; }",
                "if (a[mid] == x) return mid;",
                "if (pref[r] - pref[l] == need) ans++;",
                "for (auto [to, w] : g[v]) relax(to, w);",
                "if (dist[to] > dist[v] + w) dist[to] = dist[v] + w;",
                "dp[i][mask] = min(dp[i][mask], dp[i - 1][mask]);",
                "if (balance = 0) ok = true;",
                "if (used + cost <= budget) used += cost;",
                "while (ptr < n && a[ptr] < lim) ++ptr;",
                "if (left == right) return tree[v];",
                "long long mid = left + (right - left) / 2;",
                "if (node == parent) continue;",
                "ans = min(ans, cur + delta);",
                "if (k <= 0) return 1;",
                "for (int j = 0; j <= m; ++j) dp[i][j] = INF;",
                "pref[i + 1] = pref[i] + val[i];",
                "if (ok && cnt == need) return true;",
                "sum += max(0LL, r - l + 1);",
                "vector<long long> pref(n + 1, 0);",
                "if (state[u] == 1) cycle = true;",
                "while (pos <= n && a[pos] <= x) pos++;",
                "if (cur == target) break;",
                "if (x == 0) return 0;",
                "for (int bit = 0; bit < 20; ++bit) mask ^= (1 << bit);",
                "if (r > 0) sum -= pref[r - 1];",
                "if (ptr == -1) ptr = i;",
                "if (a[mid] = x) return mid;",
                "auto it = lower_bound(a.begin(), a.end(), x);",
                "dp[i + 1] = max(dp[i + 1], dp[i] + w);",
                "if (v == parent) continue;",
                "best = min(best, abs(pref[r] - pref[l - 1]));",
                "while (j < n && sum + a[j] <= s) sum += a[j++];",
                "if (left <= right) mid = left + (right - left) / 2;",
                "if (used <= limit) answer = max(answer, cur);",
                "if (l < 0 || r >= n) return false;",
                "answer += a[i] * b[i];",
                "if (idx < n) idx = idx + 1;",
                "if (best > cur) best = cur;"
            ];

            const blockConfigsDesktop = [
                { left: "-16vw", top: "-10vh", width: "42vw", rotate: -0.8, opacity: 0.62, blur: 1.2 },
                { left: "20vw", top: "-12vh", width: "42vw", rotate: 0.4, opacity: 0.56, blur: 1.0 },
                { left: "56vw", top: "-8vh", width: "40vw", rotate: 1.0, opacity: 0.6, blur: 1.15 },
                { left: "-12vw", top: "28vh", width: "44vw", rotate: -0.5, opacity: 0.58, blur: 0.95 },
                { left: "24vw", top: "26vh", width: "42vw", rotate: 0.3, opacity: 0.52, blur: 1.15 },
                { left: "60vw", top: "30vh", width: "38vw", rotate: -0.2, opacity: 0.6, blur: 1.0 },
                { left: "-18vw", top: "62vh", width: "46vw", rotate: 0.8, opacity: 0.56, blur: 1.2 },
                { left: "20vw", top: "64vh", width: "44vw", rotate: -0.4, opacity: 0.54, blur: 1.05 },
                { left: "58vw", top: "66vh", width: "40vw", rotate: 0.55, opacity: 0.58, blur: 1.1 }
            ];

            const blockConfigsMobile = [
                { left: "-30vw", top: "-8vh", width: "92vw", rotate: -0.6, opacity: 0.56, blur: 1.1 },
                { left: "-8vw", top: "14vh", width: "92vw", rotate: 0.35, opacity: 0.5, blur: 1.0 },
                { left: "-24vw", top: "36vh", width: "92vw", rotate: -0.45, opacity: 0.52, blur: 1.15 },
                { left: "-4vw", top: "58vh", width: "92vw", rotate: 0.25, opacity: 0.48, blur: 1.0 },
                { left: "-20vw", top: "80vh", width: "92vw", rotate: -0.35, opacity: 0.54, blur: 1.2 }
            ];

            const blockConfigs = window.matchMedia("(max-width: 760px)").matches ? blockConfigsMobile : blockConfigsDesktop;
            const lineCountPerBlock = window.matchMedia("(max-width: 760px)").matches ? 22 : 16;
            const rows = [];
            let lineNo = 100;

            for (const cfg of blockConfigs) {
                const block = document.createElement("div");
                block.className = "code-block";
                block.style.left = cfg.left;
                block.style.top = cfg.top;
                block.style.width = cfg.width;
                block.style.transform = `rotate(${cfg.rotate}deg)`;
                block.style.opacity = String(cfg.opacity);
                block.style.filter = `blur(${cfg.blur}px)`;

                for (let i = 0; i < lineCountPerBlock; i++) {
                    const row = document.createElement("div");
                    row.className = "code-row";
                    const ln = document.createElement("span");
                    ln.className = "ln";
                    ln.textContent = String(lineNo++);
                    const txt = document.createElement("span");
                    txt.className = "txt";
                    txt.textContent = codeTemplates[(i + rows.length) % codeTemplates.length];
                    row.appendChild(ln);
                    row.appendChild(txt);
                    block.appendChild(row);
                    rows.push(row);
                }
                fog.appendChild(block);
            }

            const baseText = rows.map((row) => row.querySelector(".txt").textContent);
            let pulseTimer = null;
            let driftTimer = null;

            function resetRows() {
                rows.forEach((row, idx) => {
                    row.classList.remove("hot-red", "hot-green");
                    row.classList.remove("muted-hide");
                    row.querySelector(".txt").textContent = baseText[idx];
                });
            }

            function setHoverByPointer(clientX, clientY) {
                const heroRect = hero.getBoundingClientRect();
                if (clientY < heroRect.top || clientY > heroRect.bottom) {
                    rows.forEach((row) => row.classList.remove("hover"));
                    return;
                }
                rows.forEach((row) => {
                    const r = row.getBoundingClientRect();
                    const cx = r.left + r.width / 2;
                    const cy = r.top + r.height / 2;
                    const dx = Math.abs(clientX - cx);
                    const dy = Math.abs(clientY - cy);
                    if (dx < 560 && dy < 66) row.classList.add("hover");
                    else row.classList.remove("hover");
                });
            }

            function mutateLine(text) {
                const swaps = [
                    { from: "<=", to: "<" },
                    { from: "==", to: "=" },
                    { from: "r]", to: "r - 1]" }
                ];
                for (const pair of swaps) {
                    if (text.includes(pair.from)) return text.replace(pair.from, pair.to);
                }
                return text;
            }

            function runPulse() {
                const idx = Math.floor(Math.random() * rows.length);
                const mode = Math.floor(Math.random() * 3);
                const row = rows[idx];
                const txt = row.querySelector(".txt");
                const original = baseText[idx];

                row.classList.remove("hot-red", "hot-green");
                if (mode === 0) {
                    row.classList.add("hot-red");
                } else if (mode === 1) {
                    row.classList.add("hot-green");
                } else {
                    row.classList.add(Math.random() > 0.5 ? "hot-red" : "hot-green");
                    txt.textContent = mutateLine(original);
                }

                if (pulseTimer) clearTimeout(pulseTimer);
                pulseTimer = setTimeout(() => {
                    row.classList.remove("hot-red", "hot-green");
                    txt.textContent = original;
                }, 1650);
            }

            function runDrift() {
                const idx = Math.floor(Math.random() * rows.length);
                const row = rows[idx];
                const txt = row.querySelector(".txt");
                const original = baseText[idx];
                const mode = Math.floor(Math.random() * 4);

                if (mode === 0) {
                    txt.textContent = original + " // check";
                } else if (mode === 1) {
                    txt.textContent = original.slice(0, Math.max(0, original.length - 8));
                } else if (mode === 2) {
                    txt.textContent = mutateLine(original);
                } else {
                    row.classList.add("muted-hide");
                }

                if (driftTimer) clearTimeout(driftTimer);
                driftTimer = setTimeout(() => {
                    row.classList.remove("muted-hide");
                    txt.textContent = original;
                }, 1800 + Math.floor(Math.random() * 1400));
            }

            function schedulePulse() {
                const delay = 6000 + Math.floor(Math.random() * 4000);
                setTimeout(() => {
                    runPulse();
                    schedulePulse();
                }, delay);
            }

            function scheduleDrift() {
                const delay = 2600 + Math.floor(Math.random() * 4200);
                setTimeout(() => {
                    runDrift();
                    scheduleDrift();
                }, delay);
            }

            document.addEventListener("mousemove", (e) => setHoverByPointer(e.clientX, e.clientY), { passive: true });
            document.addEventListener("mouseleave", () => rows.forEach((row) => row.classList.remove("hover")));

            schedulePulse();
            scheduleDrift();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateNavbar();
            loadHomeNews();
            initCodeEffect();
        });
    </script>
</body>

</html>
