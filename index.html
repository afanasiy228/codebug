<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBug</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #07090b;
            --bg2: #0a0f12;
            --line: #1a232a;
            --ink: #d6dee6;
            --muted: #8d9aa7;
            --accent: #2e7755;
            --accent-border: rgba(71, 144, 106, 0.52);
            --code: rgba(148, 168, 184, 0.52);
            --code-hover: rgba(205, 221, 234, 0.78);
            --flash-red: rgba(178, 76, 76, 0.085);
            --flash-red-ink: rgba(255, 219, 219, 0.46);
            --flash-green: rgba(62, 141, 98, 0.085);
            --flash-green-ink: rgba(219, 255, 233, 0.46);
            --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        
        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            height: 100%;
        }
        
        body {
            margin: 0;
            font-family: Inter, sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, var(--bg), var(--bg2));
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: thin;
            scrollbar-color: #27323a #0a0d10;
        }
        
        .screen {
            min-height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
        
        .top-nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 8;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(26, 35, 42, 0.48);
            background: rgba(7, 10, 12, 0.34);
            backdrop-filter: blur(4px);
        }
        
        .top-nav-inner {
            width: min(1180px, 96vw);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .top-nav .logo {
            font-size: 14px;
            font-weight: 700;
            color: #d2dce5;
        }
        
        .top-nav nav {
            display: flex;
            gap: 14px;
        }
        
        .top-nav nav a {
            color: #91a0ad;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .top-nav nav a:hover {
            color: #ccd7e1;
        }
        
        .hero {
            position: relative;
            overflow: hidden;
            display: grid;
            align-items: center;
            padding: 24px;
        }
        
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(920px 480px at 74% 18%, rgba(40, 94, 69, 0.14), transparent 72%), radial-gradient(720px 420px at 14% 80%, rgba(23, 52, 41, 0.12), transparent 70%);
            pointer-events: none;
        }
        
        .code-fog {
            position: absolute;
            inset: -12% -20% -12% -4%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .layer {
            position: absolute;
            width: 165vw;
            left: -8vw;
            display: flex;
            flex-direction: column;
            gap: 0;
            will-change: transform, opacity;
            top: -6vh;
            transform: rotate(-0.3deg);
            opacity: .34;
            filter: blur(.55px);
        }
        
        .code-row {
            display: grid;
            grid-template-columns: 52px 1fr;
            align-items: center;
            min-height: 18px;
            padding: 1px 0;
            width: 165vw;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.45;
            color: var(--code);
            opacity: .26;
            transition: opacity .3s ease, color .3s ease, background-color .25s linear, filter .3s ease;
        }
        
        .code-row:nth-child(2n) {
            opacity: .3;
        }
        
        .code-row .ln {
            text-align: right;
            padding-right: 10px;
            color: #43515c;
            user-select: none;
        }
        
        .code-row .txt {
            white-space: pre;
            padding-right: 18px;
        }
        
        .code-row.wide .txt {
            font-size: 14px;
        }
        
        .code-row.hover {
            opacity: .44;
            color: rgba(189, 204, 216, 0.62);
            filter: blur(0);
        }

        .code-row.red {
            opacity: .42;
            color: var(--flash-red-ink);
            background: var(--flash-red);
            box-shadow: inset 0 0 0 1px rgba(217, 118, 118, 0.11);
        }
        
        .code-row.green {
            opacity: .42;
            color: var(--flash-green-ink);
            background: var(--flash-green);
            box-shadow: inset 0 0 0 1px rgba(117, 201, 150, 0.11);
        }
        
        .code-row.fade {
            opacity: .03;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: calc(100vh - 52px);
        }
        
        .hero-right {
            position: absolute;
            left: clamp(24px, 7vw, 120px);
            top: 50%;
            transform: translateY(-50%);
            width: min(420px, 36vw);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            z-index: 3;
        }
        
        .brand {
            margin: 0;
            font-size: clamp(32px, 4.9vw, 52px);
            line-height: 1;
            font-weight: 700;
            color: rgba(159, 212, 183, 0.92);
            letter-spacing: .2px;
            text-shadow: 0 0 20px rgba(54, 111, 81, 0.24);
        }
        
        .subtitle {
            margin: 10px 0 0;
            color: #c3d0dc;
            font-size: clamp(16px, 2vw, 23px);
            line-height: 1.26;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
        }
        
        .cta {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--accent-border);
            border-radius: 9px;
            padding: 10px 15px;
            background: rgba(16, 24, 21, 0.36);
            color: #bdd0c5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: border-color .14s linear, color .14s linear, background-color .14s linear;
        }
        
        .cta:hover {
            border-color: rgba(84, 163, 122, 0.64);
            color: #d0e0d7;
            background: rgba(27, 57, 43, 0.5);
        }
        
        .news {
            padding: 84px 18px 34px;
            display: grid;
            align-content: center;
        }
        
        .news-shell {
            width: min(780px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 10px;
        }
        
        .news-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }
        
        .news-head h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #d6dfe8;
        }
        
        .news-head a {
            border: 1px solid #2a3640;
            border-radius: 8px;
            color: #a8b6c3;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            padding: 5px 9px;
        }
        
        .news-list {
            display: grid;
            gap: 0;
        }
        
        .news-item {
            display: grid;
            gap: 4px;
            padding: 10px 0;
            border-bottom: 1px solid #19242b;
        }
        
        .news-item:last-child {
            border-bottom: none;
        }
        
        .news-meta {
            font-family: var(--mono);
            color: #7f8d9b;
            font-size: 11px;
        }
        
        .news-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: #d2dce5;
        }
        
        .news-text {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.35;
        }
        
        .news-empty {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }
        
        @media (max-width: 760px) {
            .top-nav {
                height: 50px;
            }
            .top-nav-inner {
                width: calc(100vw - 22px);
            }
            .hero-content {
                min-height: calc(100vh - 50px);
            }
            .hero-right {
                position: static;
                transform: none;
                width: min(520px, 92vw);
                display: block;
                text-align: center;
                margin: 0 auto;
                padding-top: 12vh;
            }
            .layer,
            .code-row {
                width: 205vw;
            }
            .subtitle {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <div class="top-nav">
        <div class="top-nav-inner">
            <span class="logo">CodeBug</span>
            <nav id="nav-links"></nav>
        </div>
    </div>

    <section class="screen hero" id="heroScreen">
        <div class="code-fog" id="codeFog" aria-hidden="true"></div>

        <div class="hero-content">
            <div class="hero-right">
                <h1 class="brand">CodeBug</h1>
                <p class="subtitle">Платформа для тренировки дебага.</p>
                <a class="cta" href="train.html">К тренировке</a>
            </div>
        </div>
    </section>

    <section class="screen news">
        <div class="news-shell">
            <div class="news-head">
                <h2>Новости</h2>
            </div>
            <div id="homeNewsList" class="news-list"></div>
            <div id="homeNewsEmpty" class="news-empty" style="display:none;">Пока нет новостей.</div>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] },
            svg: { fontCache: "global" }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="globalsubmissions.js"></script>
    <script src="submit.js"></script>
    <script>
        function escapeHtml(text) {
            return (text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function normalizeAnnouncementFormat(value) {
            const v = String(value || "plain").toLowerCase().trim();
            return v === "markdown" || v === "latex" ? v : "plain";
        }

        function latexAnnouncementToHtml(source) {
            const text = String(source || "").replace(/\r/g, "");
            let html = text
                .replace(/\\section\*\{([^}]*)\}/g, "<h3>$1</h3>")
                .replace(/\\subsection\*\{([^}]*)\}/g, "<h4>$1</h4>")
                .replace(/\\texttt\{([^}]*)\}/g, "<code>$1</code>")
                .replace(/\\textbf\{([^}]*)\}/g, "<strong>$1</strong>")
                .replace(/\\begin\{itemize\}/g, "<ul>")
                .replace(/\\end\{itemize\}/g, "</ul>");

            const lines = html.split("\n");
            const out = [];
            let inList = false;
            for (const rawLine of lines) {
                const line = rawLine.trim();
                if (!line) continue;
                if (line === "<ul>") {
                    inList = true;
                    out.push("<ul>");
                    continue;
                }
                if (line === "</ul>") {
                    inList = false;
                    out.push("</ul>");
                    continue;
                }
                if (line.startsWith("\\item ")) {
                    const itemText = line.slice(6).trim();
                    if (!inList) {
                        inList = true;
                        out.push("<ul>");
                    }
                    out.push(`<li>${itemText}</li>`);
                    continue;
                }
                if (inList) {
                    inList = false;
                    out.push("</ul>");
                }
                out.push(`<p>${line}</p>`);
            }
            if (inList) out.push("</ul>");
            return out.join("\n");
        }

        function formatAnnouncementText(item) {
            const format = normalizeAnnouncementFormat(item?.format);
            const src = String(item?.text || "");
            if (format === "markdown") {
                return DOMPurify.sanitize(marked.parse(src));
            }
            if (format === "latex") {
                return DOMPurify.sanitize(latexAnnouncementToHtml(src));
            }
            return escapeHtml(src).replace(/\n/g, "<br>");
        }

        function formatDate(ts) {
            if (!ts) return "без даты";
            const d = new Date(Number(ts));
            if (Number.isNaN(d.getTime())) return "без даты";
            return d.toLocaleDateString("ru-RU", {
                day: "2-digit",
                month: "2-digit"
            });
        }

        function renderHomeNews(items) {
            const list = document.getElementById("homeNewsList");
            const empty = document.getElementById("homeNewsEmpty");
            list.innerHTML = "";

            if (!items.length) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            items.slice(0, 5).forEach(item => {
                const article = document.createElement("article");
                article.className = "news-item";
                const title = item.title || "Обновление тренировки";
                const body = formatAnnouncementText(item) || "Новые задачи.";
                article.innerHTML = `
                    <div class="news-meta">${formatDate(item.created)}</div>
                    <h3 class="news-title">${escapeHtml(title)}</h3>
                    <div class="news-text">${body}</div>
                `;
                list.appendChild(article);
            });
            if (window.MathJax && typeof window.MathJax.typesetPromise === "function") {
                window.MathJax.typesetPromise([list]).catch((err) => console.warn("MathJax render failed", err));
            }
        }

        async function loadHomeNews() {
            const items = [];
            try {
                const latestSnap = await db.ref("site/announcement").get();
                if (latestSnap.exists()) {
                    items.push({
                        source: "latest",
                        ...latestSnap.val(),
                        created: latestSnap.val().created || 0
                    });
                }
            } catch (err) {
                console.warn("Latest announcement not loaded", err);
            }

            try {
                const listSnap = await db.ref("site/announcements").get();
                if (listSnap.exists()) {
                    const data = listSnap.val();
                    Object.keys(data).forEach(key => {
                        items.push({
                            id: key,
                            source: "list",
                            ...data[key]
                        });
                    });
                }
            } catch (err) {
                console.warn("Announcements list not loaded", err);
            }

            items.sort((a, b) => (b.created || 0) - (a.created || 0));
            const unique = [];
            const seen = new Set();
            for (const item of items) {
                const fingerprint = `${item.title || ""}|${item.text || ""}|${item.format || "plain"}|${item.created || 0}|${item.author || ""}`;
                if (seen.has(fingerprint)) continue;
                seen.add(fingerprint);
                unique.push(item);
            }
            renderHomeNews(unique);
        }

        async function initCodeEffect() {
            const hero = document.getElementById("heroScreen");
            const fog = document.getElementById("codeFog");
            if (!hero || !fog) return;

            let source = "";
            try {
                const resp = await fetch("code.cpp");
                source = await resp.text();
            } catch (err) {
                console.warn("code.cpp not loaded", err);
            }

            if (!source.trim()) {
                source = `#include <bits/stdc++.h>
using namespace std;
using ll = long long;
static inline ll norm_mod(ll x, ll mod) { ll r = x % mod; return r < 0 ? r + mod : r; }
static inline ll pow_mod(ll a, ll e, ll mod) { ll res = 1 % mod, base = norm_mod(a, mod); while (e > 0) { if (e & 1) res = (ll)((__int128)res * base % mod); base = (ll)((__int128)base * base % mod); e >>= 1; } return res; }
vector<int> prefix_function(const string& s) { vector<int> pi((int)s.size(), 0); for (int i = 1; i < (int)s.size(); ++i) { int j = pi[i - 1]; while (j > 0 && s[i] != s[j]) j = pi[j - 1]; if (s[i] == s[j]) ++j; pi[i] = j; } return pi; }
vector<int> z_function(const string& s) { vector<int> z((int)s.size(), 0); for (int i = 1, l = 0, r = 0; i < (int)s.size(); ++i) { if (i <= r) z[i] = min(r - i + 1, z[i - l]); while (i + z[i] < (int)s.size() && s[z[i]] == s[i + z[i]]) ++z[i]; if (i + z[i] - 1 > r) l = i, r = i + z[i] - 1; } return z; }
int main() { ios::sync_with_stdio(false); cin.tie(nullptr); int n = 0, q = 0; cin >> n >> q; vector<ll> a(n, 0); for (int i = 0; i < n; ++i) cin >> a[i]; vector<ll> pref(n + 1, 0); for (int i = 0; i < n; ++i) pref[i + 1] = pref[i] + a[i]; ll checksum = 0;
while (q--) { int type = 0; cin >> type; if (type == 1) { int idx = 1; ll x = 0; cin >> idx >> x; checksum ^= (x + idx + pow_mod(x + 7, 3, 1000000007LL)); a[idx - 1] = x; } else if (type == 2) { int l = 1, r = n; cin >> l >> r; cout << pref[r] - pref[l - 1] + (checksum & 7) << "\\n"; } else { string s; cin >> s; auto pi = prefix_function(s); cout << (pi.empty() ? 0 : pi.back()) + (checksum % 11) << "\\n"; } }
return 0; }`;
            }

            const baseLines = source.split(/\r?\n/).map(s => s.trimEnd()).filter(Boolean);
            fog.innerHTML = "";
            const layers = [{
                className: "layer"
            }];

            const rows = [];
            let lineNo = 100;
            for (const layerCfg of layers) {
                const block = document.createElement("div");
                block.className = layerCfg.className;

                for (let i = 0; i < 132; i++) {
                    const row = document.createElement("div");
                    row.className = "code-row";
                    const ln = document.createElement("span");
                    ln.className = "ln";
                    ln.textContent = String(lineNo++);
                    const txt = document.createElement("span");
                    txt.className = "txt";

                    const line = baseLines[(i + rows.length) % baseLines.length] || " ";
                    txt.textContent = line;

                    if (line.length > 140 || i % 11 === 0) {
                        row.classList.add("wide");
                    }

                    row.appendChild(ln);
                    row.appendChild(txt);
                    block.appendChild(row);
                    rows.push({
                        row,
                        txt
                    });
                }
                fog.appendChild(block);
            }

            const baseText = rows.map(r => r.txt.textContent);
            let pulseTimer = null;
            let driftTimer = null;

            function setHoverByPointer(clientX, clientY) {
                const heroRect = hero.getBoundingClientRect();
                if (clientY < heroRect.top || clientY > heroRect.bottom) {
                    rows.forEach((item) => item.row.classList.remove("hover"));
                    return;
                }
                rows.forEach((item) => {
                    const r = item.row.getBoundingClientRect();
                    const cx = r.left + r.width / 2;
                    const cy = r.top + r.height / 2;
                    const dx = Math.abs(clientX - cx);
                    const dy = Math.abs(clientY - cy);
                    if (dx < 760 && dy < 56) item.row.classList.add("hover");
                    else item.row.classList.remove("hover");
                });
            }

            function mutateLine(text) {
                const swaps = [{
                    from: "<=",
                    to: "<"
                }, {
                    from: "==",
                    to: "="
                }, {
                    from: "r]",
                    to: "r - 1]"
                }, {
                    from: "+ 1",
                    to: "- 1"
                }];
                for (const pair of swaps) {
                    if (text.includes(pair.from)) return text.replace(pair.from, pair.to);
                }
                return text;
            }

            function runPulse() {
                const idx = Math.floor(Math.random() * rows.length);
                const row = rows[idx];
                const txt = row.txt;
                const original = baseText[idx];
                const green = Math.random() > 0.55;

                row.row.classList.remove("red", "green");
                row.row.classList.add(green ? "green" : "red");
                if (Math.random() > 0.55) {
                    const next = mutateLine(original);
                    txt.textContent = next;
                }

                if (pulseTimer) clearTimeout(pulseTimer);
                pulseTimer = setTimeout(() => {
                    row.row.classList.remove("red", "green");
                    txt.textContent = original;
                }, 1000);
            }

            function runDrift() {
                const idx = Math.floor(Math.random() * rows.length);
                const row = rows[idx];
                const txt = row.txt;
                const original = baseText[idx];
                const mode = Math.floor(Math.random() * 4);
                let nextText = original;

                if (mode === 0) {
                    nextText = original + " // check";
                } else if (mode === 1) {
                    nextText = original.slice(0, Math.max(0, original.length - 12));
                } else if (mode === 2) {
                    nextText = mutateLine(original);
                } else {
                    row.row.classList.add("fade");
                }
                txt.textContent = nextText;

                if (driftTimer) clearTimeout(driftTimer);
                driftTimer = setTimeout(() => {
                    row.row.classList.remove("fade");
                    txt.textContent = original;
                }, 1800);
            }

            function schedulePulse() {
                const delay = 5000 + Math.floor(Math.random() * 5000);
                setTimeout(() => {
                    runPulse();
                    schedulePulse();
                }, delay);
            }

            function scheduleDrift() {
                const delay = 2500 + Math.floor(Math.random() * 4500);
                setTimeout(() => {
                    runDrift();
                    scheduleDrift();
                }, delay);
            }

            document.addEventListener("mousemove", (e) => setHoverByPointer(e.clientX, e.clientY), {
                passive: true
            });
            document.addEventListener("mouseleave", () => rows.forEach((item) => item.row.classList.remove("hover")));

            schedulePulse();
            scheduleDrift();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateNavbar();
            loadHomeNews();
            initCodeEffect();
        });
    </script>
</body>

</html>
