<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBug</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090b;
            --bg2: #0a0f12;
            --line: #1a232a;
            --ink: #d6dee6;
            --muted: #8d9aa7;
            --accent: #2e7755;
            --accent-border: rgba(71, 144, 106, 0.52);
            --code: rgba(120, 140, 155, 0.32);
            --code-hover: rgba(166, 185, 201, 0.56);
            --flash-red: rgba(170, 84, 84, 0.28);
            --flash-red-ink: rgba(236, 195, 195, 0.8);
            --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            color: var(--ink);
            background: linear-gradient(180deg, var(--bg), var(--bg2));
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: thin;
            scrollbar-color: #27323a #0a0d10;
        }

        .screen {
            min-height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .top-nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 8;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(26, 35, 42, 0.48);
            background: rgba(7, 10, 12, 0.34);
            backdrop-filter: blur(4px);
        }

        .top-nav-inner {
            width: min(1180px, 96vw);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav .logo {
            font-size: 14px;
            font-weight: 700;
            color: #d2dce5;
        }

        .top-nav nav {
            display: flex;
            gap: 14px;
        }

        .top-nav nav a {
            color: #91a0ad;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .top-nav nav a:hover {
            color: #ccd7e1;
        }

        .hero {
            position: relative;
            overflow: hidden;
            display: grid;
            align-items: center;
            padding: 24px;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(920px 480px at 74% 18%, rgba(40, 94, 69, 0.14), transparent 72%),
                radial-gradient(720px 420px at 14% 80%, rgba(23, 52, 41, 0.12), transparent 70%);
            pointer-events: none;
        }

        .code-fog {
            position: absolute;
            inset: -15%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .layer {
            position: absolute;
            width: 180vw;
            left: -40vw;
            display: flex;
            flex-direction: column;
            gap: 0;
            will-change: transform, opacity;
        }

        .layer-1 {
            top: -10vh;
            transform: rotate(-1deg);
            opacity: .22;
            filter: blur(1px);
        }

        .layer-2 {
            top: 22vh;
            transform: rotate(.5deg);
            opacity: .16;
            filter: blur(1.6px);
        }

        .layer-3 {
            top: 54vh;
            transform: rotate(-.6deg);
            opacity: .2;
            filter: blur(1.1px);
        }

        .code-row {
            display: grid;
            grid-template-columns: 52px 1fr;
            align-items: center;
            min-height: 18px;
            padding: 1px 0;
            width: 180vw;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.45;
            color: rgba(116, 134, 148, .76);
            opacity: .14;
            transition: opacity .3s ease, color .3s ease, background-color .25s linear, filter .3s ease;
        }

        .code-row:nth-child(2n) {
            opacity: .18;
        }

        .code-row .ln {
            text-align: right;
            padding-right: 10px;
            color: #43515c;
            user-select: none;
        }

        .code-row .txt {
            white-space: pre;
            padding-right: 18px;
        }

        .code-row.wide .txt {
            font-size: 13px;
        }

        .code-row.hover {
            opacity: .34;
            color: var(--code-hover);
            filter: blur(.2px);
        }

        .code-row.red {
            opacity: .62;
            color: #e0b7b7;
            background: var(--flash-red);
        }

        .code-row.green {
            opacity: .62;
            color: #b7d8c5;
            background: rgba(95, 178, 127, .18);
        }

        .code-row.fade {
            opacity: .03;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: min(1020px, 94vw);
            display: grid;
            justify-items: end;
            gap: 10px;
        }

        .hero-right {
            width: min(420px, 42vw);
            text-align: left;
            justify-self: end;
        }

        .brand {
            margin: 0;
            font-size: clamp(32px, 4.9vw, 52px);
            line-height: 1;
            font-weight: 700;
            color: rgba(120, 170, 145, 0.68);
            letter-spacing: .2px;
        }

        .subtitle {
            margin: 10px 0 0;
            color: #9aa7b3;
            font-size: clamp(16px, 2vw, 23px);
            line-height: 1.26;
        }

        .cta {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--accent-border);
            border-radius: 9px;
            padding: 10px 15px;
            background: rgba(16, 24, 21, 0.36);
            color: #bdd0c5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: border-color .14s linear, color .14s linear, background-color .14s linear;
        }

        .cta:hover {
            border-color: rgba(84, 163, 122, 0.64);
            color: #d0e0d7;
            background: rgba(27, 57, 43, 0.5);
        }

        .news {
            padding: 84px 18px 34px;
            display: grid;
            align-content: center;
        }

        .news-shell {
            width: min(780px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 10px;
        }

        .news-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .news-head h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            color: #d6dfe8;
        }

        .news-head a {
            border: 1px solid #2a3640;
            border-radius: 8px;
            color: #a8b6c3;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            padding: 5px 9px;
        }

        .news-list {
            display: grid;
            gap: 0;
        }

        .news-item {
            display: grid;
            gap: 4px;
            padding: 10px 0;
            border-bottom: 1px solid #19242b;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-meta {
            font-family: var(--mono);
            color: #7f8d9b;
            font-size: 11px;
        }

        .news-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: #d2dce5;
        }

        .news-text {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.35;
        }

        .news-open {
            margin-top: 2px;
            width: fit-content;
            color: #b7c4d0;
            text-decoration: none;
            font-size: 12px;
            border-bottom: 1px solid #2b3741;
            padding-bottom: 1px;
        }

        .news-empty {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 760px) {
            .top-nav {
                height: 50px;
            }

            .top-nav-inner {
                width: calc(100vw - 22px);
            }

            .hero-content {
                justify-items: center;
            }

            .hero-right {
                width: min(520px, 92vw);
                text-align: center;
                justify-self: center;
            }

            .layer,
            .code-row {
                width: 220vw;
            }

            .subtitle {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <div class="top-nav">
        <div class="top-nav-inner">
            <span class="logo">CodeBug</span>
            <nav id="nav-links"></nav>
        </div>
    </div>

    <section class="screen hero" id="heroScreen">
        <div class="code-fog" id="codeFog" aria-hidden="true"></div>

        <div class="hero-content">
            <div class="hero-right">
                <h1 class="brand">CodeBug</h1>
                <p class="subtitle">Где-то здесь ошибка.</p>
                <a class="cta" href="train.html">К тренировке</a>
            </div>
        </div>
    </section>

    <section class="screen news">
        <div class="news-shell">
            <div class="news-head">
                <h2>Новости</h2>
                <a href="news.html" id="homeNewsArchiveLink">Открыть</a>
            </div>
            <div id="homeNewsList" class="news-list"></div>
            <div id="homeNewsEmpty" class="news-empty" style="display:none;">Пока нет новостей.</div>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>
    <script src="globalsubmissions.js"></script>
    <script src="submit.js"></script>
    <script>
        function escapeHtml(text) {
            return (text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function trimText(text, limit) {
            if (!text) return "";
            const oneLine = text.replace(/\s+/g, " ").trim();
            if (oneLine.length <= limit) return oneLine;
            return oneLine.slice(0, limit).trimEnd() + "...";
        }

        function formatDate(ts) {
            if (!ts) return "без даты";
            const d = new Date(Number(ts));
            if (Number.isNaN(d.getTime())) return "без даты";
            return d.toLocaleDateString("ru-RU", {
                day: "2-digit",
                month: "2-digit"
            });
        }

        function renderHomeNews(items) {
            const list = document.getElementById("homeNewsList");
            const empty = document.getElementById("homeNewsEmpty");
            const archiveLink = document.getElementById("homeNewsArchiveLink");
            list.innerHTML = "";

            if (!items.length) {
                empty.style.display = "block";
                if (archiveLink) archiveLink.style.display = "none";
                return;
            }

            empty.style.display = "none";
            if (archiveLink) archiveLink.style.display = "inline-flex";

            items.slice(0, 5).forEach(item => {
                const article = document.createElement("article");
                article.className = "news-item";
                const title = item.title || "Обновление тренировки";
                const body = trimText(item.text || "", 72) || "Новые задачи.";
                article.innerHTML = `
                    <div class="news-meta">${formatDate(item.created)}</div>
                    <h3 class="news-title">${escapeHtml(title)}</h3>
                    <p class="news-text">${escapeHtml(body)}</p>
                    <a class="news-open" href="news.html">Подробнее</a>
                `;
                list.appendChild(article);
            });
        }

        async function loadHomeNews() {
            const items = [];
            try {
                const latestSnap = await db.ref("site/announcement").get();
                if (latestSnap.exists()) {
                    items.push({
                        source: "latest",
                        ...latestSnap.val(),
                        created: latestSnap.val().created || 0
                    });
                }
            } catch (err) {
                console.warn("Latest announcement not loaded", err);
            }

            try {
                const listSnap = await db.ref("site/announcements").get();
                if (listSnap.exists()) {
                    const data = listSnap.val();
                    Object.keys(data).forEach(key => {
                        items.push({
                            id: key,
                            source: "list",
                            ...data[key]
                        });
                    });
                }
            } catch (err) {
                console.warn("Announcements list not loaded", err);
            }

            items.sort((a, b) => (b.created || 0) - (a.created || 0));
            const unique = [];
            const seen = new Set();
            for (const item of items) {
                const fingerprint = `${item.title || ""}|${item.text || ""}|${item.created || 0}|${item.author || ""}`;
                if (seen.has(fingerprint)) continue;
                seen.add(fingerprint);
                unique.push(item);
            }
            renderHomeNews(unique);
        }

        async function initCodeEffect() {
            const hero = document.getElementById("heroScreen");
            const fog = document.getElementById("codeFog");
            if (!hero || !fog) return;

            let source = "";
            try {
                const resp = await fetch("code.cpp");
                source = await resp.text();
            } catch (err) {
                console.warn("code.cpp not loaded", err);
            }

            if (!source.trim()) {
                source = `#include <bits/stdc++.h>
using namespace std;
int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);
    int n; cin >> n;
    vector<long long> a(n);
    for (int i = 0; i < n; ++i) cin >> a[i];
    long long ans = 0;
    for (int i = 0; i <= n; ++i) ans += a[i];
    cout << ans << "\\n";
}`;
            }

            const baseLines = source.split(/\r?\n/).map(s => s.trimEnd()).filter(Boolean);
            fog.innerHTML = "";
            const layers = [{
                className: "layer-1"
            }, {
                className: "layer-2"
            }, {
                className: "layer-3"
            }];

            const rows = [];
            let lineNo = 100;
            for (const layerCfg of layers) {
                const block = document.createElement("div");
                block.className = `layer ${layerCfg.className}`;

                for (let i = 0; i < 60; i++) {
                    const row = document.createElement("div");
                    row.className = "code-row";
                    const ln = document.createElement("span");
                    ln.className = "ln";
                    ln.textContent = String(lineNo++);
                    const txt = document.createElement("span");
                    txt.className = "txt";
                    const line = baseLines[(i + rows.length) % baseLines.length] || " ";
                    txt.textContent = line;
                    if (line.length > 90 || i % 13 === 0) row.classList.add("wide");
                    row.appendChild(ln);
                    row.appendChild(txt);
                    block.appendChild(row);
                    rows.push(row);
                }
                fog.appendChild(block);
            }

            const baseText = rows.map(r => r.querySelector(".txt").textContent);
            let pulseTimer = null;
            let driftTimer = null;

            function setHoverByPointer(clientX, clientY) {
                const heroRect = hero.getBoundingClientRect();
                if (clientY < heroRect.top || clientY > heroRect.bottom) {
                    rows.forEach(row => row.classList.remove("hover"));
                    return;
                }
                rows.forEach((row) => {
                    const r = row.getBoundingClientRect();
                    const cx = r.left + r.width / 2;
                    const cy = r.top + r.height / 2;
                    const dx = Math.abs(clientX - cx);
                    const dy = Math.abs(clientY - cy);
                    if (dx < 760 && dy < 52) row.classList.add("hover");
                    else row.classList.remove("hover");
                });
            }

            function mutateLine(text) {
                const swaps = [{
                    from: "<=",
                    to: "<"
                }, {
                    from: "==",
                    to: "="
                }, {
                    from: "r]",
                    to: "r - 1]"
                }, {
                    from: "+ 1",
                    to: "- 1"
                }];
                for (const pair of swaps) {
                    if (text.includes(pair.from)) return text.replace(pair.from, pair.to);
                }
                return text;
            }

            function runPulse() {
                const idx = Math.floor(Math.random() * rows.length);
                const row = rows[idx];
                const txt = row.querySelector(".txt");
                const original = baseText[idx];
                const green = Math.random() > 0.55;

                row.classList.remove("red", "green");
                row.classList.add(green ? "green" : "red");
                if (Math.random() > 0.55) txt.textContent = mutateLine(original);

                if (pulseTimer) clearTimeout(pulseTimer);
                pulseTimer = setTimeout(() => {
                    row.classList.remove("red", "green");
                    txt.textContent = original;
                }, 1000);
            }

            function runDrift() {
                const idx = Math.floor(Math.random() * rows.length);
                const row = rows[idx];
                const txt = row.querySelector(".txt");
                const original = baseText[idx];
                const mode = Math.floor(Math.random() * 4);

                if (mode === 0) {
                    txt.textContent = original + " // check";
                } else if (mode === 1) {
                    txt.textContent = original.slice(0, Math.max(0, original.length - 12));
                } else if (mode === 2) {
                    txt.textContent = mutateLine(original);
                } else {
                    row.classList.add("fade");
                }

                if (driftTimer) clearTimeout(driftTimer);
                driftTimer = setTimeout(() => {
                    row.classList.remove("fade");
                    txt.textContent = original;
                }, 1800);
            }

            function schedulePulse() {
                const delay = 5000 + Math.floor(Math.random() * 5000);
                setTimeout(() => {
                    runPulse();
                    schedulePulse();
                }, delay);
            }

            function scheduleDrift() {
                const delay = 2500 + Math.floor(Math.random() * 4500);
                setTimeout(() => {
                    runDrift();
                    scheduleDrift();
                }, delay);
            }

            document.addEventListener("mousemove", (e) => setHoverByPointer(e.clientX, e.clientY), {
                passive: true
            });
            document.addEventListener("mouseleave", () => rows.forEach(row => row.classList.remove("hover")));

            schedulePulse();
            scheduleDrift();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateNavbar();
            loadHomeNews();
            initCodeEffect();
        });
    </script>
</body>

</html>
