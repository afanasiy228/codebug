<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Соревнования — CodeBug</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f1e7;
      --bg-strong: #f0e6d8;
      --ink: #1a1612;
      --muted: #5f5b54;
      --accent: #3B82F6;
      --accent-strong: #60A5FA;
      --warm: #f3b562;
      --card: #fffaf2;
      --stroke: #e2d6c4;
      --shadow: 0 20px 60px rgba(26, 22, 18, 0.12);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background:
        radial-gradient(1200px 500px at 15% -10%, rgba(59, 130, 246, 0.18), transparent 60%),
        radial-gradient(900px 500px at 85% 0%, rgba(243, 181, 98, 0.25), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg-strong));
      min-height: 100vh;
    }

    header {
      height: 72px;
      background: rgba(255, 250, 242, 0.8);
      border-bottom: 1px solid rgba(226, 214, 196, 0.6);
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 30px rgba(26, 22, 18, 0.08);
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--ink);
    }

    nav a {
      margin-left: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--accent);
    }

    .container {
      width: min(1100px, 92vw);
      margin: 40px auto 80px;
    }

    .page-title {
      font-size: 34px;
      font-weight: 700;
      font-family: "Space Grotesk", sans-serif;
      margin: 0 0 10px;
    }

    .page-subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .section {
      margin-bottom: 32px;
    }

    .section h2 {
      font-size: 22px;
      margin: 0 0 14px;
      font-family: "Space Grotesk", sans-serif;
    }

    .contest-grid {
      display: grid;
      gap: 16px;
    }

    .contest-card {
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
    }

    .contest-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .contest-meta {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .profile-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .profile-link:hover {
      text-decoration: underline;
    }

    .contest-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    button {
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 14px 32px rgba(59, 130, 246, 0.25);
    }

    button.secondary {
      background: rgba(59, 130, 246, 0.12);
      color: var(--accent);
    }

    .empty {
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--stroke);
      color: var(--muted);
    }
  </style>
  <link rel="stylesheet" href="theme-dark.css">
</head>

<body>
  <header>
    <div class="logo">CodeBug</div>
    <nav id="nav-links"></nav>
  </header>

  <main class="container">
    <h1 class="page-title">Соревнования</h1>
    <p class="page-subtitle">Идущие, предстоящие и прошедшие соревнования. Регистрация обязательна для участия.</p>
    <section class="section" id="createContestSection" style="display:none;">
      <h2>Создать приватное соревнование (PRO+)</h2>
      <div style="display:grid;gap:10px;">
        <input id="ccTitle" placeholder="Название" style="padding:10px;border-radius:10px;border:1px solid var(--stroke);background:#0b1528;color:#fff;">
        <input id="ccTasks" placeholder="ID задач через запятую (например: 1,2,3)" style="padding:10px;border-radius:10px;border:1px solid var(--stroke);background:#0b1528;color:#fff;">
        <input id="ccAllowed" placeholder="Логины участников через запятую" style="padding:10px;border-radius:10px;border:1px solid var(--stroke);background:#0b1528;color:#fff;">
        <label style="color:var(--muted);font-size:13px;">Старт (UTC ISO)</label>
        <input id="ccStart" placeholder="2026-06-10T15:00:00Z" style="padding:10px;border-radius:10px;border:1px solid var(--stroke);background:#0b1528;color:#fff;">
        <label style="color:var(--muted);font-size:13px;">Финиш (UTC ISO)</label>
        <input id="ccEnd" placeholder="2026-06-10T18:00:00Z" style="padding:10px;border-radius:10px;border:1px solid var(--stroke);background:#0b1528;color:#fff;">
        <button type="button" onclick="createPrivateContest()">Создать</button>
      </div>
    </section>

    <section class="section">
      <h2>Идут сейчас</h2>
      <div id="ongoingList" class="contest-grid"></div>
      <div id="ongoingEmpty" class="empty" style="display:none;">Сейчас нет активных соревнований.</div>
    </section>

    <section class="section">
      <h2>Предстоящие</h2>
      <div id="upcomingList" class="contest-grid"></div>
      <div id="upcomingEmpty" class="empty" style="display:none;">Нет запланированных соревнований.</div>
    </section>

    <section class="section">
      <h2>Прошедшие</h2>
      <div id="finishedList" class="contest-grid"></div>
      <div id="finishedEmpty" class="empty" style="display:none;">Пока нет прошедших соревнований.</div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="firebase.js"></script>
  <script src="auth.js?v=20260528-3"></script>

  <script>
    updateNavbar();

    const user = getUser();

    async function initCreateContestSection() {
      if (!user) return;
      try {
        const sub = await getUserSubscription(user);
        const level = (typeof getSubscriptionLevel === "function") ? getSubscriptionLevel(sub) : "free";
        if (level === "pro_plus") {
          const sec = document.getElementById("createContestSection");
          if (sec) sec.style.display = "block";
        }
      } catch (_) {}
    }

    async function createPrivateContest() {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }
      const title = String(document.getElementById("ccTitle")?.value || "").trim();
      const tasks = String(document.getElementById("ccTasks")?.value || "").split(",").map(x => Number(x.trim())).filter(x => Number.isInteger(x));
      const allowed = String(document.getElementById("ccAllowed")?.value || "").split(",").map(x => x.trim()).filter(Boolean);
      const startRaw = String(document.getElementById("ccStart")?.value || "").trim();
      const endRaw = String(document.getElementById("ccEnd")?.value || "").trim();
      const start = Date.parse(startRaw);
      const end = Date.parse(endRaw);
      if (!title || !tasks.length || !Number.isFinite(start) || !Number.isFinite(end) || end <= start) {
        alert("Проверь поля формы.");
        return;
      }
      const base = window.getTasksApiBase ? window.getTasksApiBase() : (window.TASKS_API_BASE || "https://codebug.onrender.com");
      const auth = typeof getAuth === "function" ? getAuth() : null;
      const token = auth?.currentUser ? await auth.currentUser.getIdToken() : "";
      const resp = await fetch(`${base}/contests/create`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {})
        },
        body: JSON.stringify({
          title,
          tasks,
          allowedUsers: allowed,
          start,
          end,
          visibility: "private"
        })
      });
      const payload = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        alert(payload.error || "Не удалось создать контест");
        return;
      }
      alert("Контест создан.");
      loadContests();
    }

    function formatUtc(ts) {
      if (!ts) return "—";
      return new Date(ts).toISOString().replace("T", " ").replace(".000Z", " UTC");
    }

    function formatContestEnd(contest) {
      if (!contest?.end) return "—";
      const durationMs = Math.max(0, Number(contest.end) - Number(contest.start || 0));
      if (durationMs > 1000 * 60 * 60 * 24 * 365) {
        return "Без ограничения времени";
      }
      return formatUtc(contest.end);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const contestListUserSubCache = {};
    const contestListUserExpCache = {};

    function profileLink(login) {
      const safeLogin = escapeHtml(login);
      const sub = contestListUserSubCache[String(login)] || {};
      const exp = Number(contestListUserExpCache[String(login)] || 0);
      const level = (typeof getSubscriptionLevel === "function") ? getSubscriptionLevel(sub) : "free";
      const isPro = level !== "free";
      const color = isPro && typeof getSubscriptionNickColor === "function"
        ? getSubscriptionNickColor(sub)
        : (typeof getRankNickColorByExp === "function" ? getRankNickColorByExp(exp) : "#F8FAFC");
      const nickHtml = (typeof buildStyledNickHtml === "function")
        ? buildStyledNickHtml(login, sub, color)
        : safeLogin;
      return `<a class="profile-link" href="profile.html?user=${encodeURIComponent(login)}">${nickHtml}</a>`;
    }

    function renderAuthorLinks(authors) {
      return (authors || []).map(profileLink).join(", ") || "—";
    }

    function statusFromTimes(start, end) {
      const now = Date.now();
      if (now < start) return "upcoming";
      if (now >= start && now <= end) return "ongoing";
      return "finished";
    }

    async function registerContest(contestId, status) {
      if (!user) {
        alert("Войдите, чтобы зарегистрироваться.");
        window.location.href = "auth.html";
        return;
      }
      if (status === "finished") {
        alert("Регистрация на завершённый контест закрыта.");
        return;
      }
      const base = window.getTasksApiBase ? window.getTasksApiBase() : (window.TASKS_API_BASE || "https://codebug.onrender.com");
      const auth = typeof getAuth === "function" ? getAuth() : null;
      const token = auth?.currentUser ? await auth.currentUser.getIdToken() : "";
      const res = await fetch(`${base}/contest/register`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {})
        },
        body: JSON.stringify({ contestId })
      });
      if (!res.ok) {
        const payload = await res.json().catch(() => ({}));
        alert(payload.error || "Не удалось зарегистрироваться");
        return;
      }
      loadContests();
    }

    async function renderList(list, containerId, emptyId) {
      const container = document.getElementById(containerId);
      const empty = document.getElementById(emptyId);
      container.innerHTML = "";
      if (!list.length) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      for (const contest of list) {
        let registered = false;
        if (user) {
          const regSnap = await db.ref(`contest_regs/${contest.id}/${user}`).get();
          registered = regSnap.exists();
        }

        const card = document.createElement("div");
        card.className = "contest-card";
        const registerDisabled = contest.status === "finished" || registered;
        const registerLabel = contest.status === "finished"
          ? "Регистрация закрыта"
          : (registered ? "Вы зарегистрированы" : "Зарегистрироваться");
        const safeId = String(contest.id || "");
        card.innerHTML = `
          <div class="badge">${contest.statusLabel}</div>
          <h3 class="contest-title">${escapeHtml(contest.title || "Соревнование")}</h3>
          <div class="contest-meta">
            <span>Старт: ${formatUtc(contest.start)}</span>
            <span>Финиш: ${formatContestEnd(contest)}</span>
            <span>Автор(ы): ${renderAuthorLinks(contest.authors)}</span>
          </div>
          <div class="contest-actions">
            <button type="button" class="open-contest-btn">Открыть</button>
            <button type="button" class="secondary register-contest-btn" ${registerDisabled ? "disabled" : ""}>
              ${registerLabel}
            </button>
          </div>
        `;
        card.querySelector(".open-contest-btn")?.addEventListener("click", () => openContest(safeId));
        card.querySelector(".register-contest-btn")?.addEventListener("click", () => registerContest(safeId, contest.status));
        container.appendChild(card);
      }
    }

    function openContest(id) {
      window.location.href = `contest.html?id=${id}`;
    }

    async function loadContests() {
      const snap = await db.ref("contests").get();
      const usersSnap = await db.ref("users").get();
      if (usersSnap.exists()) {
        const usersData = usersSnap.val() || {};
        for (const [login, data] of Object.entries(usersData)) {
          contestListUserSubCache[String(login)] = (data && data.subscription) || {};
          contestListUserExpCache[String(login)] = Number(data?.stats?.exp || 0);
        }
      }
      const contests = [];
      if (snap.exists()) {
        const data = snap.val();
        Object.keys(data).forEach(id => {
          const item = data[id];
          contests.push({
            id,
            ...item
          });
        });
      }

      const now = Date.now();
      const ongoing = [];
      const upcoming = [];
      const finished = [];

      contests.forEach(contest => {
        const visibility = String(contest.visibility || "public").toLowerCase();
        const owner = String(contest.ownerLogin || "").trim();
        const allowed = Array.isArray(contest.allowedUsers) ? contest.allowedUsers.map(v => String(v || "").trim()) : [];
        if (visibility === "private" && (!user || (user !== owner && !allowed.includes(user)))) {
          return;
        }
        const status = statusFromTimes(contest.start, contest.end);
        const statusLabel = status === "ongoing" ? "Идет" : status === "upcoming" ? "Скоро" : "Завершен";
        const entry = { ...contest, status, statusLabel };
        if (status === "ongoing") ongoing.push(entry);
        else if (status === "upcoming") upcoming.push(entry);
        else finished.push(entry);
      });

      ongoing.sort((a, b) => a.end - b.end);
      upcoming.sort((a, b) => a.start - b.start);
      finished.sort((a, b) => b.end - a.end);

      await renderList(ongoing, "ongoingList", "ongoingEmpty");
      await renderList(upcoming, "upcomingList", "upcomingEmpty");
      await renderList(finished, "finishedList", "finishedEmpty");
    }

    initCreateContestSection();
    loadContests();
  </script>
</body>

</html>
