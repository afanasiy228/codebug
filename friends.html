<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set these pages actually load; 'unsafe-inline' is
      required because the page logic lives in inline <script> blocks, so the value
      of this policy is that it pins WHICH hosts may serve scripts and WHERE data
      may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag.
      Clickjacking protection for this static site needs an HTTP header at the CDN.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.europe-west1.firebasedatabase.app;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com https://*.europe-west1.firebasedatabase.app;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Друзья — CodeBug</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <style>
    :root {
      --bg: #050505;
      --bg-strong: #0B0B0B;
      --ink: #FFFFFF;
      --muted: #B0B0B0;
      --accent: #F59E0B;
      --accent-strong: #FBBF24;
      --warm: #F59E0B;
      --card: #121212;
      --stroke: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
        linear-gradient(180deg, var(--bg), var(--bg-strong));
      min-height: 100vh;
    }

    header {
      height: 72px;
      background: rgba(5, 5, 5, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: none;
    }

    .logo {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--ink);
    }

    nav a {
      margin-left: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--accent);
    }

    .container {
      width: min(1000px, 92vw);
      margin: 40px auto 80px;
    }

    .page-title {
      font-size: 32px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0 0 12px;
    }

    .friends-box {
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .friends-list {
      display: grid;
      gap: 12px;
    }

    .friend-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--stroke);
      background: rgba(245, 158, 11, 0.08);
    }

    .friend-name {
      font-weight: 600;
    }

    .friend-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .friend-link {
      text-decoration: none;
      color: var(--ink);
    }

    .friend-link:hover .friend-name {
      color: var(--accent);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 14px;
    }
  </style>
  <link rel="stylesheet" href="theme-dark.css">
</head>

<body>
  <header>
    <div class="logo">CodeBug</div>
    <nav id="nav-links"></nav>
  </header>

  <main class="container">
    <h1 class="page-title">Друзья</h1>
    <div class="friends-box">
      <div id="friendsList" class="friends-list"></div>
      <div id="friendsEmpty" class="empty" style="display:none;">Пока нет друзей…</div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="auth.js?v=20260907-auth-privacy"></script>

  <script>
    updateNavbar();
    const user = getUser();
    if (!user) window.location.href = "auth.html";
    startPresence();

    async function loadFriends() {
      const list = document.getElementById("friendsList");
      const empty = document.getElementById("friendsEmpty");
      list.innerHTML = "";

      const snap = await db.ref("users/" + user + "/friends").get();
      if (!snap.exists()) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      const friends = Object.keys(snap.val());
      const rows = [];

      for (const login of friends) {
        const ratingSnap = await db.ref("ratingLeaderboard/" + login + "/rating").get();
        const rating = Number(ratingSnap.val() || 0);
        rows.push({ login, rating });
      }

      rows.sort((a, b) => b.rating - a.rating);

      for (const row of rows) {
        const card = document.createElement("div");
        card.className = "friend-card";

        // Built as DOM nodes rather than an innerHTML template: row.login is a raw
        // Realtime Database key, and RTDB keys may legally contain < > and quotes.
        const link = document.createElement("a");
        link.className = "friend-link";
        link.href = "profile.html?user=" + encodeURIComponent(row.login);

        const name = document.createElement("div");
        name.className = "friend-name";
        name.textContent = row.login;

        const meta = document.createElement("div");
        meta.className = "friend-meta";
        meta.textContent = "Рейтинг: " + row.rating;

        link.appendChild(name);
        link.appendChild(meta);
        card.appendChild(link);
        list.appendChild(card);
      }
    }

    loadFriends();
  </script>
</body>

</html>
