<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Друзья — CodeBug</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --bg-strong: #0B0B0B;
      --ink: #FFFFFF;
      --muted: #B0B0B0;
      --accent: #F59E0B;
      --accent-strong: #FBBF24;
      --warm: #F59E0B;
      --card: #121212;
      --stroke: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
        linear-gradient(180deg, var(--bg), var(--bg-strong));
      min-height: 100vh;
    }

    header {
      height: 72px;
      background: rgba(5, 5, 5, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: none;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--ink);
    }

    nav a {
      margin-left: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--accent);
    }

    .container {
      width: min(1000px, 92vw);
      margin: 40px auto 80px;
    }

    .page-title {
      font-size: 32px;
      font-family: "Space Grotesk", sans-serif;
      margin: 0 0 12px;
    }

    .friends-box {
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .friends-list {
      display: grid;
      gap: 12px;
    }

    .friend-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--stroke);
      background: rgba(245, 158, 11, 0.08);
    }

    .friend-name {
      font-weight: 600;
    }

    .friend-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .friend-link {
      text-decoration: none;
      color: var(--ink);
    }

    .friend-link:hover .friend-name {
      color: var(--accent);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 14px;
    }
  </style>
  <link rel="stylesheet" href="theme-dark.css">
</head>

<body>
  <header>
    <div class="logo">CodeBug</div>
    <nav id="nav-links"></nav>
  </header>

  <main class="container">
    <h1 class="page-title">Друзья</h1>
    <div class="friends-box">
      <div id="friendsList" class="friends-list"></div>
      <div id="friendsEmpty" class="empty" style="display:none;">Пока нет друзей…</div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase.js"></script>
  <script src="auth.js?v=20260528-3"></script>

  <script>
    updateNavbar();
    const user = getUser();
    if (!user) window.location.href = "auth.html";
    startPresence();

    async function loadFriends() {
      const list = document.getElementById("friendsList");
      const empty = document.getElementById("friendsEmpty");
      list.innerHTML = "";

      const snap = await db.ref("users/" + user + "/friends").get();
      if (!snap.exists()) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      const friends = Object.keys(snap.val());
      const rows = [];

      for (const login of friends) {
        const ratingSnap = await db.ref("ratingLeaderboard/" + login + "/rating").get();
        const rating = Number(ratingSnap.val() || 0);
        rows.push({ login, rating });
      }

      rows.sort((a, b) => b.rating - a.rating);

      for (const row of rows) {
        const card = document.createElement("div");
        card.className = "friend-card";
        card.innerHTML = `
          <a class="friend-link" href="profile.html?user=${encodeURIComponent(row.login)}">
            <div class="friend-name">${row.login}</div>
            <div class="friend-meta">Рейтинг: ${row.rating}</div>
          </a>
        `;
        list.appendChild(card);
      }
    }

    loadFriends();
  </script>
</body>

</html>
