<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBug — Задача</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
         :root {
            --bg: #f7f1e7;
            --bg-strong: #f0e6d8;
            --ink: #1a1612;
            --muted: #5f5b54;
            --accent: #0f766e;
            --accent-strong: #0b5f59;
            --warm: #f3b562;
            --card: #fffaf2;
            --stroke: #e2d6c4;
            --shadow: 0 20px 60px rgba(26, 22, 18, 0.12);
            --radius-lg: 22px;
            --radius-md: 14px;
        }
        
        body {
            margin: 0;
            color: var(--ink);
            font-family: "IBM Plex Sans", sans-serif;
            overflow: hidden;
            background: radial-gradient(1200px 500px at 15% -10%, rgba(15, 118, 110, 0.18), transparent 60%), radial-gradient(900px 500px at 85% 0%, rgba(243, 181, 98, 0.25), transparent 60%), linear-gradient(180deg, var(--bg), var(--bg-strong));
        }
        
         ::selection {
            background: rgba(15, 118, 110, 0.2);
        }
        
        * {
            box-sizing: border-box;
        }
        /* HEADER */
        
        header {
            height: 72px;
            padding: 0 4vw;
            background: rgba(255, 250, 242, 0.8);
            border-bottom: 1px solid rgba(226, 214, 196, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 30px rgba(26, 22, 18, 0.08);
        }
        
        .logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--ink);
        }
        
        nav a {
            margin-left: 20px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        
        nav a:hover {
            color: var(--accent);
        }
        /* LAYOUT */
        
        table td,
        table th {
            text-align: center;
        }
        
        table {
            margin-left: auto;
            margin-right: auto;
        }
        
        .split-v {
            display: flex;
            height: calc(100vh - 72px);
            width: 100%;
            overflow: hidden;
        }
        
        .io-block {
            background: #fff;
            border: 1px solid var(--stroke);
            padding: 10px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            margin-top: 4px;
        }
        
        .left {
            width: 40%;
            min-width: 260px;
            max-width: 70%;
            padding: 20px;
            background: var(--card);
            border-right: 1px solid rgba(226, 214, 196, 0.8);
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .section-title {
            font-family: "Space Grotesk", sans-serif;
            margin: 22px 0 10px;
            font-size: 18px;
            color: var(--ink);
        }
        
        .splitter-v {
            width: 6px;
            cursor: col-resize;
            background: rgba(226, 214, 196, 0.9);
            flex-shrink: 0;
        }
        
        .splitter-v:hover {
            background: var(--accent);
        }
        
        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 250, 242, 0.7);
            overflow: hidden;
        }
        
        #editorArea {
            flex: 1;
            overflow: hidden;
            padding: 18px 18px 0;
        }
        
        .editor-wrap {
            position: relative;
            height: 100%;
            width: 100%;
            background: #0b1119;
            border: 1px solid var(--stroke);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(226, 214, 196, 0.25);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(230, 237, 243, 0.8);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            padding: 0;
        }

        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(226, 214, 196, 0.45);
            color: rgba(230, 237, 243, 1);
        }

        .copy-code-btn svg {
            width: 14px;
            height: 14px;
            pointer-events: none;
        }

        .reset-code-btn {
            position: absolute;
            top: 8px;
            right: 44px;
            height: 28px;
            border: 1px solid rgba(226, 214, 196, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.025);
            color: rgba(230, 237, 243, 0.62);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            z-index: 3;
            padding: 0 9px;
            transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .reset-code-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(226, 214, 196, 0.35);
            color: rgba(230, 237, 243, 0.9);
        }
        
        #editor {
            height: 100%;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
        }
        
        .splitter-h {
            height: 6px;
            cursor: row-resize;
            background: rgba(226, 214, 196, 0.9);
        }
        
        .splitter-h:hover {
            background: var(--accent);
        }
        /* SUBMISSIONS PANEL */
        
        #testsPanel {
            height: 240px;
            min-height: 120px;
            background: var(--card);
            border-top: 1px solid rgba(226, 214, 196, 0.8);
            padding: 16px 18px;
            overflow-y: auto;
        }

        .panel-title {
            margin: 0 0 10px;
            color: var(--ink);
            font-family: "Space Grotesk", sans-serif;
            font-size: 16px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--ink);
        }
        
        th,
        td {
            border-bottom: 1px solid rgba(226, 214, 196, 0.8);
            padding: 8px;
            font-size: 14px;
        }
        
        th {
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .ctrl {
            display: flex;
            gap: 12px;
            padding: 12px 18px 18px;
            background: var(--card);
            border-top: 1px solid var(--stroke);
        }
        
        #taskStatement {
            font-size: 16.5px;
            line-height: 1.45;
        }
        
        #taskHelp {
            font-size: 16.5px;
            line-height: 1.45;
        }
        
        .task-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 18px;
        }

        .statement-toolbar {
            display: flex;
            justify-content: flex-start;
            margin: 2px 0 8px;
        }

        .language-switch {
            display: inline-flex;
            gap: 2px;
            padding: 2px;
            border: 1px solid rgba(226, 214, 196, 0.55);
            border-radius: 8px;
            background: rgba(255, 250, 242, 0.35);
        }

        .lang-btn {
            min-width: 30px;
            padding: 2px 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none;
        }

        .lang-btn.active {
            background: rgba(15, 118, 110, 0.1);
            color: var(--accent);
        }
        
        .task-tag {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(226, 214, 196, 0.8);
            background: rgba(15, 118, 110, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .btn {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.25);
        }
        
        .btn:hover {
            background: var(--accent-strong);
        }
        
        .testcase {
            margin-bottom: 12px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--stroke);
            white-space: pre-wrap;
        }
        
        .kf-block {
            margin-top: 20px;
        }
        
        .kf-title {
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 16px;
            color: var(--ink);
        }
        
        .kf-io {
            background: #fff;
            border: 1px solid var(--stroke);
            border-radius: 8px;
            padding: 0;
            margin-bottom: 22px;
            position: relative;
        }
        
        .kf-copy {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #f8f1e6;
            border: 1px solid var(--stroke);
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--ink);
        }
        
        .kf-copy:hover {
            border-color: var(--accent);
        }
        
        .kf-pre {
            white-space: pre-wrap;
            padding: 16px;
            margin: 0;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.35;
            color: var(--ink);
            background: transparent;
        }
        
        .kf-pre {
            font-size: 13.5px;
            padding: 10px;
            line-height: 1.25;
        }
        
        .testcase-block {
            margin-bottom: 70px;
            /* ровно один маленький отступ */
        }
        
        #taskTitle {
            font-family: "Space Grotesk", sans-serif;
            margin-top: 0;
        }
        
        .reveal {
            opacity: 0;
            transform: translateY(18px);
            animation: fadeUp 0.7s ease forwards;
            animation-delay: var(--delay, 0s);
        }
        
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 980px) {
            body {
                overflow: auto;
            }
            .split-v {
                flex-direction: column;
                height: auto;
            }
            .left {
                width: 100%;
                max-width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(226, 214, 196, 0.8);
            }
            .splitter-v,
            .splitter-h {
                display: none;
            }
            #editorArea {
                padding: 16px;
            }
            #testsPanel {
                height: auto;
                min-height: 160px;
            }
            .ctrl {
                flex-direction: column;
            }
        }
        
        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .reveal {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
    <link rel="stylesheet" href="theme-dark.css">
</head>

<body>

    <!-- ===================== GLOBAL SUBMISSIONS ===================== -->
    <script>
        function addSubmissionToTable(idx, sub) {
            const body = document.getElementById("subs");
            const tr = document.createElement("tr");

            const color = sub.status === "OK" ? "#4f4" : "#f55";
            const date = new Date(sub.date).toLocaleTimeString();

            tr.innerHTML = `
        <td>${idx}</td>
        <td style="color:${color}; font-weight:600;">${sub.status}</td>
        <td>${date}</td>
        <td>—</td>
    `;

            body.appendChild(tr);
        }
    </script>
    <script>
        async function saveGlobalSubmission(user, problem, verdict) {
            const entry = {
                user: String(user),
                problem: String(problem),
                status: String(verdict),
                date: Date.now()
            };

            await firebase.database().ref("submissions").push().set(entry);

            console.log("🔥 Глобальная посылка сохранена:", entry);
        }
    </script>

    <!-- ===================== SUBMIT CODE ===================== -->
    <script>
        console.log("%c[profile submit.js] загружен", "color:#0f0; font-weight:bold;");

        /* ============================================================
           SETTINGS
           ============================================================ */

        function getTasksApiBase() {
            const fallback = location.hostname === "localhost"
                ? "http://localhost:7777"
                : "https://codebug.onrender.com";
            return (window.TASKS_API_BASE || window.CODEBUG_API_BASE || fallback).replace(/\/$/, "");
        }

        const SUBMIT_URL = getTasksApiBase() + "/submit";

        if (!window.firebase) {
            console.error("🔥 Firebase не загружен!");
        }

        /* ============================================================
           SUBMIT CODE (универсальная версия)
           ============================================================ */

        let TASK_DIFFICULTY = "easy";
        let TASK_LANGUAGE = "cpp";
        let SUBS_POLL_TIMER = null;
        let BASELINE_CODE = "";
        let DRAFT_SAVE_TIMER = null;
        let SUPPRESS_DRAFT_SAVE = false;

        function draftStorageKey() {
            const taskId = resolveTaskIdFromLocation();
            const user = getUser ? (getUser() || "anonymous") : "anonymous";
            const lang = normalizeTaskLanguage(TASK_LANGUAGE);
            return taskId === null ? null : `codebug:draft:${user}:${taskId}:${lang}`;
        }

        function loadEditorDraft() {
            const key = draftStorageKey();
            if (!key) return null;
            try {
                return localStorage.getItem(key);
            } catch (_) {
                return null;
            }
        }

        function saveEditorDraftNow() {
            if (SUPPRESS_DRAFT_SAVE || !window.editor || !editor.getValue) return;
            const key = draftStorageKey();
            if (!key) return;
            try {
                localStorage.setItem(key, editor.getValue());
            } catch (e) {
                console.warn("[draft] save failed", e);
            }
        }

        function scheduleEditorDraftSave() {
            if (SUPPRESS_DRAFT_SAVE) return;
            clearTimeout(DRAFT_SAVE_TIMER);
            DRAFT_SAVE_TIMER = setTimeout(saveEditorDraftNow, 500);
        }

        function setEditorCodeFromTask(code) {
            BASELINE_CODE = code == null ? "" : String(code);
            const draft = loadEditorDraft();
            const value = draft !== null ? draft : BASELINE_CODE;
            SUPPRESS_DRAFT_SAVE = true;
            if (window.editor) editor.setValue(value);
            SUPPRESS_DRAFT_SAVE = false;
        }

        function resetEditorDraft() {
            const key = draftStorageKey();
            if (key) {
                try {
                    localStorage.removeItem(key);
                } catch (_) {}
            }
            SUPPRESS_DRAFT_SAVE = true;
            if (window.editor) editor.setValue(BASELINE_CODE || "");
            SUPPRESS_DRAFT_SAVE = false;
        }

        function startSubmissionPolling() {
            if (SUBS_POLL_TIMER) clearInterval(SUBS_POLL_TIMER);
            let ticks = 0;
            let solvedSeenAtTick = null;
            let solvedStatsLogged = false;
            SUBS_POLL_TIMER = setInterval(async () => {
                ticks += 1;
                const latest = await loadMySubsForThisProblem();
                if (latest && isSolvedVerdict(latest)) {
                    if (solvedSeenAtTick === null) solvedSeenAtTick = ticks;
                    console.group("%c[XP TRACE][CLIENT] polling observed solved", "color:#7fff7f;font-weight:bold;");
                    console.log("tick =", ticks);
                    console.log("submissionId =", latest._id || latest.id || null);
                    console.log("task =", latest.task);
                    console.log("verdict =", latest.verdict);
                    console.log("status =", latest.status);
                    console.log("statusLabel =", latest.statusLabel);
                    console.log("score =", latest.score);
                    console.log("date =", latest.date ? new Date(latest.date).toISOString() : null);
                    console.log("xpMarked =", latest.xpMarked);
                    console.log("xpAlreadySolved =", latest.xpAlreadySolved);
                    console.log("xpBeforeCnt =", latest.xpBeforeCnt, "xpAfterCnt =", latest.xpAfterCnt);
                    console.log("xpBeforeExp =", latest.xpBeforeExp, "xpAfterExp =", latest.xpAfterExp);
                    console.log("xpHasTaskAfter =", latest.xpHasTaskAfter);
                    console.log("xpError =", latest.xpError || null);
                    console.log("backend should have recalculated users/<login>/stats by now.");
                    console.groupEnd();

                    if (!solvedStatsLogged) {
                        solvedStatsLogged = true;
                        try {
                            const login = getUser();
                            const taskId = resolveTaskIdFromLocation();
                            const statsSnap = await (window.db?.ref(`users/${login}/stats`).get());
                            const stats = statsSnap && statsSnap.exists() ? (statsSnap.val() || {}) : {};
                            const solved = (stats && typeof stats.solved === "object" && stats.solved) ? stats.solved : {};
                            console.group("%c[XP TRACE][CLIENT] stats snapshot after solved", "color:#7fff7f;font-weight:bold;");
                            console.log("login =", login);
                            console.log("taskId =", taskId);
                            console.log("stats.cnt =", stats.cnt);
                            console.log("stats.exp =", stats.exp);
                            console.log("stats.solved.has(task) =", !!solved[String(taskId)] || !!solved[taskId]);
                            console.groupEnd();
                        } catch (e) {
                            console.warn("[XP TRACE][CLIENT] failed to read stats snapshot:", e);
                        }
                    }
                }
                const firstStatus = document.querySelector("#subs tr td:nth-child(2)")?.textContent?.trim()?.toUpperCase() || "";
                const stillPending = firstStatus === "В ОЧЕРЕДИ" || firstStatus === "ТЕСТИРУЕТСЯ" || firstStatus === "QUEUE" || firstStatus === "TESTING";
                const solvedButTracePending =
                    !!(latest && isSolvedVerdict(latest) && (latest.xpMarked === undefined && !latest.xpError));
                const graceAfterSolvedTicks =
                    solvedSeenAtTick === null ? 0 : (ticks - solvedSeenAtTick);
                const keepPollingForTrace = solvedButTracePending && graceAfterSolvedTicks < 8;
                if ((!stillPending && !keepPollingForTrace) || ticks > 120) {
                    console.log("[XP TRACE][CLIENT] polling stop", { ticks, firstStatus, stillPending });
                    clearInterval(SUBS_POLL_TIMER);
                    SUBS_POLL_TIMER = null;
                }
            }, 1500);
        }

        function normalizeTaskLanguage(lang) {
            const value = String(lang || "").toLowerCase().trim();
            if (value === "python" || value === "py" || value === "python3") return "python";
            return "cpp";
        }

        function languageToCodeFile(lang) {
            return normalizeTaskLanguage(lang) === "python" ? "code.py" : "code.cpp";
        }

        function findFirstNonAsciiChar(text) {
            for (let i = 0; i < text.length; i++) {
                if (text.charCodeAt(i) > 127) {
                    const prefix = text.slice(0, i);
                    const line = prefix.split("\n").length;
                    const col = i - prefix.lastIndexOf("\n");
                    return { ch: text[i], line, col };
                }
            }
            return null;
        }

        function isSolvedVerdict(verdict) {
            if (!verdict || typeof verdict !== "object") return false;
            const status = String(verdict.status || verdict.verdict || "").trim().toUpperCase();
            const raw = String(verdict.rawVerdict || "").trim().toUpperCase();
            if (status === "OK" || raw === "OK") return true;

            const scoreField = Number(verdict.score);
            if (Number.isFinite(scoreField) && scoreField >= 100) return true;

            const numericStatus = Number(String(verdict.status || "").replace(",", "."));
            if (Number.isFinite(numericStatus) && numericStatus >= 100) return true;

            const numericLabel = Number(String(verdict.statusLabel || "").replace(",", "."));
            if (Number.isFinite(numericLabel) && numericLabel >= 100) return true;

            return false;
        }

        function hasTaskIdInLocation() {
            const url = new URL(window.location.href);
            return url.searchParams.has("id") || url.searchParams.has("task");
        }

        function resolveTaskIdFromLocation() {
            const url = new URL(window.location.href);
            const raw = (url.searchParams.get("id") ?? url.searchParams.get("task") ?? "").trim();
            if (!raw) return null;
            const parsed = Number(raw);
            if (!Number.isInteger(parsed) || parsed < 0) return null;
            return parsed;
        }

        async function resolveSubmitLogin() {
            const localLogin = (typeof getUser === "function" ? String(getUser() || "").trim() : "");
            try {
                const auth = window.firebase?.auth?.();
                const authUser = auth?.currentUser;
                if (!authUser) {
                    console.warn("[XP TRACE][CLIENT] resolveSubmitLogin: no auth.currentUser, fallback local =", localLogin);
                    return localLogin;
                }
                const mapFn =
                    window.resolveLoginByUidOrEmail ||
                    (typeof resolveLoginByUidOrEmail === "function" ? resolveLoginByUidOrEmail : null);
                if (typeof mapFn === "function") {
                    const mapped = String(await mapFn(authUser.uid, authUser.email) || "").trim();
                    if (mapped) {
                        if (typeof setUser === "function") setUser(mapped);
                        if (mapped !== localLogin) {
                            console.warn("[XP TRACE][CLIENT] submit login corrected via uid map:", { from: localLogin, to: mapped });
                        }
                        return mapped;
                    }
                }
                console.warn("[XP TRACE][CLIENT] resolveSubmitLogin: mapping empty, fallback local =", localLogin, "uid=", authUser.uid);
            } catch (e) {
                console.warn("[XP TRACE][CLIENT] resolveSubmitLogin failed:", e);
            }
            return localLogin;
        }

        async function submitCode() {
            console.log("[submitCode] старт");

            const taskId = resolveTaskIdFromLocation();

            console.log("taskId =", taskId);

            if (taskId === null) {
                alert("Нет ID задачи");
                return;
            }

            const user = await resolveSubmitLogin();

            if (!user) {
                alert("зарегстрируйтесь чтобы решать задачи");
                return;
            }

            const code = editor.getValue();
            console.log("code =", code.substring(0, 100), "...");
            const nonAscii = findFirstNonAsciiChar(code);
            if (nonAscii) {
                alert(
                    `В коде найден символ "${nonAscii.ch}" (строка ${nonAscii.line}, колонка ${nonAscii.col}). ` +
                    "Уберите его, иначе будет CE."
                );
                return;
            }
            let pendingRow = null;
            let queueTimer = null;
            try {
                pendingRow = addPendingSubmissionRow();
                queueTimer = setTimeout(() => {
                    updateSubmissionRow(pendingRow, "Тестируется", "#c9c9c9");
                }, 800);
                const verdict = await sendToJudge(taskId, code, user);
                console.log("⬅ Вердикт от сервера:", verdict);
                if (isSolvedVerdict(verdict)) {
                    console.group("%c[XP TRACE][CLIENT] solved verdict received", "color:#7fff7f;font-weight:bold;");
                    console.log("user =", user);
                    console.log("taskId =", taskId);
                    console.log("status =", verdict.status);
                    console.log("statusLabel =", verdict.statusLabel);
                    console.log("rawVerdict =", verdict.rawVerdict);
                    console.log("score =", verdict.score);
                    console.log("timeMs =", verdict.timeMs);
                    console.log("memoryMb =", verdict.memoryMb);
                    console.log("passedGroups =", verdict.passedGroups);
                    console.log("firebaseSaved =", verdict.firebaseSaved);
                    console.log("firebaseError =", verdict.firebaseError || null);
                    console.log("exp/cnt/solved are updated on backend worker only.");
                    console.groupEnd();
                }
                clearTimeout(queueTimer);
                queueTimer = null;
                updateSubmissionRow(pendingRow, verdict.statusLabel || verdict.status || "ERROR");
                updateSubmissionRowDetails(pendingRow, verdict);
                if (verdict.firebaseSaved === false) {
                    console.warn("Firebase save failed:", verdict.firebaseError);
                } else {
                    loadMySubsForThisProblem();
                    if ((verdict.statusLabel || verdict.status) === "QUEUE") {
                        console.log("%c[XP TRACE][CLIENT] QUEUE -> startSubmissionPolling", "color:#c9c9c9;");
                        startSubmissionPolling();
                    }
                }
                // Начисление solved/exp/cnt выполняется сервером в worker после финального verdict.
                console.log("💾 Firebase сохранено OK");

            } catch (e) {
                if (queueTimer) {
                    clearTimeout(queueTimer);
                    queueTimer = null;

                updateSubmissionRow(pendingRow, "ERROR");

        /* ============================================================
           SEND TO JUDGE
           ============================================================ */

        async function acquireSubmitToken(forceRefresh = false) {
            let token = "";
            try {
                if (typeof window.getFreshAuthToken === "function") {
                    token = await window.getFreshAuthToken({ timeoutMs: 8000, forceRefresh: !!forceRefresh });
                }
                if (!token && window.firebase?.auth) {
                    const user = window.firebase.auth().currentUser;
                    if (user) token = await user.getIdToken(!!forceRefresh);
                }
            } catch (e) {
                console.warn("acquireSubmitToken failed:", e);
            }
            if (!token) token = localStorage.getItem("idToken") || "";
            token = String(token || "").trim();
            return token;
        }

        async function sendToJudge(taskId, code, submitUserLogin) {
            console.log("%c[sendToJudge()] → fetch()", "color:#aaf");

            const payload = {
                task: taskId,
                code: code,
                language: TASK_LANGUAGE,
                user: String(submitUserLogin || (typeof getUser === "function" ? getUser() : "") || "").trim(),
                contestId: new URL(location.href).searchParams.get("contest")
            };
            if (!payload.user) {
                throw new Error("Не удалось определить логин для submit");
            }

            console.log("Payload JSON:", payload);

            let res;
            try {
                let token = await acquireSubmitToken(false);
                for (let attempt = 0; attempt < 2; attempt++) {
                    console.log("[sendToJudge] POST", SUBMIT_URL, "attempt=", attempt + 1);
                    const headers = {
                        "Content-Type": "application/json"
                    };
                    if (token) {
                        headers["Authorization"] = `Bearer ${token}`;
                    }
                    res = await fetch(SUBMIT_URL, {
                        method: "POST",
                        headers,
                        mode: "cors",
                        body: JSON.stringify(payload)
                    });
                    if (!token || res.status !== 401 || attempt === 1) break;
                    console.warn("401 on submit, refreshing token and retrying once");
                    token = await acquireSubmitToken(true);
                }
            } catch (e) {
                console.error("❌ Ошибка fetch/token:", e);
                throw new Error("Сервер не отвечает");
            }

            console.log("Ответ RAW:", res);

            let data;
            try {
                data = await res.json();
            } catch (e) {
                console.error("❌ Ошибка JSON:", e);
                throw new Error("Невалидный JSON");
            }

            if (!res.ok && !data.status) {
                console.error("❌ HTTP ошибка:", res.status);
                throw new Error("HTTP " + res.status);
            }

            console.log("📦 JSON:", data);
            return data;
        }

        // Firebase verdict updates now handled by server.

        function getCurrentTaskId() {
            return resolveTaskIdFromLocation() || 0;

        function addPendingSubmissionRow() {
            const tbody = document.getElementById("subs");
            if (!tbody) return null;

            if (tbody.querySelector("td") && tbody.textContent.includes("Пока нет посылок")) {
                tbody.innerHTML = "";
            }

            const tr = document.createElement("tr");
            const time = new Date().toLocaleTimeString();
            tr.innerHTML = `
                <td>—</td>
                <td style="color:#c9c9c9; font-weight:600;">В очереди</td>
                <td>—</td>
                <td>—</td>
                <td>—</td>
                <td>—</td>
                <td>${time}</td>
            `;
            tbody.prepend(tr);
            return tr;
        }

        function updateSubmissionRow(row, verdict, colorOverride) {
            if (!row) return;
            const numericVerdict = /^\d+$/.test(String(verdict || "").trim());
            const verdictColor = colorOverride || (
                numericVerdict ? "#7fff7f" :
                verdict === "OK" ? "#7fff7f" :
                verdict === "WA" ? "#ff7777" :
                verdict === "RE" ? "#ffb37c" :
                verdict === "QUEUE" ? "#c9c9c9" :
                verdict === "TESTING" ? "#c9c9c9" :
                verdict === "ERROR" ? "#ffb37c" :
                verdict === "Нужен вход" ? "#ffb37c" :
                "#ffd451"
            );
            const cell = row.children[1];
            if (cell) {
                cell.textContent = verdict;
                cell.style.color = verdictColor;
            }
        }

        function updateSubmissionRowDetails(row, verdictObj) {
            if (!row || !verdictObj) return;
            const scoreCell = row.children[2];
            const groupsCell = row.children[3];
            const msCell = row.children[4];
            const mbCell = row.children[5];
            if (scoreCell) {
                scoreCell.textContent = Number.isFinite(Number(verdictObj.score))
                    ? String(Math.round(Number(verdictObj.score)))
                    : "—";
            }
            if (groupsCell) {
                const groups = Array.isArray(verdictObj.passedGroups) ? verdictObj.passedGroups : [];
                groupsCell.textContent = groups.length ? groups.join(",") : "—";
            }
            if (msCell) {
                msCell.textContent = Number.isFinite(Number(verdictObj.timeMs))
                    ? String(Math.round(Number(verdictObj.timeMs)))
                    : "—";
            }
            if (mbCell) {
                mbCell.textContent = Number.isFinite(Number(verdictObj.memoryMb))
                    ? Number(verdictObj.memoryMb).toFixed(2)
                    : "—";
            }
        }

        /* ============================================================
   LOAD USER SUBMISSIONS (посылки одного пользователя по задаче)
   ============================================================ */

        async function loadMySubsForThisProblem() {
            console.log("%c[loadMySubsForThisProblem()]", "color:#0af;");

            const user = getUser();
            if (!user) {
                console.warn("⚠ Нет пользователя — таблицу не обновляем");
                return null;
            }

            const taskId = resolveTaskIdFromLocation();
            if (taskId === null) {
                tbody.innerHTML = "<tr><td colspan='7'>Пока нет посылок…</td></tr>";
                return null;
            }

            const tbody = document.getElementById("subs");
            if (!tbody) {
                console.error("❌ tbody #subs не найден!");
                return null;
            }

            const dbRef = window.db || null;
            if (!dbRef) {
                tbody.innerHTML = "<tr><td colspan='7' style='color:#999'>Firebase временно недоступен</td></tr>";
                return null;
            }

            tbody.innerHTML = "<tr><td colspan='7' style='color:#999'>Загрузка…</td></tr>";

            let snap;
            try {
                snap = await dbRef.ref("submissions/global").get();
            } catch (err) {
                console.warn("⚠ Не удалось загрузить посылки:", err);
                tbody.innerHTML = "<tr><td colspan='7' style='color:#999'>Не удалось загрузить посылки</td></tr>";
                return null;
            }

            if (!snap.exists()) {
                tbody.innerHTML = "<tr><td colspan='7'>Пока нет посылок…</td></tr>";
                return null;
            }

            const all = Object.entries(snap.val() || {}).map(([id, value]) => ({
                ...(value || {}),
                _id: id
            }));
            console.log("[XP TRACE][CLIENT] submissions loaded:", all.length, "currentUser=", user, "taskId=", taskId);

            const mine = all
                .filter(s => s.login === user && Number(s.task) === Number(taskId))
                .sort((a, b) => b.date - a.date);
            console.log("[XP TRACE][CLIENT] mine filtered:", mine.length, mine[0] ? { id: mine[0]._id, verdict: mine[0].verdict, score: mine[0].score } : null);

            if (mine.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7'>Пока нет посылок…</td></tr>";
                return null;
            }

            tbody.innerHTML = "";
            let i = mine.length;

            for (let s of mine) {
                const verdict = s.statusLabel || s.verdict || s.status || "ERROR";
                const numericVerdict = /^\d+$/.test(String(verdict).trim());
                const verdictColor =
                    numericVerdict ? "#7fff7f" :
                    String(verdict).startsWith("WA") ? "#ff7777" :
                    String(verdict).startsWith("TL") ? "#ffd451" :
                    String(verdict).startsWith("ML") ? "#ffd451" :
                    String(verdict).startsWith("RE") ? "#ffb37c" :
                    verdict === "OK" ? "#7fff7f" :
                    verdict === "QUEUE" ? "#c9c9c9" :
                    verdict === "TESTING" ? "#c9c9c9" :
                    verdict === "ERROR" ? "#ffb37c" :
                    "#ffd451";

                const verdictLabel =
                    numericVerdict ? verdict :
                    verdict === "QUEUE" ? "В очереди" :
                    verdict === "TESTING" ? "Тестируется" :
                    verdict === "ERROR" ? "Ошибка" :
                    verdict;
                const score = Number.isFinite(Number(s.score)) ? Math.round(Number(s.score)) : "—";
                const passedGroups = Array.isArray(s.passedGroups) && s.passedGroups.length
                    ? s.passedGroups.join(",")
                    : "—";
                const timeMs = Number.isFinite(Number(s.timeMs)) ? Math.round(Number(s.timeMs)) : 0;
                const memoryMb = Number.isFinite(Number(s.memoryMb)) ? Number(s.memoryMb).toFixed(2) : "0.00";

                tbody.innerHTML += `
        <tr>
            <td>${i--}</td>
            <td style="color:${verdictColor}; font-weight:600;">
                ${verdictLabel}
            </td>
            <td>${score}</td>
            <td>${passedGroups}</td>
            <td>${timeMs}</td>
            <td>${memoryMb}</td>
            <td>${new Date(s.date).toLocaleTimeString()}</td>
        </tr>`;
            }
            return mine[0];
        }


        // submitOK intentionally removed:
        // stats writes from client caused race/overwrite with backend worker updates.

    <script>
        function renderMarkdown(md) {
            if (window.marked && window.DOMPurify) {
                const html = marked.parse(md || "");
                return DOMPurify.sanitize(html);
            }
            return (md || "").replace(/\n/g, "<br>");
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        let currentStatementLang = localStorage.getItem("codebugStatementLang") || "ru";
        let statementSections = { ru: "", en: "" };
        let statementPreludeHtml = "";
        let currentProblemMeta = null;

        function setStatementLanguage(lang) {
            currentStatementLang = lang === "en" ? "en" : "ru";
            localStorage.setItem("codebugStatementLang", currentStatementLang);
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.lang === currentStatementLang);
            });
            const target = document.getElementById("taskStatement");
            if (!target) return;
            statementPreludeHtml = buildStatementPrelude(currentStatementLang, currentProblemMeta);
            const bodyHtml = stripDuplicatedIoMetaHtml(statementSections[currentStatementLang] || statementSections.ru || "");
            target.innerHTML = `${statementPreludeHtml}${bodyHtml}`;
            if (window.MathJax?.typesetPromise) {
                MathJax.typesetPromise([target]).catch(console.warn);
            }
        }

        function formatTimeLimit(meta, lang) {
            const raw = Number(meta?.timeLimit ?? meta?.timeLimitSeconds ?? meta?.limits?.timeLimit);
            const seconds = Number.isFinite(raw) && raw > 0 ? raw : 1;
            const text = Number.isInteger(seconds) ? String(seconds) : String(seconds).replace(/0+$/, "").replace(/\.$/, "");
            if (lang === "en") return `${text} ${seconds === 1 ? "second" : "seconds"}`;
            const integer = Math.trunc(seconds);
            const mod10 = integer % 10;
            const mod100 = integer % 100;
            const unit = Number.isInteger(seconds) && mod10 === 1 && mod100 !== 11
                ? "секунда"
                : (Number.isInteger(seconds) && mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14) ? "секунды" : "секунд");
            return `${text} ${unit}`;
        }

        function formatMemoryLimit(meta, lang) {
            const raw = Number(meta?.memoryLimitMb ?? meta?.memoryLimitMB ?? meta?.memoryLimit ?? meta?.limits?.memoryLimitMb);
            const mb = Number.isFinite(raw) && raw > 0 ? raw : 256;
            const text = Number.isInteger(mb) ? String(mb) : String(mb).replace(/0+$/, "").replace(/\.$/, "");
            return lang === "en" ? `${text} MB` : `${text} мегабайт`;
        }

        function buildStatementPrelude(lang, meta = currentProblemMeta) {
            const timeLimit = formatTimeLimit(meta, lang);
            const memoryLimit = formatMemoryLimit(meta, lang);
            if (lang === "en") {
                return `
                  <div class="io-meta-block" style="margin:0 0 12px;color:var(--muted);font-size:14px;font-weight:600;">
                    Standard input | Standard output | ${timeLimit} | ${memoryLimit}
                  </div>`;
            }
            return `
              <div class="io-meta-block" style="margin:0 0 12px;color:var(--muted);font-size:14px;font-weight:600;">
                стандартный ввод | стандартный вывод | ${timeLimit} | ${memoryLimit}
              </div>`;
        }

        function stripDuplicatedIoMetaHtml(rawHtml) {
            let html = String(rawHtml || "");
            const patterns = [
                /Количество\s+учениковстандартный\s+вводстандартный\s+вывод1\s*секунда256\s*мегабайт/gi,
                /стандартный\s+вводстандартный\s+вывод1\s*секунда256\s*мегабайт/gi,
                /standard\s+inputstandard\s+output1\s*second256\s*megabytes/gi
            ];
            for (const pattern of patterns) {
                html = html.replace(pattern, "");
            }
            return html;
        }

        function splitStatementByLanguage(rawHtml) {
            const template = document.createElement("template");
            if (window.DOMPurify) {
                template.innerHTML = DOMPurify.sanitize(rawHtml);
            } else {
                const pre = document.createElement("pre");
                pre.textContent = String(rawHtml || "");
                template.content.appendChild(pre);
            }
            const nodes = Array.from(template.content.childNodes);
            const sections = { ru: [], en: [] };
            let lang = "ru";
            let headingCount = 0;
            for (const node of nodes) {
                if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "H1") {
                    headingCount += 1;
                    lang = headingCount >= 2 ? "en" : "ru";
                    continue;
                }
                sections[lang].push(node.cloneNode(true));
            }
            const serialize = items => items.map(node => {
                const holder = document.createElement("div");
                holder.appendChild(node);
                return holder.innerHTML;
            }).join("");
            return {
                ru: serialize(sections.ru),
                en: serialize(sections.en)
            };
        }

        function normalizeTag(tag) {
            const t = String(tag || "").trim();
            const key = t.toLowerCase().replace(/[_-]+/g, " ").replace(/\s+/g, " ");
            const map = {
                "prefix sums": "префиксные суммы",
                "two pointers": "два указателя",
                "binary search": "бинарный поиск",
                "bruteforce": "перебор",
                "brute force": "перебор",
                "dynamic programming": "динамика",
                "dp": "динамика",
                "graphs": "графы",
                "graph": "графы",
                "strings": "строки",
                "string": "строки",
                "arrays": "массивы",
                "array": "массивы",
                "math": "математика",
                "sorting": "сортировка",
                "implementation": "реализация",
                "greedy": "жадность",
                "tree": "деревья",
                "trees": "деревья",
                "dfs": "dfs",
                "bfs": "bfs",
                "dijkstra": "дейкстра",
                "shortest path": "кратчайший путь",
                "prefix sum": "префиксные суммы"
            };
            return map[key] || t;
        }

            const examples = document.getElementById("examples");
            if (examples) examples.innerHTML = "";
            setExamplesVisible(false);
            if (window.editor) editor.setValue("// Задача не найдена");
            const submitBtn = document.querySelector(".btn");
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = "Недоступно";
            }
        }

        function showTaskBackendError(id, details) {
            document.getElementById("taskTitle").innerText = `Задача #${id} временно недоступна`;
            const tags = document.getElementById("taskTags");
            if (tags) tags.innerHTML = "";
            document.getElementById("taskStatement").innerHTML =
                `<p>Сервер задач не смог синхронизировать репозиторий. Попробуй обновить страницу через минуту.</p><p><a href="train.html" style="color:#8dd0ff;">Вернуться к тренировке</a></p>${details ? `<p><code>${escapeHtml(details)}</code></p>` : ""}`;
            document.getElementById("taskHelp").innerText = "";
            setHelpVisible(false);
            const groupTable = document.getElementById("groupTable");
            if (groupTable) groupTable.innerHTML = "";
            const examples = document.getElementById("examples");
            if (examples) examples.innerHTML = "";
            setExamplesVisible(false);
            if (window.editor) editor.setValue("// Сервер задач временно недоступен");
            const submitBtn = document.querySelector(".btn");
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = "Недоступно";
            }
        }

        function renderGroupTable(groups, scoringMode) {
            if (String(scoringMode || "").toLowerCase() === "icpc") return "";
            const list = Array.isArray(groups) ? groups : [];
            if (!list.length) return "";
            const rows = list
                .slice()
                .sort((a, b) => Number(a.id || 0) - Number(b.id || 0))
                .map((g) => {
                    const gid = Number(g.id || 0);
                    const name = escapeHtml(String(g.name || `group ${gid}`));
                    const points = Number(g.points || g.score || 0);
                    const deps = Array.isArray(g.dependencies) && g.dependencies.length
                        ? g.dependencies.join(", ")
                        : "—";
                    return `<tr><td>${gid}</td><td>${name}</td><td>${points}</td><td>${escapeHtml(String(deps))}</td></tr>`;
                })
                .join("");
            return `
                <h3 class="section-title">Подгруппы</h3>
                <table class="test-table">
                    <thead>
                        <tr><th>ID</th><th>Название</th><th>Баллы</th><th>Зависимости</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function loadHiddenMap() {
            const dbRef = window.db || null;
            if (!dbRef) return {};
            try {
                const snap = await dbRef.ref("tasksHidden").get();
                return snap.exists() ? snap.val() : {};
            } catch (err) {
                console.warn("[problem] hidden map load failed", err);
                return {};
            }
        }

        async function loadTask() {

            const resolvedId = resolveTaskIdFromLocation();
            const id = resolvedId === null ? "" : String(resolvedId);
            const parsedId = Number(resolvedId || 0);
            const base = getTasksApiBase();

            if (resolvedId === null) {
                if (hasTaskIdInLocation()) {
                    showTaskNotFound("?");
                } else {
                    showTaskNotFound("");
                }
                return;
            }

            const hiddenMap = await loadHiddenMap();
            const isHidden = hiddenMap && hiddenMap[id];
            const isAdmin = await checkAdminAccess();
            if (isHidden && !isAdmin) {
                document.getElementById("taskTitle").innerText = "Задача скрыта";
                document.getElementById("taskStatement").innerText = "Доступ к этой задаче есть только у администраторов.";
                document.getElementById("taskHelp").innerText = "";
                const groupTable = document.getElementById("groupTable");
                if (groupTable) groupTable.innerHTML = "";
                if (window.editor) editor.setValue("// Недоступно");
                const examples = document.getElementById("examples");
                if (examples) examples.innerHTML = "";
                const submitBtn = document.querySelector(".btn");
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = "Недоступно";
                }
                return;
            }

            let problemV2 = null;
            try {
                const problemRes = await fetch(`${base}/tasks/${id}/problem.json`);
                if (problemRes.ok) {
                    problemV2 = await problemRes.json();
                } else if (problemRes.status >= 500) {
                    let payload = null;
                    try {
                        payload = await problemRes.json();
                    } catch (_) {}
                    if (payload?.error === "tasks_sync_failed") {
                        showTaskBackendError(id, "tasks_sync_failed");
                        return;
                    }
                }
            } catch (e) {
                problemV2 = null;
            }

            try {
                let meta = problemV2;
                if (!meta || !meta.title) {
                    const metaPath = `${base}/tasks/${id}/meta.json`;
                    const res = await fetch(metaPath);
                    if (!res.ok) {
                        if (res.status >= 500) {
                            let payload = null;
                            try {
                                payload = await res.json();
                            } catch (_) {}
                            if (payload?.error === "tasks_sync_failed") {
                                showTaskBackendError(id, "tasks_sync_failed");
                                return;
                            }
                        }
                        throw new Error(`meta_not_found_${res.status}`);
                    }
                    meta = await res.json();
                }

                TASK_DIFFICULTY = meta.difficulty;
                currentProblemMeta = meta;
                TASK_LANGUAGE = normalizeTaskLanguage(meta.language);
                updateEditorLanguageFromTask();
                console.log("Загружена сложность:", TASK_DIFFICULTY);

                document.getElementById("taskTitle").innerText = meta.title || "Без названия";
                const tagsRoot = document.getElementById("taskTags");
                if (tagsRoot) {
                    const tags = Array.isArray(meta.tags) ? meta.tags : [];
                    tagsRoot.innerHTML = tags.length ?
                        tags.map(tag => `<span class="task-tag">${normalizeTag(tag)}</span>`).join("") :
                        "";
                }
                const groupTable = document.getElementById("groupTable");
                if (groupTable) {
                    const groups = (problemV2 && (problemV2.groups || problemV2.subtasks)) || [];
                    groupTable.innerHTML = renderGroupTable(groups, problemV2?.scoringMode);
                }
            } catch (e) {
                console.error("[problem] task render failed:", e);
                showTaskBackendError(id, e?.message || "task_render_failed");
                return;
            }


            const statementHtmlPath = problemV2?.statement?.html;
            const statementMarkdownPath = problemV2?.statement?.markdown || "statement.md";

            if (statementHtmlPath) {
                try {
                    const res = await fetch(`${base}/tasks/${id}/${statementHtmlPath}`);
                    if (!res.ok) throw new Error(`statement_html_${res.status}`);
                    const html = await res.text();
                    statementSections = splitStatementByLanguage(html);
                    statementPreludeHtml = buildStatementPrelude(currentStatementLang, currentProblemMeta);
                    setStatementLanguage(currentStatementLang);
                } catch (e) {
                    document.getElementById("taskStatement").innerText = "statement/russian.html не найден";
                }
            } else {
                try {
                    const res = await fetch(`${base}/tasks/${id}/${statementMarkdownPath}`);
                    if (!res.ok) throw new Error(`statement_${res.status}`);

                    const md = await res.text();

                    statementSections = { ru: renderMarkdown(md), en: "" };
                    statementPreludeHtml = buildStatementPrelude("ru", currentProblemMeta);
                    setStatementLanguage("ru");
                } catch (e) {
                    document.getElementById("taskStatement").innerText = "statement.md не найден";
                }
            }

            const helpRoot = document.getElementById("taskHelp");
            const helpFile = problemV2?.statement?.hint || (!problemV2 ? "help.md" : "");
            helpRoot.innerText = "";
            setHelpVisible(false);
            if (helpFile) {
                const helpPath = `${base}/tasks/${id}/${helpFile}`;
                try {
                    const res = await fetch(helpPath);
                    if (!res.ok) throw new Error(`help_${res.status}`);
                    const md = await res.text();
                    if (md.trim()) {
                        helpRoot.innerHTML = renderMarkdown(md);
                        setHelpVisible(true);
                    }
                } catch (e) {
                    helpRoot.innerText = "";
                    setHelpVisible(false);
                }
            }


            const codeFile = languageToCodeFile(TASK_LANGUAGE);
            const fallbackCodeFile = codeFile === "code.py" ? "code.cpp" : "code.py";
            const v2CodeFile = problemV2?.files?.code;
            const codePath = `${base}/tasks/${id}/${v2CodeFile || codeFile}`;

            try {
                const res = await fetch(codePath);
                if (!res.ok) {
                    const fallbackRes = await fetch(`${base}/tasks/${id}/${fallbackCodeFile}`);
                    if (!fallbackRes.ok) throw new Error(`code_${res.status}`);
                    const fallbackCode = await fallbackRes.text();
                    setEditorCodeFromTask(fallbackCode);
                } else {
                    const code = await res.text();
                    setEditorCodeFromTask(code);
                }
            } catch (e) {
                setEditorCodeFromTask("// Файл кода не найден");
            }

            const examples = document.getElementById("examples");
            examples.innerHTML = "";
            setExamplesVisible(false);

            const renderExample = (title, inp, out) => {
                examples.innerHTML += `
                <div class="testcase-block">
                    <div class="kf-title">${escapeHtml(title)}</div>

                    <div class="kf-io">
                        <div class="kf-copy" onclick="copyKF(this)">Скопировать</div>
                        <pre class="kf-pre">${escapeHtml(inp.trim())}</pre>
                    </div>

                    <div class="kf-title" style="margin-top:10px;">Вывод</div>
                    <div class="kf-io">
                        <div class="kf-copy" onclick="copyKF(this)">Скопировать</div>
                        <pre class="kf-pre">${escapeHtml(out.trim())}</pre>
                    </div>
                </div>
            `;
                setExamplesVisible(true);
            };

            const openTests = Array.isArray(problemV2?.openTests) ? problemV2.openTests : [];
            if (openTests.length) {
                for (const test of openTests.slice(0, 2)) {
                    try {
                        const inpRes = await fetch(`${base}/tasks/${id}/${test.input}`);
                        if (!inpRes.ok) throw new Error(`v2_in_${test.name}_${inpRes.status}`);

                        const outRes = await fetch(`${base}/tasks/${id}/${test.answer}`);
                        if (!outRes.ok) throw new Error(`v2_out_${test.name}_${outRes.status}`);

                        const inp = await inpRes.text();
                        const out = await outRes.text();
                        renderExample(`Тест ${test.name}`, inp, out);
                    } catch (e) {
                        console.error(`open test ${test.name} ERROR:`, e);
                    }
                }
            } else if (!problemV2) {
                for (let i = 1; i <= 2; i++) {
                    console.log(`📄 test ${i}`);

                    const inPath = `${base}/tasks/${id}/tests/${i}.in`;
                    const outPath = `${base}/tasks/${id}/tests/${i}.out`;

                    try {
                        const inpRes = await fetch(inPath);
                        if (!inpRes.ok) throw new Error(`in_${i}_${inpRes.status}`);

                        const inp = await inpRes.text();

                        const outRes = await fetch(outPath);
                        if (!outRes.ok) throw new Error(`out_${i}_${outRes.status}`);

                        const out = await outRes.text();
                        renderExample(`Тест ${i}`, inp, out);
                    } catch (e) {
                        console.error(`test ${i} ERROR:`, e);
                    }
                }
            }

        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script>
        let pendingEditorValue = "// Загружаю код задачи...";
        let editor = {
            setValue(text) {
                pendingEditorValue = text == null ? "" : String(text);
            },
            getValue() {
                return pendingEditorValue;
            }
        };
        window.editor = editor;
        let monacoEditor = null;

        function monacoLangForTask(lang) {
            return normalizeTaskLanguage(lang) === "python" ? "python" : "cpp";
        }

        async function copyEditorCode(btn) {
            const text = editor.getValue ? editor.getValue() : "";
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                const old = btn.style.opacity;
                btn.style.opacity = "0.55";
                setTimeout(() => { btn.style.opacity = old || ""; }, 180);
            } catch (e) {
                console.warn("copy failed", e);
            }
        }

        function getMonacoRequire() {
            const candidates = [window.require, window.requirejs];
            for (const candidate of candidates) {
                if (typeof candidate === "function" && typeof candidate.config === "function") {
                    return candidate;
                }
            }
            return null;
        }

        function loadMonacoLoaderIfNeeded() {
            return new Promise((resolve) => {
                if (getMonacoRequire()) {
                    resolve();
                    return;
                }
                const existing = document.getElementById("monaco-loader-runtime");
                if (existing) {
                    existing.addEventListener("load", () => resolve(), { once: true });
                    existing.addEventListener("error", () => resolve(), { once: true });
                    return;
                }
                const script = document.createElement("script");
                script.id = "monaco-loader-runtime";
                script.src = "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js";
                script.onload = () => resolve();
                script.onerror = () => resolve();
                document.head.appendChild(script);
            });
        }

        async function initializeMonacoEditor(initialLang = "cpp") {
            await loadMonacoLoaderIfNeeded();
            return new Promise((resolve) => {
                const monacoRequire = getMonacoRequire();
                if (!monacoRequire) {
                    console.error("monaco loader missing");
                    resolve();
                    return;
                }

                const editorRoot = document.getElementById("editor");
                if (!editorRoot) {
                    console.error("editor root missing");
                    resolve();
                    return;
                }

                monacoRequire.config({
                    paths: {
                        vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
                    }
                });

                monacoRequire(["vs/editor/editor.main"], () => {
                    if (!window.monaco || !window.monaco.editor) {
                        console.error("monaco core missing after loader");
                        resolve();
                        return;
                    }

                    monaco.editor.defineTheme("codebug-dark-problem", {
                        base: "vs-dark",
                        inherit: true,
                        rules: [],
                        colors: {
                            "editor.background": "#0b1119",
                            "editor.lineHighlightBackground": "#112240",
                            "editorCursor.foreground": "#f0f6ff"
                        }
                    });

                    const model = monaco.editor.createModel(
                        pendingEditorValue,
                        monacoLangForTask(initialLang)
                    );

                    monacoEditor = monaco.editor.create(editorRoot, {
                        model,
                        theme: "codebug-dark-problem",
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 14,
                        lineHeight: 20,
                        fontFamily: "\"IBM Plex Mono\", monospace",
                        tabSize: 4,
                        insertSpaces: true,
                        smoothScrolling: true,
                        scrollBeyondLastLine: false,
                        autoClosingBrackets: "languageDefined",
                        autoClosingQuotes: "languageDefined",
                        autoSurround: "languageDefined",
                        quickSuggestions: { other: true, comments: false, strings: true },
                        wordBasedSuggestions: "allDocuments",
                        folding: true,
                        guides: {
                            indentation: false,
                            bracketPairs: false,
                            highlightActiveIndentation: false
                        },
                        bracketPairColorization: { enabled: false },
                        matchBrackets: "never"
                    });

                    monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
                        submitCode();
                    });

                    monacoEditor.onDidChangeModelContent(() => {
                        scheduleEditorDraftSave();
                    });

                    editor = {
                        setValue(text) {
                            const value = text == null ? "" : String(text);
                            pendingEditorValue = value;
                            monacoEditor.setValue(value);
                        },
                        getValue() {
                            return monacoEditor.getValue();
                        }
                    };
                    window.editor = editor;
                    window.addEventListener("resize", () => {
                        try {
                            monacoEditor.layout();
                        } catch (_) {}
                    });

                    resolve();
                });
            });
        }

        function updateEditorLanguageFromTask() {
            if (!window.monaco || !monacoEditor) return;
            const model = monacoEditor.getModel();
            if (!model) return;
            monaco.editor.setModelLanguage(model, monacoLangForTask(TASK_LANGUAGE));
        }

        document.addEventListener("DOMContentLoaded", async() => {
            await initializeMonacoEditor(TASK_LANGUAGE);
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.addEventListener("click", () => setStatementLanguage(btn.dataset.lang));
            });
            setStatementLanguage(currentStatementLang);
            loadTask();
        });
    </script>
