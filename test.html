<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBug — Test</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <style>
         :root {
            --bg: #050b18;
            --card: #0a162b;
            --card-2: #0e1e38;
            --stroke: #1e3656;
            --text: #dbe8ff;
            --muted: #9bb0cf;
            --accent: #2ad07f;
            --accent-strong: #1caf68;
            --danger: #ff7a7a;
        }
        
        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            margin: 0;
            height: 100%;
            background: radial-gradient(1000px 500px at 10% -10%, rgba(42, 208, 127, 0.12), transparent 60%), radial-gradient(900px 500px at 90% -10%, rgba(48, 122, 255, 0.16), transparent 60%), var(--bg);
            color: var(--text);
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 18px;
            min-height: 100%;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }
        
        .top {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 12px;
            height: min(70vh, 780px);
            min-height: 460px;
        }
        
        .panel {
            border: 1px solid var(--stroke);
            border-radius: 14px;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            min-height: 0;
        }

        .top .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--stroke);
            background: rgba(7, 15, 30, 0.7);
        }
        
        .title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--muted);
            font-weight: 700;
        }
        
        .hint {
            color: var(--muted);
            font-size: 12px;
        }

        .editor-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .select {
            border: 1px solid var(--stroke);
            background: rgba(9, 20, 38, 0.95);
            color: var(--text);
            border-radius: 9px;
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
        }

        .tool-btn {
            border: 1px solid rgba(60, 95, 140, 0.6);
            background: rgba(10, 26, 48, 0.75);
            color: #b9cdec;
            border-radius: 9px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .tool-btn:hover {
            background: rgba(16, 38, 68, 0.85);
            color: #d7e7ff;
        }
        
        .editor-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            height: auto;
        }

        #editor {
            width: 100%;
            height: 100%;
        }
        
        #inputData {
            width: 100%;
            flex: 1;
            min-height: 0;
            height: auto;
            border: 0;
            outline: 0;
            resize: none;
            padding: 14px 16px;
            background: transparent;
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 15px;
            line-height: 1.55;
        }
        
    .bottom {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 220px;
    }

    .bottom-body {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      min-height: 0;
    }

    .bottom-col {
      min-height: 0;
    }

    .bottom-col + .bottom-col {
      border-left: 1px solid var(--stroke);
    }

    .run-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .run-btn {
            border: 0;
            border-radius: 10px;
            padding: 8px 14px;
            background: var(--accent);
            color: #032112;
            font-weight: 700;
            cursor: pointer;
        }
        
        .run-btn:hover {
            background: var(--accent-strong);
        }
        
        .stat {
            border: 1px solid var(--stroke);
            border-radius: 10px;
            padding: 6px 10px;
            color: var(--muted);
            font-size: 13px;
            min-width: 108px;
            text-align: center;
            background: rgba(6, 12, 22, 0.45);
        }
        
        .status {
            min-width: 140px;
        }
        
        .status.bad {
            color: var(--danger);
        }
        
    #outputData {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      resize: none;
            padding: 14px 16px;
            background: transparent;
            color: #c6f0c6;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
      line-height: 1.55;
    }

    #runLog {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      resize: none;
      padding: 14px 16px;
      background: transparent;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .top {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 0;
      }
      .editor-wrap,
      #inputData {
        min-height: 320px;
      }

      .bottom-body {
        grid-template-columns: 1fr;
      }

      .bottom-col + .bottom-col {
        border-left: 0;
        border-top: 1px solid var(--stroke);
      }
    }
    </style>
</head>

<body>
    <main class="page">
        <section class="top">
            <div class="panel">
                <div class="panel-head">
                    <div class="title">Код C++</div>
                    <div class="editor-actions">
                        <span class="hint">Ctrl/Cmd + Enter</span>
                        <select id="langSelect" class="select" aria-label="Language">
                            <option value="cpp">C++17</option>
                            <option value="python">Python 3</option>
                        </select>
                    </div>
                </div>
                <div class="editor-wrap">
                    <div id="editor" aria-label="Code editor"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <div class="title">Тест (stdin)</div>
                </div>
                <textarea id="inputData" spellcheck="false" placeholder="Ввод для программы"></textarea>
            </div>
        </section>

    <section class="panel bottom">
      <div class="panel-head">
        <div class="title">Результат</div>
                <div class="run-row">
                    <button id="runBtn" class="run-btn" type="button">Запустить</button>
                    <div id="status" class="stat status">Готово</div>
                    <div id="time" class="stat">— ms</div>
          <div id="memory" class="stat">— MB</div>
        </div>
      </div>
      <div class="bottom-body">
        <div class="bottom-col">
          <textarea id="outputData" readonly placeholder="Вывод программы"></textarea>
        </div>
        <div class="bottom-col">
          <textarea id="runLog" readonly placeholder="Лог запусков"></textarea>
        </div>
      </div>
    </section>
  </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script>
        let monacoEditor = null;
        const editorModels = {};
        let diagnosticsTimer = null;
        const DIAG_OWNER = "codebug-diagnostics";
        const ENABLE_DIAGNOSTICS = false;
        const AI_COMPLETION_CACHE = new Map();
        let aiCompletionDisabled = false;

        const TEMPLATE_CPP = `#include <bits/stdc++.h>
using namespace std;

int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    long long a, b;
    cin >> a >> b;
    cout << a + b << "\\n";
    return 0;
}`;

        const TEMPLATE_PY = `import sys

def main():
    data = sys.stdin.read().strip().split()
    if len(data) < 2:
        return
    a, b = map(int, data[:2])
    print(a + b)

if __name__ == "__main__":
    main()
`;

        function draftKey(lang) {
            return `codebug:test:monaco:draft:${lang}`;
        }

        function langLabel(lang) {
            return lang === "python" ? "Python 3" : "C++17";
        }

        function getCurrentLang() {
            return document.getElementById("langSelect")?.value || "cpp";
        }

        function defaultTemplate(lang) {
            return lang === "python" ? TEMPLATE_PY : TEMPLATE_CPP;
        }

        function getEditorCode() {
            if (!monacoEditor) return "";
            return monacoEditor.getValue();
        }

        function currentModel() {
            return monacoEditor ? monacoEditor.getModel() : null;
        }

        function saveDraft(lang) {
            const model = editorModels[lang];
            if (!model) return;
            localStorage.setItem(draftKey(lang), model.getValue());
        }

        function ensureModel(monaco, lang) {
            if (editorModels[lang]) return editorModels[lang];
            const ext = lang === "python" ? "py" : "cpp";
            const uri = monaco.Uri.parse(`inmemory://codebug/main.${ext}`);
            const draft = localStorage.getItem(draftKey(lang));
            const model = monaco.editor.createModel(draft || defaultTemplate(lang), lang, uri);
            editorModels[lang] = model;
            model.onDidChangeContent(() => {
                saveDraft(lang);
                scheduleDiagnostics();
            });
            return model;
        }

        async function fetchJson(url, payload) {
            const base = window.TASKS_API_BASE || window.CODEBUG_API_BASE || (location.hostname === "localhost" ? "http://localhost:7777" : "https://codebug.onrender.com");
            const res = await fetch(`${base}${url}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload || {})
            });
            const data = await res.json().catch(() => ({}));
            return {
                ok: res.ok,
                data
            };
        }

        function scheduleDiagnostics() {
            if (!ENABLE_DIAGNOSTICS) return;
            if (!monacoEditor) return;
            clearTimeout(diagnosticsTimer);
            diagnosticsTimer = setTimeout(() => {
                runDiagnostics(false);
            }, 450);
        }

        async function runDiagnostics(manual = true) {
            if (!ENABLE_DIAGNOSTICS) {
                const model = currentModel();
                if (model && window.monaco) monaco.editor.setModelMarkers(model, DIAG_OWNER, []);
                return;
            }
            if (!monacoEditor || !window.monaco) return;
            const code = getEditorCode();
            const language = getCurrentLang();
            const model = currentModel();
            if (!model) return;
            if (!code.trim()) {
                monaco.editor.setModelMarkers(model, DIAG_OWNER, []);
                return;
            }
            const { ok: httpOk, data } = await fetchJson("/editor/diagnostics", {
                code,
                language
            });
            const diagOk = !!data.ok;
            const markers = Array.isArray(data.markers) ? data.markers.map((m) => ({
                startLineNumber: Math.max(1, Number(m.startLineNumber) || 1),
                startColumn: Math.max(1, Number(m.startColumn) || 1),
                endLineNumber: Math.max(1, Number(m.endLineNumber) || Number(m.startLineNumber) || 1),
                endColumn: Math.max(2, Number(m.endColumn) || ((Number(m.startColumn) || 1) + 1)),
                message: String(m.message || "error"),
                severity: Number(m.severity) || monaco.MarkerSeverity.Error
            })) : [];
            if (!markers.length && !diagOk && typeof data.details === "string") {
                const lines = data.details.split("\n");
                for (const line of lines) {
                    const match = line.match(/:(\d+):(\d+):\s*(?:fatal error|error|warning):\s*(.+)$/i);
                    if (!match) continue;
                    const ln = Number(match[1]) || 1;
                    const col = Number(match[2]) || 1;
                    markers.push({
                        startLineNumber: Math.max(1, ln),
                        startColumn: Math.max(1, col),
                        endLineNumber: Math.max(1, ln),
                        endColumn: Math.max(2, col + 1),
                        message: match[3],
                        severity: monaco.MarkerSeverity.Error
                    });
                }
            }
            monaco.editor.setModelMarkers(model, DIAG_OWNER, markers);
            if (manual) {
                const statusEl = document.getElementById("status");
                if (!httpOk || !diagOk) {
                    statusEl.textContent = "Diagnostics error";
                    statusEl.classList.add("bad");
                } else if (markers.length) {
                    statusEl.textContent = `Найдено: ${markers.length}`;
                    statusEl.classList.add("bad");
                } else {
                    statusEl.textContent = "Ошибок нет";
                    statusEl.classList.remove("bad");
                }
            }
        }

        async function formatDocument() {
            if (!monacoEditor) return;
            const code = getEditorCode();
            const language = getCurrentLang();
            const statusEl = document.getElementById("status");
            if (!code.trim()) return;
            statusEl.textContent = "Форматирование...";
            statusEl.classList.remove("bad");
            const { ok, data } = await fetchJson("/editor/format", {
                code,
                language
            });
            if (!ok || !data.ok) {
                statusEl.textContent = "Format error";
                statusEl.classList.add("bad");
                return;
            }
            if (typeof data.formatted === "string") {
                monacoEditor.setValue(data.formatted);
            }
            statusEl.textContent = "Отформатировано";
            statusEl.classList.remove("bad");
            runDiagnostics(false);
        }

        function registerAiCompletion(monaco) {
            const emptyRangeAt = (position) => ({
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: position.column,
                endColumn: position.column
            });

            async function requestAiCompletion(language, model, position) {
                if (aiCompletionDisabled) return "";
                const offset = model.getOffsetAt(position);
                const text = model.getValue();
                const prefix = text.slice(0, offset);
                const suffix = text.slice(offset);
                const beforeCursor = prefix.slice(-80);
                const wordMatch = beforeCursor.match(/([A-Za-z_][A-Za-z0-9_]*)$/);
                const lastChar = prefix[prefix.length - 1] || "";
                const looksUseful = (wordMatch && wordMatch[1].length >= 2) || /[)\]}:;]|\n/.test(lastChar);
                if (!looksUseful) return "";

                const cacheKey = [
                    language,
                    prefix.slice(-1200),
                    suffix.slice(0, 400)
                ].join("\u0000");
                if (AI_COMPLETION_CACHE.has(cacheKey)) {
                    return AI_COMPLETION_CACHE.get(cacheKey);
                }

                const { ok, data } = await fetchJson("/editor/ai-complete", {
                    language,
                    prefix,
                    suffix
                });
                if (!ok || !data.ok) {
                    if (data.error === "ai_completion_not_configured") {
                        aiCompletionDisabled = true;
                    }
                    return "";
                }
                let completion = String(data.completion || "");
                if (wordMatch && completion.startsWith(wordMatch[1])) {
                    completion = completion.slice(wordMatch[1].length);
                }
                if (completion.length > 1200) {
                    completion = completion.slice(0, 1200);
                }
                AI_COMPLETION_CACHE.set(cacheKey, completion);
                if (AI_COMPLETION_CACHE.size > 40) {
                    AI_COMPLETION_CACHE.delete(AI_COMPLETION_CACHE.keys().next().value);
                }
                return completion;
            }

            function registerInlineProvider(language) {
                monaco.languages.registerInlineCompletionsProvider(language, {
                    async provideInlineCompletions(model, position) {
                        const insertText = await requestAiCompletion(language, model, position);
                        if (!insertText) return { items: [] };
                        return {
                            items: [{
                                insertText,
                                range: emptyRangeAt(position)
                            }]
                        };
                    },
                    freeInlineCompletions() {}
                });
            }

            registerInlineProvider("cpp");
            registerInlineProvider("python");
        }

        function registerSnippets(monaco) {
            monaco.languages.registerCompletionItemProvider("cpp", {
                triggerCharacters: ["f", "i", "w", "v"],
                provideCompletionItems: function(model, position) {
                    const suggestions = [{
                            label: "fastio",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            documentation: "Fast IO template",
                            insertText: `ios::sync_with_stdio(false);
cin.tie(nullptr);`,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        },
                        {
                            label: "fori",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: `for (int \${1:i} = 0; \${1:i} < \${2:n}; \${1:i}++) {
    \${0}
}`,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        },
                        {
                            label: "all",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: "begin(${1:v}), end(${1:v})",
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        },
                        {
                            label: "vecin",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: `vector<\${1:int}> \${2:a}(\${3:n});
for (auto &x : \${2:a}) cin >> x;`,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        }
                    ];
                    return { suggestions };
                }
            });

            monaco.languages.registerCompletionItemProvider("python", {
                triggerCharacters: ["f", "i", "w"],
                provideCompletionItems: function(model, position) {
                    const suggestions = [{
                            label: "ifmain",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: `if __name__ == "__main__":
    \${0}`,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        },
                        {
                            label: "fori",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: `for \${1:i} in range(\${2:n}):
    \${0}`,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        },
                        {
                            label: "fastio",
                            kind: monaco.languages.CompletionItemKind.Snippet,
                            insertText: `import sys
input = sys.stdin.readline`,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
                        }
                    ];
                    return { suggestions };
                }
            });
        }

        function initMonacoEditor() {
            return new Promise((resolve) => {
                if (!window.require) {
                    resolve();
                    return;
                }
                window.require.config({
                    paths: {
                        vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
                    }
                });
                window.require(["vs/editor/editor.main"], () => {
                    monaco.editor.defineTheme("codebug-dark", {
                        base: "vs-dark",
                        inherit: true,
                        rules: [],
                        colors: {
                            "editor.background": "#0a162b",
                            "editor.lineHighlightBackground": "#112240",
                            "editorCursor.foreground": "#f0f6ff",
                            "editorBracketMatch.background": "#204a7030",
                            "editorBracketMatch.border": "#4fa3ff",
                            "editorIndentGuide.background1": "#233b5d",
                            "editorIndentGuide.activeBackground1": "#4f89cf"
                        }
                    });

                    registerSnippets(monaco);
                    registerAiCompletion(monaco);
                    const initialLang = getCurrentLang();
                    const initialModel = ensureModel(monaco, initialLang);
                    monacoEditor = monaco.editor.create(document.getElementById("editor"), {
                        model: initialModel,
                        theme: "codebug-dark",
                        automaticLayout: true,
                        minimap: {
                            enabled: false
                        },
                        fontSize: 15,
                        lineHeight: 24,
                        fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                        tabSize: 4,
                        insertSpaces: true,
                        smoothScrolling: true,
                        scrollBeyondLastLine: false,
                        linkedEditing: true,
                        renderValidationDecorations: "on",
                        matchBrackets: "never",
                        folding: true,
                        foldingStrategy: "auto",
                        showFoldingControls: "mouseover",
                        guides: {
                            indentation: false,
                            bracketPairs: false,
                            highlightActiveIndentation: false
                        },
                        bracketPairColorization: {
                            enabled: false
                        },
                        autoClosingBrackets: "languageDefined",
                        autoClosingQuotes: "languageDefined",
                        autoSurround: "languageDefined",
                        inlineSuggest: {
                            enabled: true,
                            suppressSuggestions: false
                        },
                        suggestOnTriggerCharacters: true,
                        quickSuggestions: {
                            other: true,
                            comments: false,
                            strings: true
                        },
                        wordBasedSuggestions: "allDocuments",
                        formatOnType: true,
                        formatOnPaste: true
                    });

                    monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
                        runSingle();
                    });

                    const langSelect = document.getElementById("langSelect");
                    if (langSelect) {
                        langSelect.addEventListener("change", () => {
                            const lang = getCurrentLang();
                            const model = ensureModel(monaco, lang);
                            monacoEditor.setModel(model);
                            document.querySelector(".title").textContent = `Код ${langLabel(lang)}`;
                            runDiagnostics(false);
                        });
                    }

                    document.querySelector(".title").textContent = `Код ${langLabel(initialLang)}`;
                    if (ENABLE_DIAGNOSTICS) runDiagnostics(false);
                    resolve();
                });
            });
        }

        async function runSingle() {
            const code = getEditorCode();
            const input = document.getElementById("inputData").value;
      const outputEl = document.getElementById("outputData");
      const logEl = document.getElementById("runLog");
      const statusEl = document.getElementById("status");
      const timeEl = document.getElementById("time");
      const memoryEl = document.getElementById("memory");
      const nowText = new Date().toLocaleTimeString();

      const appendRunLog = (message) => {
        if (!logEl) return;
        logEl.value = `[${new Date().toLocaleTimeString()}] ${message}\n` + logEl.value;
      };

      if (!code.trim()) {
        statusEl.textContent = "Код пустой";
        statusEl.classList.add("bad");
        appendRunLog("Запуск отменён: код пустой");
        return;
      }

      statusEl.textContent = "Выполняется...";
      statusEl.classList.remove("bad");
      timeEl.textContent = "— ms";
      memoryEl.textContent = "— MB";
      outputEl.value = "";
      appendRunLog(`Старт запуска (${nowText})`);
      try {
                const language = getCurrentLang();
                const { ok: fetchOk, data } = await fetchJson("/run-single", {
                    code,
                    input,
                    language
                });
        if (!fetchOk) {
          statusEl.textContent = data.error || "Ошибка запуска";
          statusEl.classList.add("bad");
          outputEl.value = data.details || "";
          appendRunLog(`Ошибка запуска: ${statusEl.textContent}`);
          return;
        }

                outputEl.value = data.output || "";
                statusEl.textContent = data.status ? `Статус: ${data.status}` : "Готово";
                statusEl.classList.toggle("bad", data.status && data.status !== "OK");
                timeEl.textContent = Number.isFinite(data.timeMs) ? `${data.timeMs} ms` : "— ms";
                memoryEl.textContent = Number.isFinite(data.memoryMb) ? `${data.memoryMb} MB` : "— MB";
        if (data.details) {
          outputEl.value = (outputEl.value ? outputEl.value + "\n\n" : "") + data.details;
        }
        appendRunLog(`Финиш: ${statusEl.textContent}, ${timeEl.textContent}, ${memoryEl.textContent}`);
      } catch (err) {
        statusEl.textContent = "Сервер недоступен";
        statusEl.classList.add("bad");
        outputEl.value = "";
        appendRunLog("Ошибка: сервер недоступен");
      }
    }

        document.getElementById("runBtn").addEventListener("click", runSingle);

        document.getElementById("inputData").value = "2 3\n";
        document.getElementById("runLog").value = `[${new Date().toLocaleTimeString()}] Готово к запуску\n`;
        initMonacoEditor();
    </script>
</body>
