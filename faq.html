<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set these pages actually load; 'unsafe-inline' is
      required because the page logic lives in inline <script> blocks, so the value
      of this policy is that it pins WHICH hosts may serve scripts and WHERE data
      may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag.
      Clickjacking protection for this static site needs an HTTP header at the CDN.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.europe-west1.firebasedatabase.app;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com https://*.europe-west1.firebasedatabase.app;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Помощь — CodeBug</title>
    <meta name="description" content="Ответы на частые вопросы о CodeBug: как устроены задачи, как начисляется опыт, почему бывает TL и куда писать, если что-то сломалось.">
    <link rel="canonical" href="https://codebug.online/faq.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CodeBug">
    <meta property="og:title" content="Помощь — CodeBug">
    <meta property="og:description" content="Ответы на частые вопросы о CodeBug: как устроены задачи, как начисляется опыт, почему бывает TL и куда писать, если что-то сломалось.">
    <meta property="og:url" content="https://codebug.online/faq.html">
    <meta property="og:image" content="https://codebug.online/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="CodeBug: найди баг в коде на C++ и почини его">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="/logo.png?v=3">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --bg-strong: #0B0B0B;
            --ink: #FFFFFF;
            --muted: #B0B0B0;
            --dim: #6d6c68;
            --accent: #F59E0B;
            --accent-strong: #FBBF24;
            --card: #121212;
            --stroke: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            --serif: "Lora", Georgia, "Times New Roman", serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
            background-attachment: fixed;
        }

        ::selection {
            background: rgba(245, 158, 11, 0.2);
        }

        header {
            height: 72px;
            background: rgba(5, 5, 5, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 4vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: none;
        }

        .logo {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--ink);
        }

        nav a {
            margin-left: 20px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Help: every question is visible; the one nearest the centre of the screen
           grows and sharpens, and its answer streams in like a chat model's reply. */
        .help {
            max-width: 1120px;
            margin: 0 auto;
            padding: 48px 6% 0;
        }

        .help-title {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
        }

        .help-list {
            padding: 16vh 0 38vh;
        }

        .help-item {
            margin: 0 0 64px;
            transform-origin: left center;
            will-change: transform;
        }

        .help-q {
            margin: 0;
            font: 500 clamp(30px, 4.2vw, 52px)/1.08 var(--serif);
            letter-spacing: -0.02em;
            text-wrap: balance;
            color: #e9e8e4;
            transition: color 0.3s;
        }

        .help-item.focus .help-q {
            color: #fff;
        }

        .help-q .w {
            display: inline-block;
            white-space: pre;
        }

        .help-q.wake .w {
            animation: wordIn 0.6s ease both;
            animation-delay: calc(var(--i) * 45ms);
        }

        .help-a {
            max-width: 72ch;
            margin-top: 16px;
            font-size: 18px;
            line-height: 1.65;
            color: #cfcdc6;
        }

        .help-a .off {
            color: transparent;
        }

        .help-a a {
            color: var(--accent);
            text-decoration: none;
        }

        .tok {
            animation: tokIn 0.45s ease both;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-left: 4px;
            border-radius: 50%;
            background: var(--accent);
            vertical-align: 0.05em;
            animation: pulse 1.1s ease-in-out infinite;
        }

        .dot[hidden] {
            display: none;
        }

        @keyframes tokIn {
            from { opacity: 0; filter: blur(3px); }
            to { opacity: 1; filter: none; }
        }

        @keyframes wordIn {
            0% { opacity: 0.35; filter: blur(4px); transform: translateY(6px); }
            100% { opacity: 1; filter: none; transform: none; }
        }

        @keyframes pulse {
            50% { transform: scale(0.55); opacity: 0.5; }
        }

        .help-fade {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 110px;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(rgba(8, 8, 8, 0), #0a0a0a);
        }

        #global-legal-footer {
            position: relative;
            z-index: 2;
        }

        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }
            .help {
                padding: 30px 20px 0;
            }
            .help-title {
                font-size: 28px;
            }
            .help-item {
                margin-bottom: 52px;
            }
            .help-a {
                font-size: 16.5px;
            }
        }
    </style>
    <link rel="stylesheet" href="theme-dark.css">
</head>

<body>

    <header>
        <div class="logo">CodeBug</div>
        <nav id="nav-links"></nav>
    </header>

    <main class="help">
        <h1 class="help-title">Помощь</h1>
        <div class="help-list" id="helpList"></div>
    </main>
    <div class="help-fade" aria-hidden="true"></div>


    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

    <script src="firebase.js"></script>
    <!-- обязательно первой! -->
    <script src="auth.js?v=20261024-google"></script>
    <!-- использует db -->
    <script src="globalsubmissions.js"></script>
    <!-- использует db -->
    <script src="submit.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", updateNavbar);

        (function () {
            // Facts match the site: XP per difficulty, buttons on the problem and training pages, contacts.
            const QA = [
                ["Что здесь вообще делают?", "Чинят чужой код. В каждой задаче уже лежит решение, и в нём есть ошибка. Твоя работа: найти её, исправить и отправить на проверку."],
                ["Я не олимпиадник. Мне сюда можно?", "Можно. Хватит базового C++: циклы, массивы, функции. Начни с лёгких задач, там ошибка обычно сидит в одной-двух строках."],
                ["Какие баги тут прячут?", "Переполнение int, выход за границы массива, забытый крайний случай, не тот знак в условии, слишком медленный алгоритм. Всё то, на чём спотыкаются на настоящих контестах."],
                ["Как понять, что я починил?", "Нажми «Отправить». Если прошли все тесты, придёт OK и опыт за задачу. До отправки можно прогнать код на своём примере в блоке «Запуск на своих данных», на баллы это не влияет."],
                ["А подсмотреть правильный ответ нельзя?", "Нет, и это специально. Если застрял, перечитай условие, посмотри пример теста и вердикт. Кнопка «Сброс» над редактором вернёт исходный код, если правки зашли не туда."],
                ["С какой задачи начать?", "С лёгкой. Сложность видна в списке на «Тренировке»: лёгкая даёт 4 опыта, нормальная 12, сложная 20."],
                ["Откуда берётся мой рейтинг?", "Это сумма опыта за решённые задачи. От неё зависят твой ранг и цвет ника в таблице."],
                ["Почему TL, если код правильный?", "Правильный, но медленный. Посмотри ограничения в начале условия и прикинь, сколько операций делает алгоритм. Часто баг как раз в лишнем вложенном цикле."],
                ["Без регистрации совсем никак?", "Условия и код можно читать и так. Чтобы отправлять решения и копить опыт, нужен аккаунт."],
                ["Только C++?", "Пока да. Задачи на Python в планах."],
                ["Хочу добавить свою задачу", "Внизу «Тренировки» есть кнопка «Предложить задачу». Пришли код с ошибкой и объясни, где она прячется."],
                ["Что-то сломалось. Кому писать?", "В Telegram @afony_l или на support@codebug.online. Скриншот и ссылка на задачу заметно ускорят ответ."]
            ];
            const list = document.getElementById("helpList");
            if (!list) return;
            const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
            const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

            list.innerHTML = QA.map(([q, a]) => {
                const words = q.split(" ").map((w, i) => `<span class="w" style="--i:${i}">${esc(w)}${i < q.split(" ").length - 1 ? " " : ""}</span>`).join("");
                return `<article class="help-item"><h2 class="help-q">${words}</h2><p class="help-a"><span class="on"></span><span class="dot" hidden></span><span class="off">${esc(a)}</span></p></article>`;
            }).join("");

            const items = Array.from(list.querySelectorAll(".help-item")).map((el, i) => ({
                el, text: QA[i][1], k: 0, started: false,
                q: el.querySelector(".help-q"), ans: el.querySelector(".help-a"),
                on: el.querySelector(".on"), off: el.querySelector(".off"), dot: el.querySelector(".dot")
            }));

            // The answer arrives in 1-4 letter chunks; each chunk fades in from a blur.
            function stream(it) {
                if (it.k >= it.text.length) { it.dot.hidden = true; return; }
                const n = Math.min(it.text.length - it.k, 1 + Math.floor(Math.random() * 4));
                const span = document.createElement("span");
                span.className = "tok";
                span.textContent = it.text.slice(it.k, it.k + n);
                it.on.appendChild(span);
                it.k += n;
                it.off.textContent = it.text.slice(it.k);
                setTimeout(() => stream(it), 28 + Math.random() * 40);
            }

            function start(it) {
                if (it.started) return;
                it.started = true;
                it.q.classList.add("wake");
                it.dot.hidden = false;
                setTimeout(() => stream(it), 220);
            }

            let raf = 0;
            function frame() {
                raf = 0;
                const c = window.innerHeight * 0.45, H = window.innerHeight * 0.6;
                items.forEach((it) => {
                    const r = it.el.getBoundingClientRect();
                    const mid = r.top + Math.min(r.height, 140) / 2;
                    const k = clamp(Math.abs(mid - c) / H, 0, 1);
                    // questions stay readable: at least 70% size and 45% opacity, slightly soft far away
                    it.el.style.transform = `scale(${(1 - k * 0.3).toFixed(4)})`;
                    it.q.style.opacity = (1 - k * 0.55).toFixed(3);
                    it.q.style.filter = k > 0.3 ? `blur(${((k - 0.3) * 1.6).toFixed(2)}px)` : "none";
                    it.ans.style.opacity = clamp(1.25 - k * 1.6, 0.18, 1).toFixed(3);
                    const focus = k < 0.28;
                    it.el.classList.toggle("focus", focus);
                    if (focus) start(it);
                });
            }
            window.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });
            window.addEventListener("resize", frame);
            frame();
        })();
    </script>
</body>

</html>
