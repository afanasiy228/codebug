<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set this page actually loads; 'unsafe-inline' is
      required because the page's own logic lives in inline <script> blocks, so the
      value of this policy is that it pins WHICH hosts may serve scripts and WHERE
      data may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag and
      warn in the console. Clickjacking protection for this static site has to come
      from an HTTP header at the CDN (see the audit report's manual actions).
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://*.europe-west1.firebasedatabase.app;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com https://*.europe-west1.firebasedatabase.app;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>CodeBug — Авторизация</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">

    <style>
        :root {
            --bg: #050505;
            --bg-strong: #0B0B0B;
            --ink: #FFFFFF;
            --muted: #B0B0B0;
            --accent: #F59E0B;
            --accent-strong: #FBBF24;
            --warm: #F59E0B;
            --card: #121212;
            --stroke: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        
        body {
            margin: 0;
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(1200px 500px at 20% -10%, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(900px 500px at 80% 0%, rgba(255, 255, 255, 0.03), transparent 60%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
        }

        * {
            box-sizing: border-box;
        }

        ::selection {
            background: rgba(245, 158, 11, 0.2);
        }
        
        header {
            height: 72px;
            background: rgba(5, 5, 5, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 4vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: none;
        }
        
        .logo {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--ink);
        }
        
        nav a {
            margin-left: 20px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        
        nav a:hover {
            color: var(--accent);
        }
        
        /* Activity grid behind the form: empty at first, lights up in a wave from the
           card outward as the visitor types (fast at first, then slower). */
        .auth-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: grid;
            grid-template-columns: repeat(var(--cols, 40), 1fr);
            gap: 4px;
            padding: 4px;
            align-content: start;
            pointer-events: none;
        }

        .auth-grid i {
            aspect-ratio: 1;
            border-radius: 3px;
            background: #0e0e0e;
            transition: background 0.45s ease;
        }

        .auth-grid i.l1 { background: #0c2a18; }
        .auth-grid i.l2 { background: #105a2c; }
        .auth-grid i.l3 { background: #1a9e4c; }

        .auth-shade {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(520px 420px at 50% 52%, rgba(5, 5, 5, 0.55), rgba(5, 5, 5, 0.2) 70%, rgba(5, 5, 5, 0.05)),
                linear-gradient(180deg, rgba(5, 5, 5, 0.35), rgba(5, 5, 5, 0) 18%);
        }

        .auth-shell {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 72px);
            min-height: calc(100dvh - 72px);
            display: grid;
            place-items: center;
            padding: 40px 20px 60px;
        }

        /* Liquid glass card: translucent, blurred and saturated backdrop, bright rim. */
        .glass.container {
            position: relative;
            width: min(400px, 100%);
            padding: 30px 30px 32px;
            border-radius: 28px;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025) 42%, rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            backdrop-filter: blur(18px) saturate(170%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05),
                0 30px 80px rgba(0, 0, 0, 0.55);
        }

        .glass.container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 32%, rgba(255, 255, 255, 0) 68%, rgba(255, 255, 255, 0.2));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .glass h1 {
            margin: 0 0 22px;
        }

        .glass input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 14px;
            padding: 13px 14px;
        }

        .glass input:focus {
            border-color: rgba(245, 158, 11, 0.7) !important;
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .glass .avatar-preview {
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
        }

        .glass .turnstile-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .glass button:not(.password-toggle) {
            border-radius: 14px;
        }

        .auth-aside {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(255, 255, 255, 0.03));
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(245, 158, 11, 0.12);
            padding: 6px 12px;
            border-radius: 999px;
            width: fit-content;
        }

        .auth-aside h2 {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 32px;
        }

        .auth-aside p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .auth-steps {
            display: grid;
            gap: 10px;
            margin-top: auto;
        }

        .auth-step {
            background: rgba(18, 18, 18, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--muted);
        }

        .container {
            width: 100%;
            padding: 26px 30px 40px;
            background: var(--card);
            border-radius: 22px;
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }
        
        h1 {
            text-align: center;
            color: var(--ink);
            font-size: 26px;
            margin-bottom: 25px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        input {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid var(--stroke);
            border-radius: 12px;
            color: var(--ink);
            margin-bottom: 14px;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .password-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .password-wrap input {
            margin-bottom: 0;
            padding-right: 46px;
        }

        .password-wrap .password-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px !important;
            height: 36px !important;
            min-width: 36px;
            border: 0 !important;
            border-radius: 10px;
            background: transparent !important;
            box-shadow: none !important;
            color: var(--muted) !important;
            margin: 0 !important;
            padding: 0 !important;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .password-wrap .password-toggle:hover {
            background: rgba(245, 158, 11, 0.08) !important;
            color: var(--accent) !important;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .password-toggle .eye-off,
        .password-toggle.is-visible .eye-on {
            display: none;
        }

        .password-toggle.is-visible .eye-off {
            display: block;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 16px 32px rgba(245, 158, 11, 0.25);
        }
        
        button:hover {
            background: var(--accent-strong);
        }
        
        .error-msg {
            color: #EF4444;
            font-size: 13px;
            height: 18px;
            margin-top: -6px;
            margin-bottom: 8px;
        }
        
        .switch-link {
            margin-top: 14px;
            text-align: center;
            color: var(--accent);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .helper-link {
            margin-top: -2px;
            margin-bottom: 8px;
            text-align: right;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        
        .avatar-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: #fff;
            border: 1px solid var(--stroke);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            font-weight: 700;
            color: var(--ink);
        }
        
        .turnstile-wrap {
            margin-top: 10px;
            margin-bottom: 8px;
            min-height: 66px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.65);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* MODAL */
        
        #modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }
        
        #modal {
            width: 280px;
            padding: 20px;
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--stroke);
            text-align: center;
            opacity: 0;
            transform: scale(0.7);
            transition: .25s;
        }
        
        #modal.show {
            opacity: 1;
            transform: scale(1);
        }

        .reveal {
            opacity: 0;
            transform: translateY(18px);
            animation: fadeUp 0.7s ease forwards;
            animation-delay: var(--delay, 0s);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .auth-shell {
                min-height: calc(100vh - 50px);
                min-height: calc(100dvh - 50px);
                padding: 28px 16px 40px;
            }
            .glass.container {
                padding: 24px 20px 26px;
                border-radius: 24px;
            }
            .auth-grid {
                gap: 3px;
                padding: 3px;
            }
        }

        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
    <link rel="stylesheet" href="theme-dark.css">
</head>

<body>

    <header>
        <div class="logo">CodeBug</div>
        <nav id="nav-links"></nav>
    </header>

    <div class="auth-grid" id="authGrid" aria-hidden="true"></div>
    <div class="auth-shade" aria-hidden="true"></div>
    <main class="auth-shell">
        <div class="container glass reveal" id="authCard" style="--delay: 0.05s;">

        <!-- LOGIN -->
        <div id="screen-login">
            <h1>Вход</h1>

            <input id="login-identity" type="text" placeholder="Логин или Email">
            <div class="password-wrap">
                <input id="login-pass" type="password" placeholder="Пароль">
                <button type="button" class="password-toggle" onclick="togglePassword('login-pass', this)" aria-label="Показать пароль" aria-pressed="false">
                    <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 4.2A10.8 10.8 0 0 1 22 12a10.7 10.7 0 0 1-2.3 3.3"></path><path d="M6.6 6.6A10.8 10.8 0 0 0 2 12a10.9 10.9 0 0 0 14.4 5.4"></path></svg>
                </button>
            </div>
            <div class="helper-link" onclick="forgotPassword()">Забыли пароль?</div>
            <div id="login-error" class="error-msg"></div>

            <button onclick="login()">Войти</button>

            <div class="switch-link" onclick="goRegister()">Нет аккаунта? Регистрация</div>
        </div>

        <!-- REGISTER -->
        <div id="screen-register" style="display:none;">
            <h1>Регистрация</h1>

            <div class="avatar-preview" id="avatarPreview">A</div>

            <input id="reg-user" type="text" placeholder="Логин" oninput="updateAvatar()">
            <input id="reg-email" type="email" placeholder="Email">
            <div class="password-wrap">
                <input id="reg-pass" type="password" placeholder="Пароль">
                <button type="button" class="password-toggle" onclick="togglePassword('reg-pass', this)" aria-label="Показать пароль" aria-pressed="false">
                    <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 12a10.9 10.9 0 0 1 19.8 0 10.9 10.9 0 0 1-19.8 0Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18"></path><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 4.2A10.8 10.8 0 0 1 22 12a10.7 10.7 0 0 1-2.3 3.3"></path><path d="M6.6 6.6A10.8 10.8 0 0 0 2 12a10.9 10.9 0 0 0 14.4 5.4"></path></svg>
                </button>
            </div>

            <div id="turnstile-box" class="turnstile-wrap"></div>

            <div id="reg-error" class="error-msg"></div>

            <button id="reg-submit-btn" onclick="register()" disabled>Зарегистрироваться</button>

            <div class="switch-link" onclick="goLogin()">Уже есть аккаунт? Войти</div>
        </div>

        <!-- VERIFY EMAIL -->
        <div id="screen-verify" style="display:none;">
            <h1>Подтверждение Email</h1>
            <p style="color:var(--muted);line-height:1.55;margin-top:-4px;">
                Мы отправили ссылку подтверждения на <b id="verify-email-label">твой email</b>. Пока ты не подтвердишь почту, доступ к аккаунту закрыт.
            </p>
            <div id="verify-error" class="error-msg" style="height:auto;min-height:18px;"></div>
            <button onclick="checkVerificationStatus()">Я подтвердил, проверить</button>
            <button type="button" onclick="resendVerificationFromForm()" style="margin-top:8px;background:#1f7a63;">Отправить ссылку повторно</button>
            <button type="button" onclick="cancelPendingRegistration()" style="margin-top:8px;background:#8f3d3d;">Отменить регистрацию</button>
        </div>

        </div>
    </main>

    <script>
        window.onRecaptchaLoad = function() {
            if (window.renderCaptchaWidget) window.renderCaptchaWidget();
        };
    </script>

    <script>
        updateNavbar();

        function goLogin() {
            if (window.isRegistrationLocked && window.isRegistrationLocked()) {
                const pending = window.getPendingRegistrationSafe ? window.getPendingRegistrationSafe() : null;
                if (window.showVerifyScreen) {
                    window.showVerifyScreen((pending && pending.email) || "", "Сначала подтверди email.");
                }
                return;
            }
            document.getElementById("screen-login").style.display = "block";
            document.getElementById("screen-register").style.display = "none";
            document.getElementById("screen-verify").style.display = "none";
        }

        function goRegister() {
            if (window.isRegistrationLocked && window.isRegistrationLocked()) {
                const pending = window.getPendingRegistrationSafe ? window.getPendingRegistrationSafe() : null;
                if (window.showVerifyScreen) {
                    window.showVerifyScreen((pending && pending.email) || "", "Сначала подтверди email.");
                }
                return;
            }
            document.getElementById("screen-login").style.display = "none";
            document.getElementById("screen-register").style.display = "block";
            document.getElementById("screen-verify").style.display = "none";
            if (window.renderCaptchaWidget) window.renderCaptchaWidget();
        }

        if (window.renderCaptchaWidget) window.renderCaptchaWidget();

        function togglePassword(inputId, buttonEl) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const nextType = input.type === "password" ? "text" : "password";
            input.type = nextType;
            if (buttonEl) {
                const visible = nextType === "text";
                buttonEl.classList.toggle("is-visible", visible);
                buttonEl.setAttribute("aria-label", visible ? "Скрыть пароль" : "Показать пароль");
                buttonEl.setAttribute("aria-pressed", String(visible));
            }
        }
    </script>

    <script>
        // Activity grid: lit cells follow how much has been typed into the form.
        // Lit share = 1 - e^(-chars / 9): the first keystrokes light a lot, later ones less.
        (function () {
            const grid = document.getElementById("authGrid");
            const card = document.getElementById("authCard");
            if (!grid || !card) return;
            let cells = [], order = [], levels = [], lit = 0, cols = 0, rows = 0, timers = [];

            function seeded(seed) {
                return function () {
                    seed = (seed * 1664525 + 1013904223) >>> 0;
                    return seed / 4294967296;
                };
            }

            function build() {
                const w = window.innerWidth, h = window.innerHeight;
                const target = w < 640 ? 22 : 28;
                cols = Math.max(12, Math.round(w / target));
                const cell = (w - 8) / cols;
                rows = Math.ceil(h / cell) + 1;
                grid.style.setProperty("--cols", cols);
                grid.innerHTML = "<i></i>".repeat(cols * rows);
                cells = Array.from(grid.children);
                const rnd = seeded(20251010);
                const r = card.getBoundingClientRect();
                const cx = (r.left + r.width / 2) / cell, cy = (r.top + r.height / 2) / cell;
                levels = cells.map(() => {
                    const p = rnd();
                    return p < 0.3 ? 0 : p < 0.6 ? 1 : p < 0.85 ? 2 : 3;
                });
                order = cells
                    .map((_, i) => ({ i, d: Math.hypot((i % cols) + 0.5 - cx, Math.floor(i / cols) + 0.5 - cy) + rnd() * 1.6 }))
                    .sort((a, b) => a.d - b.d)
                    .map((x) => x.i);
                lit = 0;
            }

            function typedChars() {
                let n = 0;
                card.querySelectorAll("input").forEach((inp) => {
                    if (inp.offsetParent !== null) n += inp.value.length;
                });
                return n;
            }

            // `lit` is how many cells (in wave order) are actually lit right now; a new
            // keystroke continues from there, so a fast typist never leaves gaps.
            function update() {
                const want = Math.round(order.length * (1 - Math.exp(-typedChars() / 9)));
                timers.forEach(clearTimeout);
                timers = [];
                if (want === lit) return;
                const step = want > lit ? 1 : -1, count = Math.abs(want - lit);
                const gap = Math.min(6, 420 / count);
                for (let k = 0; k < count; k++) {
                    timers.push(setTimeout(() => {
                        if (step > 0) {
                            const idx = order[lit];
                            if (levels[idx]) cells[idx].className = "l" + levels[idx];
                            lit++;
                        } else {
                            lit--;
                            cells[order[lit]].className = "";
                        }
                    }, k * gap));
                }
            }

            build();
            card.addEventListener("input", update);
            card.addEventListener("click", () => setTimeout(update, 0));
            let resizeTimer = 0;
            window.addEventListener("resize", () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    timers.forEach(clearTimeout);
                    build();
                    const keep = Math.round(order.length * (1 - Math.exp(-typedChars() / 9)));
                    for (let k = 0; k < keep; k++) {
                        const idx = order[k];
                        if (levels[idx]) cells[idx].className = "l" + levels[idx];
                    }
                    lit = keep;
                }, 150);
            });
            // Autofill from a password manager may not fire input events.
            setTimeout(update, 800);
        })();
    </script>
</body>
