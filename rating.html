<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set these pages actually load; 'unsafe-inline' is
      required because the page logic lives in inline <script> blocks, so the value
      of this policy is that it pins WHICH hosts may serve scripts and WHERE data
      may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag.
      Clickjacking protection for this static site needs an HTTP header at the CDN.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг — CodeBug</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">

    <style>
        :root {
            --bg: #050505;
            --bg-strong: #0B0B0B;
            --ink: #FFFFFF;
            --muted: #B0B0B0;
            --accent: #F59E0B;
            --accent-strong: #FBBF24;
            --danger: #EF4444;
            --success: #22C55E;
            --warm: #FBBF24;
            --card: #121212;
            --stroke: rgba(255, 255, 255, 0.08);
            --shadow: 0 20px 52px rgba(0, 0, 0, 0.35);
        }
        
        body {
            background:
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
            color: var(--ink);
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        ::selection {
            background: rgba(245, 158, 11, 0.24);
        }
        
        header {
            height: 72px;
            background: rgba(5, 5, 5, 0.88);
            border-bottom: 1px solid var(--stroke);
            padding: 0 4vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        }
        
        .logo {
            font-weight: 700;
            color: #edf4fb;
            font-size: 20px;
            letter-spacing: 0.4px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .brand-code,
        .brand-bug,
        .brand-suffix { color: #FFFFFF; }
        
        nav a {
            margin-left: 20px;
            color: #a8b9c7;
            text-decoration: none;
            font-weight: 600;
        }
        
        nav a:hover {
            color: #d9e6f2;
        }
        /* --- РЕЙТИНГ --- */
        
        .rating-container {
            width: min(1480px, calc(100% - 48px));
            margin: 40px auto;
        }
        
        .rating-head {
            padding: 4px 2px 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(128, 151, 166, 0.26);
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-strong);
            background: rgba(245, 158, 11, 0.15);
            margin-bottom: 12px;
        }

        .rating-container h1 {
            color: #e7f0f7;
            margin: 0 0 8px;
            font-weight: 700;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .rating-guide {
            display: grid;
            grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
            gap: 36px;
            align-items: end;
            padding: 18px 2px 26px;
        }

        .experience-copy {
            margin: 0;
            color: #c1cbd3;
            font-size: 15px;
            line-height: 1.55;
        }

        .experience-copy strong {
            display: block;
            margin-bottom: 4px;
            color: #f4f6f8;
            font-size: 17px;
        }

        .rank-scale-label {
            margin: 0 0 10px;
            color: #8fa0ad;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .rating-guide > div {
            min-width: 0;
        }

        .rank-scale {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 16px 0;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(245, 158, 11, 0.35) transparent;
        }

        .rank-step {
            min-width: 112px;
            padding: 10px 12px 0 0;
            border-top: 2px solid var(--rank-color);
        }

        .rank-step-name {
            display: block;
            min-height: 34px;
            color: var(--rank-color);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.25;
        }

        .rank-step-exp {
            display: block;
            margin-top: 5px;
            color: #778894;
            font-size: 11px;
        }

        .rating-grid-head {
            display: grid;
            grid-template-columns: 84px minmax(0, 1fr) 160px 150px;
            align-items: end;
            gap: 8px;
            padding: 0 12px 8px;
            color: #91a7b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .rating-list {
            display: grid;
            gap: 2px;
            border-top: 1px solid rgba(120, 144, 160, 0.2);
            border-bottom: 1px solid rgba(120, 144, 160, 0.2);
        }

        .rating-row {
            position: relative;
            display: grid;
            grid-template-columns: 84px minmax(0, 1fr) 160px 150px;
            align-items: center;
            gap: 8px;
            min-height: 74px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(114, 136, 152, 0.28);
            border-radius: 8px;
            background: #121212;
            overflow: hidden;
            transition: background-color .14s ease, transform .14s ease, filter .14s ease;
        }

        .rating-row::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--row-banner, none);
            background-size: cover;
            background-position: center;
            opacity: var(--row-banner-opacity, 0);
            z-index: 0;
            transition: opacity .16s ease;
        }

        .rating-row::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(5, 5, 5, 0.84), rgba(11, 11, 11, 0.72));
            z-index: 1;
        }

        .rating-row:hover {
            background: rgba(245, 158, 11, 0.12);
            transform: translateX(2px);
            filter: brightness(1.06);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), 0 0 25px rgba(245, 158, 11, 0.18);
        }

        .rating-row:hover::before {
            opacity: var(--row-banner-hover-opacity, 0);
        }

        .place,
        .user-block,
        .user-exp,
        .user-solved {
            position: relative;
            z-index: 2;
        }
        
        .place {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            text-align: left;
            padding-left: 2px;
        }

        .rating-row:nth-child(1) .place { color: #FBBF24; }
        .rating-row:nth-child(2) .place { color: #CBD5E1; }
        .rating-row:nth-child(3) .place { color: #B87333; }
        
        .user-block {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
            min-width: 0;
        }
        
        .ava {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            border: 0;
            background: rgba(245, 158, 11, 0.15);
        }
        
        .ava.default {
            background: rgba(245, 158, 11, 0.15);
            color: #e6f0f8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 20px;
        }

        .user-text {
            min-width: 0;
        }
        
        .user-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-name a {
            display: inline-block;
            min-width: 0;
            max-width: 100%;
            line-height: 1.12;
            color: #FFFFFF;
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-name a:hover {
            color: var(--accent-strong);
        }

        
        .user-rank {
            font-size: 14px;
            color: #a9bfce;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-tier-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid rgba(251, 191, 36, 0.54);
            background: rgba(30, 58, 138, 0.18);
            color: #FBBF24;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
            vertical-align: middle;
            isolation: isolate;
        }
        
        .user-exp,
        .user-solved {
            text-align: right;
            font-size: 15px;
            font-weight: 600;
        }

        .user-exp {
            color: var(--accent-strong);
        }

        .user-solved {
            color: var(--success);
        }

        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }

            .rating-container {
                width: min(100% - 28px, 1480px);
                margin-top: 28px;
            }

            .rating-guide {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .rank-scale {
                grid-template-columns: repeat(10, minmax(112px, 1fr));
                gap: 0;
            }

            .rating-grid-head {
                display: none;
            }

            .rating-row {
                grid-template-columns: 42px minmax(0, 1fr);
                gap: 8px 10px;
                min-height: 92px;
            }

            .user-exp {
                grid-column: 2;
                justify-self: start;
                text-align: left;
                font-size: 13px;
            }

            .user-solved {
                grid-column: 2;
                justify-self: end;
                text-align: right;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo"><span class="brand-code">Code</span><span class="brand-bug">Bug</span></div>
        <nav id="nav-links"></nav>
    </header>

    <div class="rating-container">
        <div class="rating-head">
            <div class="rating-badge">Топ CodeBug</div>
            <h1>Рейтинг пользователей</h1>
        </div>
        <section class="rating-guide" aria-label="Как устроены опыт и ранги">
            <p class="experience-copy">
                <strong>Как получить опыт</strong>
                Решай задачи и занимай призовые места в соревнованиях. С ростом опыта повышается ранг, а ник без подписки становится темнее.
            </p>
            <div>
                <p class="rank-scale-label">Ранги и цвет ника</p>
                <div id="rank-scale" class="rank-scale"></div>
            </div>
        </section>
        <div class="rating-grid-head">
            <div>#</div>
            <div>Пользователь</div>
            <div style="text-align:right;">EXP</div>
            <div style="text-align:right;">Решено</div>
        </div>
        <div id="rating-list" class="rating-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script src="firebase.js"></script>
    <!-- обязательно первой! -->
    <script src="auth.js?v=20260608-header"></script>
    <!-- использует db -->
    <script src="globalsubmissions.js"></script>
    <!-- использует db -->
    <script src="submit.js"></script>
    <script>
        updateNavbar();

        /* ======================
              РАНГИ
        ====================== */
        const RANK_LEVELS = [
            { minExp: 0, name: "Новичок" },
            { minExp: 10, name: "Мистер WA1" },
            { minExp: 50, name: "Знает как отлавливать CE" },
            { minExp: 100, name: "Бывалый" },
            { minExp: 200, name: "Найдет ошибку в тени" },
            { minExp: 300, name: "Повелитель RE" },
            { minExp: 500, name: "Охотник за TL" },
            { minExp: 800, name: "Оптимизатор ML" },
            { minExp: 1200, name: "Code Wizard" },
            { minExp: 2000, name: "Легенда CodeBug" }
        ];

        function getRank(exp) {
            const value = Number(exp || 0);
            return [...RANK_LEVELS].reverse().find((rank) => value >= rank.minExp)?.name || RANK_LEVELS[0].name;
        }

        function renderRankScale() {
            const scale = document.getElementById("rank-scale");
            if (!scale) return;
            scale.innerHTML = RANK_LEVELS.map((rank) => {
                const color = typeof getRankNickColorByExp === "function"
                    ? getRankNickColorByExp(rank.minExp)
                    : "#FFFFFF";
                return `<div class="rank-step" style="--rank-color:${color}">
                    <span class="rank-step-name">${escapeHtml(rank.name)}</span>
                    <span class="rank-step-exp">от ${rank.minExp} EXP</span>
                </div>`;
            }).join("");
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const RATING_COVER_PRESETS = {
            cover_1: "linear-gradient(120deg,#121212 0%,#F59E0B 100%)",
            cover_2: "linear-gradient(120deg,#050505 0%,#D97706 55%,#FBBF24 100%)",
            cover_3: "linear-gradient(120deg,#050505 0%,#3A2A12 100%)",
            cover_4: "linear-gradient(120deg,#0B0B0B 0%,#EF4444 100%)",
            cover_5: "linear-gradient(120deg,#050505 0%,#121212 50%,#2A2A2A 100%)",
            cover_6: "linear-gradient(120deg,#0B0B0B 0%,#242424 100%)",
            cover_7: "linear-gradient(120deg,#121212 0%,#B45309 100%)",
            cover_8: "linear-gradient(120deg,#050505 0%,#1A1A1A 50%,#F59E0B 100%)",
            cover_9: "linear-gradient(120deg,#0B0B0B 0%,#F59E0B 35%,#F59E0B 100%)",
            cover_10: "linear-gradient(120deg,#050505 0%,#121212 50%,#FBBF24 100%)"
        };

        function getRowBanner(style, level) {
            const profileStyle = (style && typeof style === "object") ? style : {};
            const custom = String(profileStyle.coverUrl || "").trim();
            const canUseCustom = level !== "free";
            if (canUseCustom && (/^https?:\/\//i.test(custom) || custom.startsWith("/"))) {
                const coverUrl = typeof getOptimizedCoverUrl === "function" ? getOptimizedCoverUrl(custom) : custom;
                // A quote, backslash, parenthesis or newline in a user-supplied cover URL
                // would otherwise break out of the CSS url("...") string.
                if (/["'\\()\s]/.test(coverUrl)) return "";
                return `url("${coverUrl}")`;
            }
            const coverIdRaw = String(profileStyle.coverId || "").trim().toLowerCase();
            if (!coverIdRaw) return "";
            return RATING_COVER_PRESETS[coverIdRaw] || "";
        }

        /* ======================
              ЗАГРУЗКА РЕЙТИНГА
        ====================== */
        async function loadRating() {
            const snap = await firebase.database().ref("ratingLeaderboard").get();
            if (!snap.exists()) return;

            const list = document.getElementById("rating-list");
            const users = snap.val();

            let arr = [];

            for (let login in users) {
                let u = users[login];

                arr.push({
                    login: u.login || login,
                    avatarUrl: u.avatarUrl || "",
                    exp: u.exp || 0,
                    solvedCount: Number(u.cnt || u.solved || 0),
                    subscription: u.subscription || null,
                    profileStyle: u.profileStyle || null
                });
            }

            // сортировка по опыту
            arr.sort((a, b) => b.exp - a.exp);

            arr.forEach((u, index) => {
                const profileUrl = `profile.html?user=${encodeURIComponent(u.login)}`;
                const safeLogin = escapeHtml(u.login);
                const sub = u.subscription || {};
                const level = (typeof getSubscriptionLevel === "function") ? getSubscriptionLevel(sub) : "free";
                const isPro = level !== "free";
                const proColor = (isPro && typeof getSubscriptionNickColor === "function") ? getSubscriptionNickColor(sub) : "#FBBF24";
                const loginColor = isPro ? proColor : (typeof getRankNickColorByExp === "function" ? getRankNickColorByExp(Number(u.exp || 0)) : "#FFFFFF");
                const styledNick = (typeof buildStyledNickHtml === "function")
                    ? buildStyledNickHtml(u.login, sub, loginColor)
                    : safeLogin;
                const avatarUrl = typeof u.avatarUrl === "string" ? u.avatarUrl.trim() : "";
                const avatarSafe = /^https?:\/\//i.test(avatarUrl) || avatarUrl.startsWith("/") ? avatarUrl : "";
                const avatarDisplayUrl = avatarSafe && typeof getOptimizedAvatarUrl === "function" ? getOptimizedAvatarUrl(avatarSafe) : avatarSafe;
                let avatarHTML = avatarSafe ?
                    `<a href="${profileUrl}"><img class="ava" src="${escapeHtml(avatarDisplayUrl)}" alt="avatar" loading="lazy"></a>` :
                    `<a href="${profileUrl}" style="text-decoration:none;"><div class="ava default">${safeLogin[0].toUpperCase()}</div></a>`;

                let solvedCnt = Number.isFinite(u.solvedCount) ? u.solvedCount : 0;
                const rowBanner = getRowBanner(u.profileStyle, level);
                const hasBanner = !!rowBanner;

                let row = document.createElement("div");
                row.className = "rating-row";
                row.style.setProperty("--row-banner", hasBanner ? rowBanner : "none");
                row.style.setProperty("--row-banner-opacity", hasBanner ? "0.28" : "0");
                row.style.setProperty("--row-banner-hover-opacity", hasBanner ? "0.35" : "0");
                row.style.cursor = "pointer";
                row.addEventListener("click", () => {
                    window.location.href = profileUrl;
                });

                row.innerHTML = `
            <div class="place">${index + 1}</div>

            <div class="user-block">
                ${avatarHTML}
                <div class="user-text">
                    <div class="user-name"><a href="${profileUrl}">${styledNick}</a>${isPro ? `<span class="user-tier-badge">${level === "pro_plus" ? "PRO+" : "PRO"}</span>` : ''}</div>
                    <div class="user-rank">${getRank(u.exp)}</div>
                </div>
            </div>

            <div class="user-exp">${u.exp} EXP</div>
            <div class="user-solved">${solvedCnt} задач</div>
        `;

                list.appendChild(row);
            });
        }

        renderRankScale();
        loadRating();
    </script>

</body>

</html>
