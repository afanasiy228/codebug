<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг — CodeBug</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #11181b;
            --bg-strong: #0f1619;
            --ink: #e5eef6;
            --muted: #9eb0bf;
            --accent: #84e0d0;
            --accent-strong: #67c7b7;
            --warm: #f0d463;
            --card: #1c2529;
            --stroke: rgba(154, 178, 196, 0.26);
            --shadow: 0 20px 52px rgba(0, 0, 0, 0.35);
        }
        
        body {
            background:
                radial-gradient(1100px 460px at 18% -12%, rgba(86, 136, 112, 0.18), transparent 62%),
                radial-gradient(900px 440px at 90% 0%, rgba(64, 108, 118, 0.18), transparent 60%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
            color: var(--ink);
            margin: 0;
            font-family: "IBM Plex Sans", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        ::selection {
            background: rgba(15, 118, 110, 0.2);
        }
        
        header {
            height: 72px;
            background: rgba(20, 30, 34, 0.88);
            border-bottom: 1px solid rgba(128, 151, 166, 0.28);
            padding: 0 4vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        }
        
        .logo {
            font-weight: 700;
            color: #edf4fb;
            font-size: 20px;
            letter-spacing: 0.4px;
            font-family: "Space Grotesk", sans-serif;
        }
        
        nav a {
            margin-left: 20px;
            color: #a8b9c7;
            text-decoration: none;
            font-weight: 600;
        }
        
        nav a:hover {
            color: #d9e6f2;
        }
        /* --- РЕЙТИНГ --- */
        
        .rating-container {
            max-width: 980px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .rating-head {
            padding: 4px 2px 14px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(128, 151, 166, 0.26);
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: #b8efe5;
            background: rgba(110, 231, 183, 0.12);
            margin-bottom: 12px;
        }

        .rating-container h1 {
            color: #e7f0f7;
            margin: 0 0 8px;
            font-weight: 700;
            font-family: "Space Grotesk", sans-serif;
        }

        .rating-sub {
            color: #9eb0bf;
            margin: 0;
        }

        .rating-grid-head {
            display: grid;
            grid-template-columns: 68px minmax(0, 1fr) 120px 120px;
            align-items: end;
            gap: 8px;
            padding: 0 12px 8px;
            color: #91a7b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .rating-list {
            display: grid;
            gap: 2px;
            border-top: 1px solid rgba(120, 144, 160, 0.2);
            border-bottom: 1px solid rgba(120, 144, 160, 0.2);
        }

        .rating-row {
            position: relative;
            display: grid;
            grid-template-columns: 68px minmax(0, 1fr) 120px 120px;
            align-items: center;
            gap: 8px;
            min-height: 74px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(114, 136, 152, 0.28);
            border-radius: 8px;
            background: rgba(19, 29, 36, 0.6);
            overflow: hidden;
            transition: background-color .14s ease, transform .14s ease, filter .14s ease;
        }

        .rating-row::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--row-banner, none);
            background-size: cover;
            background-position: center;
            opacity: var(--row-banner-opacity, 0);
            z-index: 0;
            transition: opacity .16s ease;
        }

        .rating-row::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(12, 20, 26, 0.76), rgba(15, 24, 32, 0.62));
            z-index: 1;
        }

        .rating-row:hover {
            background: rgba(26, 40, 49, 0.72);
            transform: translateX(2px);
            filter: brightness(1.06);
        }

        .rating-row:hover::before {
            opacity: var(--row-banner-hover-opacity, 0);
        }

        .place,
        .user-block,
        .user-exp,
        .user-solved {
            position: relative;
            z-index: 2;
        }
        
        .place {
            font-size: 22px;
            font-weight: 700;
            color: #8cdccc;
            text-align: left;
            padding-left: 2px;
        }
        
        .user-block {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
            min-width: 0;
        }
        
        .ava {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            border: 0;
            background: rgba(15, 118, 110, 0.15);
        }
        
        .ava.default {
            background: rgba(15, 118, 110, 0.2);
            color: #e6f0f8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 20px;
        }

        .user-text {
            min-width: 0;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-name a {
            color: #e6f1fa;
            text-decoration: none;
        }

        .user-name a:hover {
            color: #9fe8d9;
        }

        
        .user-rank {
            font-size: 14px;
            color: #a9bfce;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .user-exp,
        .user-solved {
            text-align: right;
            font-size: 15px;
            color: #d2e0ec;
            font-weight: 600;
        }

        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }

            .rating-grid-head {
                display: none;
            }

            .rating-row {
                grid-template-columns: 42px minmax(0, 1fr);
                gap: 8px 10px;
                min-height: 92px;
            }

            .user-exp {
                grid-column: 2;
                justify-self: start;
                text-align: left;
                font-size: 13px;
            }

            .user-solved {
                grid-column: 2;
                justify-self: end;
                text-align: right;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">CodeBug</div>
        <nav id="nav-links"></nav>
    </header>

    <div class="rating-container">
        <div class="rating-head">
            <div class="rating-badge">Топ CodeBug</div>
            <h1>Рейтинг пользователей</h1>
            <p class="rating-sub">Чем больше исправленных багов, тем выше ты поднимаешься в таблице.</p>
        </div>
        <div class="rating-grid-head">
            <div>#</div>
            <div>Пользователь</div>
            <div style="text-align:right;">EXP</div>
            <div style="text-align:right;">Решено</div>
        </div>
        <div id="rating-list" class="rating-list"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="firebase.js"></script>
    <!-- обязательно первой! -->
    <script src="auth.js?v=20260528-3"></script>
    <!-- использует db -->
    <script src="globalsubmissions.js"></script>
    <!-- использует db -->
    <script src="submit.js"></script>
    <script>
        updateNavbar();

        /* ======================
              РАНГИ
        ====================== */
        function getRank(exp) {
            if (exp < 10) return "Новичок";
            if (exp < 50) return "Мистер WA1";
            if (exp < 100) return "Знает как отлавливать CE";
            if (exp < 200) return "Бывалый";
            if (exp < 300) return "Найдет ошибку в тени";
            if (exp < 500) return "Повелитель RE";
            if (exp < 800) return "Охотник за TL";
            if (exp < 1200) return "Оптимизатор ML";
            if (exp < 2000) return "Code Wizard";
            return "Легенда CodeBug";
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        const RATING_COVER_PRESETS = {
            cover_1: "linear-gradient(120deg,#84fab0 0%,#8fd3f4 100%)",
            cover_2: "linear-gradient(120deg,#a18cd1 0%,#fbc2eb 100%)",
            cover_3: "linear-gradient(120deg,#1e3c72 0%,#2a5298 100%)",
            cover_4: "linear-gradient(120deg,#f6d365 0%,#fda085 100%)",
            cover_5: "linear-gradient(120deg,#0f2027 0%,#203a43 50%,#2c5364 100%)",
            cover_6: "linear-gradient(120deg,#ff9a9e 0%,#fad0c4 100%)",
            cover_7: "linear-gradient(120deg,#43cea2 0%,#185a9d 100%)",
            cover_8: "linear-gradient(120deg,#667eea 0%,#764ba2 100%)",
            cover_9: "linear-gradient(120deg,#00c6ff 0%,#0072ff 30%,#6a11cb 70%,#2575fc 100%)",
            cover_10: "linear-gradient(120deg,#134e5e 0%,#71b280 100%)"
        };

        function getRowBanner(style, level) {
            const profileStyle = (style && typeof style === "object") ? style : {};
            const custom = String(profileStyle.customCover || "").trim();
            const canUseCustom = level !== "free";
            if (canUseCustom && /^data:image\//i.test(custom)) return `url("${custom}")`;
            const coverIdRaw = String(profileStyle.coverId || "").trim().toLowerCase();
            if (!coverIdRaw) return "";
            return RATING_COVER_PRESETS[coverIdRaw] || "";
        }

        /* ======================
              ЗАГРУЗКА РЕЙТИНГА
        ====================== */
        async function loadRating() {
            const snap = await firebase.database().ref("users").get();
            if (!snap.exists()) return;

            const list = document.getElementById("rating-list");
            const users = snap.val();

            let arr = [];

            for (let login in users) {
                let u = users[login];
                let st = u.stats || {};

                arr.push({
                    login,
                    avatar: u.avatar || null,
                    exp: st.exp || 0,
                    solvedCount: Number(st.cnt || 0),
                    solved: st.solved || {}, // объект решённых
                    subscription: u.subscription || null,
                    profileStyle: u.profileStyle || null
                });
            }

            // сортировка по опыту
            arr.sort((a, b) => b.exp - a.exp);

            arr.forEach((u, index) => {
                const profileUrl = `profile.html?user=${encodeURIComponent(u.login)}`;
                const safeLogin = escapeHtml(u.login);
                const sub = u.subscription || {};
                const level = (typeof getSubscriptionLevel === "function") ? getSubscriptionLevel(sub) : "free";
                const isPro = level !== "free";
                const proColor = (isPro && typeof getSubscriptionNickColor === "function") ? getSubscriptionNickColor(sub) : "#60a5fa";
                const loginColor = isPro ? proColor : (typeof getRankNickColorByExp === "function" ? getRankNickColorByExp(Number(u.exp || 0)) : "#27ae60");
                const styledNick = (typeof buildStyledNickHtml === "function")
                    ? buildStyledNickHtml(u.login, sub, loginColor)
                    : safeLogin;
                const avatarUrl = typeof u.avatar === "string" ? u.avatar.trim() : "";
                const avatarSafe = /^https?:\/\//i.test(avatarUrl) || avatarUrl.startsWith("/") || /^data:image\//i.test(avatarUrl) ? avatarUrl : "";
                let avatarHTML = avatarSafe ?
                    `<a href="${profileUrl}"><img class="ava" src="${escapeHtml(avatarSafe)}" alt="avatar" loading="lazy"></a>` :
                    `<a href="${profileUrl}" style="text-decoration:none;"><div class="ava default">${safeLogin[0].toUpperCase()}</div></a>`;

                let solvedCnt = Number.isFinite(u.solvedCount) ? u.solvedCount : 0;
                if (!solvedCnt) solvedCnt = Object.keys(u.solved || {}).length;
                const rowBanner = getRowBanner(u.profileStyle, level);
                const hasBanner = !!rowBanner;

                let row = document.createElement("div");
                row.className = "rating-row";
                row.style.setProperty("--row-banner", hasBanner ? rowBanner : "none");
                row.style.setProperty("--row-banner-opacity", hasBanner ? "0.28" : "0");
                row.style.setProperty("--row-banner-hover-opacity", hasBanner ? "0.35" : "0");
                row.style.cursor = "pointer";
                row.addEventListener("click", () => {
                    window.location.href = profileUrl;
                });

                row.innerHTML = `
            <div class="place">${index + 1}</div>

            <div class="user-block">
                ${avatarHTML}
                <div class="user-text">
                    <div class="user-name"><a href="${profileUrl}" style="text-decoration:none;">${styledNick}</a>${isPro ? ` <span style="color:#bfdbfe;font-size:11px;font-weight:700;border:1px solid rgba(96,165,250,.5);border-radius:999px;padding:2px 6px;">${level === "pro_plus" ? "PRO+" : "PRO"}</span>` : ''}</div>
                    <div class="user-rank">${getRank(u.exp)}</div>
                </div>
            </div>

            <div class="user-exp">${u.exp} EXP</div>
            <div class="user-solved">${solvedCnt} задач</div>
        `;

                list.appendChild(row);
            });
        }

        loadRating();
    </script>

</body>

</html>
