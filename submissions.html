<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set these pages actually load; 'unsafe-inline' is
      required because the page logic lives in inline <script> blocks, so the value
      of this policy is that it pins WHICH hosts may serve scripts and WHERE data
      may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag.
      Clickjacking protection for this static site needs an HTTP header at the CDN.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBug — Глобальные посылки</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">

    <style>
        :root {
            --bg: #050505;
            --bg-strong: #0B0B0B;
            --ink: #FFFFFF;
            --muted: #B0B0B0;
            --accent: #F59E0B;
            --accent-strong: #FBBF24;
            --warm: #F59E0B;
            --card: #121212;
            --stroke: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        
        body {
            margin: 0;
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
        }
        
        * {
            box-sizing: border-box;
        }

        ::selection {
            background: rgba(245, 158, 11, 0.2);
        }

        header {
            height: 72px;
            background: rgba(5, 5, 5, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 4vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: none;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.4px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        nav a {
            color: var(--muted);
            margin-left: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        
        nav a:hover {
            color: var(--accent);
        }
        
        .page {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        h1 {
            color: var(--ink);
            font-size: 30px;
            margin-bottom: 10px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        
        .subtitle {
            color: var(--muted);
            margin-bottom: 25px;
        }
        
        .filters {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }
        
        select,
        input {
            padding: 8px 10px;
            background: #fff;
            border: 1px solid var(--stroke);
            border-radius: 12px;
            color: var(--ink);
            font-size: 14px;
            width: 100%;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        th {
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            font-size: 13px;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
        }
        
        tr:hover {
            background: rgba(245, 158, 11, 0.06);
        }
        
        .empty {
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }
        
        .task-card {
            padding: 6px 10px;
            background: rgba(245, 158, 11, 0.08);
            border-radius: 10px;
            font-size: 14px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .verdict-ok {
            color: #22C55E;
            font-weight: 700;
        }
        
        .verdict-wa {
            color: #EF4444;
            font-weight: 700;
        }
        
        .verdict-re {
            color: #EF4444;
            font-weight: 700;
        }
        
        .verdict-tl {
            color: #EF4444;
            font-weight: 700;
        }

        .verdict-queue {
            color: #B0B0B0;
            font-weight: 700;
        }

        @media (max-width: 740px) {
            .filters {
                flex-direction: column;
            }
        }

        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="theme-dark.css">
</head>

<body>

    <header>
        <div class="logo">CodeBug</div>
        <nav id="nav-links"></nav>
    </header>

    <div class="page">

        <h1>Глобальные посылки</h1>

        <!-- FILTERS -->
        <div class="filters">
            <input id="filterUser" type="text" placeholder="Пользователь…">
            <input id="filterTask" type="text" placeholder="Название задачи…">
            <select id="filterVerdict">
            <option value="">Любой вердикт</option>
            <option value="OK">OK</option>
            <option value="WA">WA</option>
            <option value="RE">RE</option>
            <option value="TL">TL</option>
            <option value="QUEUE">В очереди</option>
            <option value="TESTING">Тестируется</option>
        </select>
        </div>

        <!-- TABLE -->
        <table>
            <thead>
                <tr>
                    <th>Пользователь</th>
                    <th>Задача</th>
                    <th>Вердикт</th>
                    <th>Время</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td colspan="4" class="empty">Загрузка...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>

    <script src="firebase.js?v=20260521-3"></script>
    <script src="auth.js?v=20260907-auth-privacy"></script>

    <script>
        // ===== КЭШ ДЛЯ НАЗВАНИЙ ЗАДАЧ =====
        const titleCache = {};

        async function getTaskTitle(id) {
            const key = String(id ?? "");
            if (titleCache[key]) return titleCache[key];

            try {
                const base = window.getTasksApiBase ? window.getTasksApiBase() : (window.TASKS_API_BASE || "https://codebug.onrender.com");
                const res = await fetch(`${base}/tasks/${key}/meta.json`);
                if (!res.ok) throw new Error(`meta_${res.status}`);
                const meta = await res.json();
                const title = meta?.title || ("Задача " + key);
                titleCache[key] = title;
                return title;
            } catch {
                const fallback = "Задача " + key;
                titleCache[key] = fallback;
                return fallback;
            }
        }

        async function preloadTaskTitles(subs) {
            const uniqueTaskIds = [...new Set(
                subs
                .filter(s => s && typeof s === "object")
                .map(s => s.task)
                .filter(taskId => taskId !== undefined && taskId !== null && taskId !== "")
            )];

            await Promise.all(uniqueTaskIds.map(id => getTaskTitle(id)));
        }

        // ===== ГЛОБАЛЬНЫЕ ПОСЫЛКИ =====

        let submissions = []; // оригинал
        let rendered = []; // отфильтрованное
        const userSubCache = {};
        const userExpCache = {};

        function getSubmissionLogin(submission) {
            return submission.login || submission.user || "anonymous";
        }

        function getSubmissionVerdict(submission) {
            return submission.verdict || submission.status || "ERROR";
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function profileLink(login) {
            const safeLogin = escapeHtml(login);
            const sub = userSubCache[String(login)] || {};
            const exp = Number(userExpCache[String(login)] || 0);
            const level = (typeof getSubscriptionLevel === "function") ? getSubscriptionLevel(sub) : "free";
            const isPro = level !== "free";
            const color = isPro && typeof getSubscriptionNickColor === "function"
                ? getSubscriptionNickColor(sub)
                : (typeof getRankNickColorByExp === "function" ? getRankNickColorByExp(exp) : "#FFFFFF");
            const nickHtml = (typeof buildStyledNickHtml === "function")
                ? buildStyledNickHtml(login, sub, color)
                : safeLogin;
            const badge = isPro ? ` <span style="color:#FBBF24;font-size:11px;font-weight:700;border:1px solid rgba(245,158,11,.45);border-radius:999px;padding:2px 6px;">${level === "pro_plus" ? "PRO+" : "PRO"}</span>` : "";
            return `<a href="profile.html?user=${encodeURIComponent(login)}" style="font-weight:700;text-decoration:none;">${nickHtml}</a>${badge}`;
        }

        async function loadGlobalSubmissions() {
            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "<tr><td colspan='4' class='empty'>Загрузка...</td></tr>";
            try {
                const snap = await firebase.database().ref("submissions/global").get();

                if (!snap.exists()) {
                    tbody.innerHTML = "<tr><td colspan='4' class='empty'>Пока нет посылок</td></tr>";
                    return;
                }

                submissions = Object.values(snap.val()).filter(s => s && typeof s === "object");
                const usersSnap = await firebase.database().ref("ratingLeaderboard").get();
                if (usersSnap.exists()) {
                    const usersData = usersSnap.val() || {};
                    for (const [login, data] of Object.entries(usersData)) {
                        userSubCache[String(login)] = (data && data.subscription) || {};
                        userExpCache[String(login)] = Number(data?.exp || 0);
                    }
                }

                // Сортировка по дате (сначала новые)
                submissions.sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));

                // Важно: грузим названия задач параллельно, иначе рендер может зависать.
                await preloadTaskTitles(submissions);
                await render();
            } catch (err) {
                console.error("[submissions] load error:", err);
                tbody.innerHTML = "<tr><td colspan='4' class='empty'>Ошибка загрузки посылок</td></tr>";
            }
        }


        // ===== РЕНДЕР С УЧЁТОМ ФИЛЬТРОВ =====

        async function render() {
            const tbody = document.getElementById("tbody");

            const userF = document.getElementById("filterUser").value.toLowerCase();
            const taskF = document.getElementById("filterTask").value.toLowerCase();
            const verdictF = document.getElementById("filterVerdict").value;

            tbody.innerHTML = "";

            rendered = [];

            for (let s of submissions) {
                if (!s || typeof s !== "object") continue;

                const taskId = s.task ?? "—";
                const title = titleCache[String(taskId)] || ("Задача " + taskId);

                // Проверяем фильтры
                const login = getSubmissionLogin(s);
                const verdict = getSubmissionVerdict(s);

                if (userF && !login.toLowerCase().includes(userF)) continue;
                if (taskF && !title.toLowerCase().includes(taskF)) continue;
                if (verdictF && verdictF !== verdict) continue;

                rendered.push({...s,
                    taskId,
                    title,
                    login,
                    verdict
                });
            }

            if (rendered.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4' class='empty'>Ничего не найдено…</td></tr>";
                return;
            }

            for (let s of rendered) {
                const tr = document.createElement("tr");
                const verdict = s.verdict || "ERROR";

                const cls =
                    verdict === "OK" ? "verdict-ok" :
                    verdict === "WA" ? "verdict-wa" :
                    verdict === "RE" ? "verdict-re" :
                    verdict === "QUEUE" ? "verdict-queue" :
                    verdict === "TESTING" ? "verdict-queue" :
                    verdict === "ERROR" ? "verdict-re" :
                    "verdict-tl";

                const verdictLabel =
                    verdict === "QUEUE" ? "В очереди" :
                    verdict === "TESTING" ? "Тестируется" :
                    verdict === "ERROR" ? "Ошибка" :
                    verdict;

                tr.innerHTML = `
            <td>${profileLink(s.login)}</td>

            <td>
                <a href="problem.html?id=${encodeURIComponent(s.taskId)}" style="text-decoration:none;color:var(--ink);">
                    <div class="task-card">${escapeHtml(s.title)}</div>
                </a>
            </td>

            <td class="${cls}">${escapeHtml(verdictLabel)}</td>

            <td>${s.date ? new Date(s.date).toLocaleString() : "—"}</td>
        `;

                tbody.appendChild(tr);
            }
        }


        // ===== ФИЛЬТРЫ =====

        document.getElementById("filterUser").oninput = render;
        document.getElementById("filterTask").oninput = render;
        document.getElementById("filterVerdict").onchange = render;

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", loadGlobalSubmissions);
        } else {
            loadGlobalSubmissions();
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", updateNavbar);
    </script>
</body>

</html>
