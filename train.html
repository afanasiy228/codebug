<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>CodeBug — Тренировка</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f7f1e7;
            --bg-strong: #f0e6d8;
            --ink: #1a1612;
            --muted: #5f5b54;
            --accent: #0f766e;
            --accent-strong: #0b5f59;
            --warm: #f3b562;
            --card: #fffaf2;
            --stroke: #e2d6c4;
            --shadow: 0 20px 60px rgba(26, 22, 18, 0.12);
            --radius-lg: 22px;
            --radius-md: 16px;
        }
        
        body {
            margin: 0;
            color: var(--ink);
            font-family: "IBM Plex Sans", sans-serif;
            background:
                radial-gradient(1200px 500px at 10% -10%, rgba(15, 118, 110, 0.18), transparent 60%),
                radial-gradient(900px 500px at 90% 0%, rgba(243, 181, 98, 0.25), transparent 60%),
                linear-gradient(180deg, var(--bg), var(--bg-strong));
        }

        ::selection {
            background: rgba(15, 118, 110, 0.2);
        }
        
        * {
            box-sizing: border-box;
        }

        .container {
            width: min(1200px, 92vw);
            margin: 0 auto;
        }

        header {
            height: 72px;
            background: rgba(255, 250, 242, 0.8);
            border-bottom: 1px solid rgba(226, 214, 196, 0.6);
            padding: 0 4vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 30px rgba(26, 22, 18, 0.08);
        }
        
        .logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            color: var(--ink);
        }
        
        nav a {
            color: var(--muted);
            margin-left: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        
        nav a:hover {
            color: var(--accent);
        }
        
        .page {
            margin: 40px auto 80px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
        }
        /* SIDEBAR */
        
        .filters {
            background: var(--card);
            border: 1px solid var(--stroke);
            padding: 22px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            position: sticky;
            top: 92px;
            align-self: start;
        }

        .filters::after {
            content: "";
            position: absolute;
            inset: -30px -30px auto auto;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(243, 181, 98, 0.35), transparent 70%);
            pointer-events: none;
        }
        
        .filters h2 {
            margin: 0;
            color: var(--ink);
            font-size: 22px;
            font-family: "Space Grotesk", sans-serif;
        }
        
        label {
            display: block;
            color: var(--muted);
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .filter-tip {
            display: none;
        }
        /* SELECT */
        
        .select {
            position: relative;
        }
        
        .select select {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            background: #fff;
            border: 1px solid var(--stroke);
            border-radius: 12px;
            color: var(--ink);
            appearance: none;
            cursor: pointer;
            font-weight: 600;
        }
        
        .select::after {
            content: "▾";
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            pointer-events: none;
        }
        
        .select select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2);
        }
        /* SEARCH */
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #fff;
            border: 1px solid var(--stroke);
            border-radius: 12px;
            color: var(--ink);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2);
        }
        /* MAIN */
        
        .page-head {
            margin-bottom: 18px;
        }

        .page-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            background: rgba(15, 118, 110, 0.12);
            margin-bottom: 12px;
        }

        h1 {
            color: var(--ink);
            font-size: 32px;
            margin: 0 0 10px;
            font-family: "Space Grotesk", sans-serif;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 0;
            line-height: 1.6;
        }
        
        .top-row {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .daily-card {
            background: linear-gradient(120deg, rgba(15, 118, 110, 0.16), rgba(243, 181, 98, 0.22));
            border-radius: var(--radius-md);
            border: 1px solid rgba(226, 214, 196, 0.9);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        .daily-main {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .daily-caption {
            font-size: 14px;
            color: var(--accent);
            font-weight: 700;
        }
        
        .daily-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .btn-small {
            background: var(--accent);
            border-radius: 12px;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 12px 28px rgba(15, 118, 110, 0.25);
        }
        
        .btn-small:hover {
            background: var(--accent-strong);
        }
        
        .random-row {
            display: flex;
            justify-content: flex-start;
        }
        
        .btn-random {
            background: #fff;
            border: 1px solid var(--stroke);
            padding: 8px 16px;
            border-radius: 12px;
            color: var(--ink);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 10px 24px rgba(26, 22, 18, 0.08);
        }
        
        .btn-random:hover {
            border-color: var(--accent);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        th {
            background: rgba(226, 214, 196, 0.4);
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--stroke);
            font-size: 14px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        
        td {
            padding: 14px;
            border-bottom: 1px solid rgba(226, 214, 196, 0.7);
            font-size: 14px;
        }
        
        tr:hover {
            background: rgba(15, 118, 110, 0.06);
        }

        tr.solved-row {
            background: rgba(56, 189, 248, 0.08);
        }

        tr.solved-row:hover {
            background: rgba(56, 189, 248, 0.14);
        }
        /* PILL TAGS */
        
        .pill {
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid rgba(226, 214, 196, 0.8);
            font-size: 12px;
            background: #fff;
            color: var(--muted);
            white-space: nowrap;
        }
        
        .link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        
        .link:hover {
            text-decoration: underline;
        }

        .solved-badge {
            display: inline-flex;
            align-items: center;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            color: #0b3a2b;
            background: #9bf3b7;
            border: 1px solid rgba(11, 58, 43, 0.18);
            vertical-align: middle;
        }
        
        .empty {
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: var(--radius-md);
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
        }

        .reveal {
            opacity: 0;
            transform: translateY(18px);
            animation: fadeUp 0.7s ease forwards;
            animation-delay: var(--delay, 0s);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 960px) {
            .page {
                grid-template-columns: 1fr;
            }

            .filters {
                position: static;
            }
        }

        @media (max-width: 640px) {
            header {
                padding: 0 20px;
            }

            .page {
                margin-top: 24px;
            }

            .daily-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
    <link rel="stylesheet" href="theme-dark.css">
</head>

<body>

    <header>
        <div class="logo">CodeBug</div>
        <nav id="nav-links"></nav>
    </header>

    <main class="page container">

        <!-- SIDEBAR -->
        <div class="filters reveal" style="--delay: 0s;">
            <h2>Фильтры</h2>

            <label>Сложность</label>
            <div class="select">
                <select id="difficulty">
                <option value="">Любая</option>
                <option value="tutorial">Учебная</option>
                <option value="easy">Лёгкая</option>
                <option value="casual">Casual</option>
                <option value="normal">Нормальная</option>
                <option value="hard">Сложная</option>
                <option value="insane">Безумная</option>
                <option value="extreme">Экстремальная</option>
                <option value="ultra">Ультра</option>
                <option value="impossible">Невозможная</option>
                <option value="tourist">Турист</option>
            </select>
            </div>

            <label>Тип задачи</label>
            <div class="select">
                <select id="taskType">
                <option value="">Любая</option>
                <option value="standard">Стандартная</option>
                <option value="grader">Grader</option>
                <option value="interactive">Интерактивная</option>
            </select>
            </div>

            <label>Язык</label>
            <div class="select">
                <select id="languageFilter">
                <option value="">Любой</option>
                <option value="cpp">C++</option>
                <option value="python">Python</option>
            </select>
            </div>

            <label>Поиск</label>
            <input type="text" id="search">
        </div>

        <!-- MAIN -->
        <main>
            <div class="page-head reveal" style="--delay: 0.05s;">
                <div class="page-badge">Тренировочный режим</div>
                <h1>Тренировка</h1>
                <div class="subtitle">Выбери задачу. Найди баг. Исправь код.</div>
            </div>

            <div class="top-row">
                <!-- Задача дня -->
                <div class="daily-card reveal" id="daily-card" style="--delay: 0.1s;">
                    <div class="daily-main">
                        <div class="daily-caption">🔥 Задача дня</div>
                        <div class="daily-title" id="daily-title">Загружаю…</div>
                    </div>
                    <button class="btn-small" onclick="openDaily()">Открыть</button>
                </div>

                <!-- Рандомная задача -->
                <div class="random-row reveal" style="--delay: 0.14s;">
                    <button class="btn-random" onclick="openRandom()">🎲 Случайная задача</button>
                </div>
            </div>

            <table class="reveal" style="--delay: 0.18s;">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Сложность</th>
                        <th>Язык</th>
                        <th>Тип задачи</th>
                        <th>Теги</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>

            <div id="empty" class="empty" style="display:none;">Задачи не найдены…</div>
        </main>

    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase.js"></script>
    <script src="auth.js"></script>

    <script>
        // ============================
        // ЗАГРУЗКА ЗАДАЧ ИЗ API
        // ============================

        async function loadProblems() {
            console.log("[training] loadProblems() start");
            const base = window.TASKS_API_BASE || "";
            try {
                const res = await fetch(`${base}/tasks/list`);
                if (!res.ok) {
                    console.log("[training] fetch list failed, status =", res.status);
                    return [];
                }
                const list = await res.json();
                console.log("[training] total problems loaded:", list.length);
                return list.map(meta => ({
                    id: typeof meta.id === "number" ? meta.id : Number(meta.id),
                    title: meta.title || ("Задача " + meta.id),
                    difficulty: meta.difficulty || "",
                    language: (meta.language || "cpp"),
                    taskType: meta.taskType || "standard",
                    tags: meta.tags || []
                }));
            } catch (e) {
                console.log("[training] fetch/meta error", e);
                return [];
            }
        }

        async function loadHiddenMap() {
            try {
                const snap = await db.ref("tasksHidden").get();
                return snap.exists() ? snap.val() : {};
            } catch (err) {
                console.warn("[training] hidden map load failed", err);
                return {};
            }
        }

        let problems = [];
        let visibleProblems = [];
        let hiddenMap = {};
        let isAdmin = false;
        let dailyProblem = null;
        let solvedMap = {};

        async function loadSolvedMap() {
            const user = getUser();
            if (!user) return {};
            const dbRef = window.db || null;
            if (!dbRef) return {};
            try {
                const snap = await dbRef.ref("users/" + user + "/stats/solved").get();
                return snap.exists() ? (snap.val() || {}) : {};
            } catch (err) {
                console.warn("[training] solved map load failed", err);
                return {};
            }
        }

        async function initTraining() {
            console.log("[training] initTraining()");

            problems = await loadProblems();
            hiddenMap = await loadHiddenMap();
            isAdmin = await checkAdminAccess();
            solvedMap = await loadSolvedMap();
            visibleProblems = problems.filter(p => !hiddenMap[p.id]);

            if (visibleProblems.length === 0) {
                document.getElementById("daily-title").innerText = "Задачи не найдены";
                document.getElementById("daily-card").style.opacity = "0.6";
            } else {
                // задача дня — детерминированно по дате
                const today = new Date();
                const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
                const idx = seed % visibleProblems.length;
                dailyProblem = visibleProblems[idx];

                document.getElementById("daily-title").innerText = dailyProblem.title;
            }

            renderTable();
        }

        // ============================
        // РЕНДЕР ТАБЛИЦЫ
        // ============================

        function diffPill(diff) {
            const map = {
                tutorial: "background:#9aa3ad; color:#111318;",
                easy: "background:#8fe7a1; color:#0b2314;",
                casual: "background:#45d1c2; color:#052b26;",
                normal: "background:#4d7cff; color:#0b1329;",
                hard: "background:#8b5cf6; color:#1a0c2f;",
                insane: "background:#ffb66d; color:#2a1600;",
                extreme: "background:#ff8a3d; color:#2a1200;",
                ultra: "background:#ff8585; color:#2a0b0b;",
                impossible: "background:#ff4d4d; color:#2a0606;",
                tourist: "background:#b8141b; color:#2b0506;"
            };
            let text = diff;
            if (diff === "tutorial") text = "Учебная";
            else if (diff === "easy") text = "Лёгкая";
            else if (diff === "casual") text = "Casual";
            else if (diff === "normal") text = "Нормальная";
            else if (diff === "hard") text = "Сложная";
            else if (diff === "insane") text = "Безумная";
            else if (diff === "extreme") text = "Экстремальная";
            else if (diff === "ultra") text = "Ультра";
            else if (diff === "impossible") text = "Невозможная";
            else if (diff === "tourist") text = "Турист";

            return `<span class="pill" style="${map[diff] || ""}">${text || "-"}</span>`;
        }

        function taskTypePill(taskType) {
            const t = (taskType || "standard").toLowerCase();
            if (t === "interactive") {
                return `<span class="pill" style="background:#4b2d71; color:#f0dcff;">Интерактивная</span>`;
            }
            if (t === "grader") {
                return `<span class="pill" style="background:#2d4f71; color:#d8efff;">Grader</span>`;
            }
            return `<span class="pill" style="background:#284d39; color:#d9ffea;">Стандартная</span>`;
        }

        function languagePill(language) {
            const lang = (language || "cpp").toLowerCase();
            if (lang === "python") {
                return `<span class="pill" style="background:#284d39; color:#c9ffd9;">Python</span>`;
            }
            return `<span class="pill" style="background:#3a2d5a; color:#e7dcff;">C++</span>`;
        }

        function normalizeTag(tag) {
            const t = String(tag || "").trim();
            const key = t.toLowerCase().replace(/[_-]+/g, " ").replace(/\s+/g, " ");
            const map = {
                "prefix sums": "префиксные суммы",
                "two pointers": "два указателя",
                "binary search": "бинарный поиск",
                "bruteforce": "перебор",
                "brute force": "перебор",
                "dynamic programming": "динамика",
                "dp": "динамика",
                "graphs": "графы",
                "graph": "графы",
                "strings": "строки",
                "string": "строки",
                "arrays": "массивы",
                "array": "массивы",
                "math": "математика",
                "sorting": "сортировка",
                "implementation": "реализация",
                "greedy": "жадность",
                "tree": "деревья",
                "trees": "деревья",
                "dfs": "dfs",
                "bfs": "bfs",
                "dijkstra": "дейкстра",
                "shortest path": "кратчайший путь",
                "prefix sum": "префиксные суммы"
            };
            return map[key] || t;
        }

        function tagsPill(tags) {
            if (!Array.isArray(tags) || !tags.length) return `<span class="pill">—</span>`;
            return tags.map(tag => `<span class="pill">${normalizeTag(tag)}</span>`).join(" ");
        }

        function renderTable() {
            console.log("[training] renderTable()");

            const diff = document.getElementById("difficulty").value;
            const taskType = document.getElementById("taskType").value;
            const lang = document.getElementById("languageFilter").value;
            const query = document.getElementById("search").value.toLowerCase();

            const baseList = isAdmin ? problems : visibleProblems;
            const filtered = baseList.filter(p =>
                (!diff || p.difficulty === diff) &&
                (!taskType || (p.taskType || "standard") === taskType) &&
                (!lang || (p.language || "cpp") === lang) &&
                (!query || p.title.toLowerCase().includes(query))
            );

            const tbody = document.getElementById("tbody");
            const empty = document.getElementById("empty");

            tbody.innerHTML = "";
            empty.style.display = filtered.length ? "none" : "block";

            filtered.forEach(p => {
                const tr = document.createElement("tr");
                const solved = !!solvedMap[String(p.id)] || !!solvedMap[p.id];
                if (solved) tr.classList.add("solved-row");
                const hiddenBadge = isAdmin && hiddenMap[p.id]
                    ? `<span class="pill" style="background:#3b1d1d; color:#ffb3b3;">Скрыта</span>`
                    : "";
                const solvedBadge = solved
                    ? `<span class="solved-badge">Сдано</span>`
                    : "";
                tr.innerHTML = `
                <td><a class="link" href="problem.html?id=${p.id}">${p.title}</a>${solvedBadge} ${hiddenBadge}</td>
                <td>${diffPill(p.difficulty)}</td>
                <td>${languagePill(p.language)}</td>
                <td>${taskTypePill(p.taskType)}</td>
                <td>${tagsPill(p.tags)}</td>
            `;
                tbody.appendChild(tr);
            });
        }

        // ============================
        // КНОПКИ: ЗАДАЧА ДНЯ И РАНДОМ
        // ============================

        function openDaily() {
            console.log("[training] openDaily()");
            if (!dailyProblem) {
                alert("Задача дня пока недоступна");
                return;
            }
            window.location.href = "problem.html?id=" + dailyProblem.id;
        }

        function openRandom() {
            console.log("[training] openRandom()");
            if (!visibleProblems.length) {
                alert("Нет доступных задач");
                return;
            }
            const idx = Math.floor(Math.random() * visibleProblems.length);
            const p = visibleProblems[idx];
            window.location.href = "problem.html?id=" + p.id;
        }

        // ============================
        // СОБЫТИЯ
        // ============================

        document.addEventListener("DOMContentLoaded", () => {
            console.log("[training] DOMContentLoaded");
            // navbar
            if (typeof updateNavbar === "function") {
                updateNavbar();
            } else {
                console.warn("[training] updateNavbar() не найден");
            }

            // фильтры
            document.getElementById("difficulty").addEventListener("change", renderTable);
            document.getElementById("taskType").addEventListener("change", renderTable);
            document.getElementById("languageFilter").addEventListener("change", renderTable);
            document.getElementById("search").addEventListener("input", renderTable);

            // загрузка задач
            initTraining();
        });
    </script>

</body>

</html>
