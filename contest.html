<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set these pages actually load; 'unsafe-inline' is
      required because the page logic lives in inline <script> blocks, so the value
      of this policy is that it pins WHICH hosts may serve scripts and WHERE data
      may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag.
      Clickjacking protection for this static site needs an HTTP header at the CDN.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://codebug-47347-default-rtdb.europe-west1.firebasedatabase.app;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Соревнование — CodeBug</title>
  <link rel="icon" type="image/png" href="/logo.png?v=2">
  <style>
    :root {
      --bg: #050505;
      --bg-strong: #0B0B0B;
      --ink: #FFFFFF;
      --muted: #B0B0B0;
      --accent: #F59E0B;
      --accent-strong: #FBBF24;
      --warm: #F59E0B;
      --card: #121212;
      --stroke: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
        linear-gradient(180deg, var(--bg), var(--bg-strong));
      min-height: 100vh;
    }

    header {
      height: 72px;
      background: rgba(5, 5, 5, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
      box-shadow: none;
    }

    .logo {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--ink);
    }

    nav a {
      margin-left: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--accent);
    }

    .container {
      width: min(1100px, 92vw);
      margin: 40px auto 80px;
    }

    .contest-hero {
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: grid;
      gap: 10px;
    }

    .contest-title {
      font-size: 30px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
    }

    .contest-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .profile-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .profile-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      width: fit-content;
    }

    .contest-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 14px 32px rgba(245, 158, 11, 0.25);
    }

    button.secondary {
      background: rgba(245, 158, 11, 0.12);
      color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: var(--card);
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
    }

    .tab-btn.active {
      color: var(--accent);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.12);
    }

    .panel {
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .tasks-grid {
      display: grid;
      gap: 12px;
    }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--stroke);
      background: rgba(245, 158, 11, 0.06);
    }

    .task-title {
      font-weight: 600;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .table th {
      background: rgba(255, 255, 255, 0.08);
    }

    .empty {
      color: var(--muted);
    }
  </style>
  <link rel="stylesheet" href="theme-dark.css">
</head>

<body>
  <header>
    <div class="logo">CodeBug</div>
    <nav id="nav-links"></nav>
  </header>

  <main class="container">
    <section class="contest-hero">
      <div class="badge" id="contestStatus">Статус</div>
      <h1 class="contest-title" id="contestTitle">Загрузка...</h1>
      <div class="contest-meta">
        <span id="contestStart">Старт: —</span>
        <span id="contestEnd">Финиш: —</span>
        <span id="contestAuthors">Авторы: —</span>
        <span id="contestRewards" style="display:none;"></span>
      </div>
      <div class="contest-actions">
        <button id="registerBtn" onclick="registerForContest()">Зарегистрироваться</button>
        <button class="secondary" onclick="goToContests()">Все соревнования</button>
      </div>
      <div class="contest-meta" id="contestHint"></div>
    </section>

    <div class="tabs">
      <button class="tab-btn active" id="tasksTabBtn" onclick="openTab('tasks')">Задачи</button>
      <button class="tab-btn" id="tableTabBtn" onclick="openTab('table')">Таблица</button>
    </div>

    <section id="tasksPanel" class="panel">
      <div id="tasksList" class="tasks-grid"></div>
      <div id="tasksEmpty" class="empty" style="display:none;">Задачи будут доступны после старта.</div>
    </section>

    <section id="tablePanel" class="panel" style="display:none;">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Пользователь</th>
            <th>Решено</th>
            <th>Штраф</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
      <div id="standingsEmpty" class="empty" style="display:none;">Нет зарегистрированных участников.</div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  <script src="firebase.js?v=20260521-3"></script>
  <script src="auth.js?v=20260907-auth-privacy"></script>

  <script>
    updateNavbar();

    const user = getUser();
    const url = new URL(location.href);
    const contestId = url.searchParams.get("id");

    let contestData = null;
    let isRegistered = false;
    let contestStatus = "upcoming";

    function formatUtc(ts) {
      if (!ts) return "—";
      return new Date(ts).toISOString().replace("T", " ").replace(".000Z", " UTC");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    const contestUserSubCache = {};
    const contestUserExpCache = {};

    function profileLink(login) {
      const safeLogin = escapeHtml(login);
      const sub = contestUserSubCache[String(login)] || {};
      const exp = Number(contestUserExpCache[String(login)] || 0);
      const level = (typeof getSubscriptionLevel === "function") ? getSubscriptionLevel(sub) : "free";
      const isPro = level !== "free";
      const badgeText = level === "pro_plus" ? "PRO+" : "PRO";
      const badge = isPro ? ` <span style="color:#FBBF24;font-size:11px;font-weight:700;border:1px solid rgba(245,158,11,.45);border-radius:999px;padding:1px 6px;">${badgeText}</span>` : "";
      const color = isPro && typeof getSubscriptionNickColor === "function"
        ? getSubscriptionNickColor(sub)
        : (typeof getRankNickColorByExp === "function" ? getRankNickColorByExp(exp) : "#FFFFFF");
      const nickHtml = (typeof buildStyledNickHtml === "function")
        ? buildStyledNickHtml(login, sub, color)
        : safeLogin;
      return `<a class="profile-link" href="profile.html?user=${encodeURIComponent(login)}">${nickHtml}</a>${badge}`;
    }

    function renderAuthorLinks(authors) {
      return (authors || []).map(profileLink).join(", ") || "—";
    }

    function getStatus(start, end) {
      const now = Date.now();
      if (now < start) return "upcoming";
      if (now >= start && now <= end) return "ongoing";
      return "finished";
    }

    function statusLabel(status) {
      if (status === "upcoming") return "Скоро";
      if (status === "ongoing") return "Идет";
      return "Завершен";
    }

    function rewardsLabel(rewards) {
      if (!Array.isArray(rewards) || !rewards.length) return "";
      const items = rewards.slice(0, 3).map((reward) => {
        const place = Number(reward?.place || 0);
        const exp = Number(reward?.exp || 0);
        const sub = reward?.subscription || {};
        const tier = String(sub.tier || "").toLowerCase() === "pro_plus" ? "PRO+" : String(sub.tier || "").toLowerCase() === "pro" ? "PRO" : "";
        const days = Number(sub.days || 0);
        const prize = [exp > 0 ? `${exp} опыта` : "", tier && days > 0 ? `${tier} на ${days} дней` : ""].filter(Boolean).join(" + ");
        return place > 0 && prize ? `${place} место: ${prize}` : "";
      }).filter(Boolean);
      return items.join(" · ");
    }

    function openTab(tab) {
      const tasksPanel = document.getElementById("tasksPanel");
      const tablePanel = document.getElementById("tablePanel");
      document.getElementById("tasksTabBtn").classList.toggle("active", tab === "tasks");
      document.getElementById("tableTabBtn").classList.toggle("active", tab === "table");
      tasksPanel.style.display = tab === "tasks" ? "block" : "none";
      tablePanel.style.display = tab === "table" ? "block" : "none";
    }

    function goToContests() {
      window.location.href = "contests.html";
    }

    async function registerForContest() {
      if (!user) {
        alert("Войдите, чтобы зарегистрироваться.");
        window.location.href = "auth.html";
        return;
      }
      const base = window.getTasksApiBase ? window.getTasksApiBase() : (window.TASKS_API_BASE || "https://codebug.onrender.com");
      const auth = typeof getAuth === "function" ? getAuth() : null;
      const token = auth?.currentUser ? await auth.currentUser.getIdToken() : "";
      // Fail closed: without a token this is an unauthenticated call to a
      // privileged endpoint, which the server rejects with an opaque 401.
      if (!token) throw new Error("Не удалось получить токен авторизации. Войдите заново.");
      const res = await fetch(`${base}/contest/register`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {})
        },
        body: JSON.stringify({ contestId })
      });
      if (!res.ok) {
        const payload = await res.json().catch(() => ({}));
        alert(payload.error || "Не удалось зарегистрироваться");
        return;
      }
      isRegistered = true;
      updateRegisterButton();
      renderTasks(contestStatus);
      loadStandings();
    }

    function updateRegisterButton() {
      const btn = document.getElementById("registerBtn");
      btn.textContent = isRegistered ? "Вы зарегистрированы" : "Зарегистрироваться";
      btn.disabled = isRegistered;
    }

    async function loadContest() {
      if (!contestId) {
        document.getElementById("contestTitle").innerText = "Соревнование не найдено";
        return;
      }

      const snap = await db.ref(`contests/${contestId}`).get();
      if (!snap.exists()) {
        document.getElementById("contestTitle").innerText = "Соревнование не найдено";
        return;
      }

      contestData = snap.val();
      const visibility = String(contestData.visibility || "public").toLowerCase();
      const owner = String(contestData.ownerLogin || "").trim();
      const allowed = Array.isArray(contestData.allowedUsers) ? contestData.allowedUsers.map(v => String(v || "").trim()) : [];
      if (visibility === "private" && user !== owner && !allowed.includes(user)) {
        document.getElementById("contestTitle").innerText = "Соревнование недоступно";
        document.getElementById("contestHint").innerText = "Это приватное соревнование.";
        document.getElementById("registerBtn").disabled = true;
        return;
      }
      contestStatus = getStatus(contestData.start, contestData.end);
      document.getElementById("contestStatus").innerText = statusLabel(contestStatus);
      document.getElementById("contestTitle").innerText = contestData.title || "Соревнование";
      document.getElementById("contestStart").innerText = `Старт: ${formatUtc(contestData.start)}`;
      document.getElementById("contestEnd").innerText = `Финиш: ${formatUtc(contestData.end)}`;
      document.getElementById("contestAuthors").innerHTML = `Авторы: ${renderAuthorLinks(contestData.authors)}`;
      const rewards = document.getElementById("contestRewards");
      const rewardsText = rewardsLabel(contestData.rewards);
      if (rewards) {
        rewards.textContent = rewardsText ? `Призы: ${rewardsText}` : "";
        rewards.style.display = rewardsText ? "inline" : "none";
      }

      const hint = document.getElementById("contestHint");
      if (contestStatus === "upcoming") {
        hint.textContent = "Соревнование еще не началось. Задачи появятся в момент старта.";
      } else if (contestStatus === "finished") {
        hint.textContent = "Соревнование завершено. Дорешивание доступно.";
      } else {
        hint.textContent = "Соревнование идет прямо сейчас.";
      }

      if (user) {
        const regSnap = await db.ref(`contest_regs/${contestId}/${user}`).get();
        isRegistered = regSnap.exists();
      }
      updateRegisterButton();

      renderTasks(contestStatus);
      loadStandings();
    }

    async function renderTasks(status) {
      const tasksList = document.getElementById("tasksList");
      const tasksEmpty = document.getElementById("tasksEmpty");
      tasksList.innerHTML = "";

      if (!contestData || !Array.isArray(contestData.tasks) || !contestData.tasks.length) {
        tasksEmpty.textContent = "Задачи появятся позже.";
        tasksEmpty.style.display = "block";
        return;
      }

      if (status === "upcoming") {
        tasksEmpty.textContent = "Задачи будут доступны после старта.";
        tasksEmpty.style.display = "block";
        return;
      }

      if (!isRegistered) {
        tasksEmpty.textContent = "Зарегистрируйтесь, чтобы открыть задачи.";
        tasksEmpty.style.display = "block";
        return;
      }

      tasksEmpty.style.display = "none";

      for (const taskId of contestData.tasks) {
        let title = `Задача #${taskId}`;
        try {
          const base = window.getTasksApiBase ? window.getTasksApiBase() : (window.TASKS_API_BASE || "https://codebug.onrender.com");
          const res = await fetch(`${base}/tasks/${taskId}/meta.json`);
          const meta = await res.json();
          title = meta.title || title;
        } catch (e) {}

        const row = document.createElement("div");
        row.className = "task-row";
        row.innerHTML = `
          <div class="task-title">${escapeHtml(title)}</div>
          <button type="button" class="open-task-btn">Открыть</button>
        `;
        row.querySelector(".open-task-btn")?.addEventListener("click", () => openTask(taskId));
        tasksList.appendChild(row);
      }
    }

    function openTask(taskId) {
      window.location.href = `problem.html?id=${taskId}&contest=${contestId}`;
    }

    function calcPenalty(attempts) {
      let solved = 0;
      let penalty = 0;
      attempts.forEach(item => {
        if (item.okTime === null) return;
        solved += 1;
        penalty += item.okTime + item.wrongCount * 20;
      });
      return { solved, penalty };
    }

    async function loadStandings() {
      const body = document.getElementById("standingsBody");
      const empty = document.getElementById("standingsEmpty");
      body.innerHTML = "";

      if (!contestData) return;

      const regsSnap = await db.ref(`contest_regs/${contestId}`).get();
      if (!regsSnap.exists()) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      const regs = regsSnap.val() || {};
      const regUsers = Object.entries(regs).map(([key, value]) => String((value && value.login) || key)).filter(Boolean);
      const usersSnap = await db.ref("publicProfiles").get();
      if (usersSnap.exists()) {
        const usersData = usersSnap.val() || {};
        for (const login of regUsers) {
          contestUserSubCache[String(login)] = (usersData[login] && usersData[login].subscription) || {};
          contestUserExpCache[String(login)] = Number(usersData[login]?.stats?.exp || 0);
        }
      }

      const submissionsSnap = await db.ref("submissions/global").get();
      const subs = submissionsSnap.exists() ? Object.values(submissionsSnap.val()) : [];

      const start = contestData.start;
      const end = contestData.end;
      const tasks = contestData.tasks || [];

      const attemptsByUser = {};
      regUsers.forEach(login => {
        attemptsByUser[login] = {};
        tasks.forEach(taskId => {
          attemptsByUser[login][taskId] = { wrongCount: 0, okTime: null };
        });
      });

      subs.forEach(sub => {
        if (!sub || sub.contestId !== contestId) return;
        if (!regUsers.includes(sub.login)) return;
        if (!tasks.includes(Number(sub.task))) return;
        if (sub.date < start || sub.date > end) return;

        const taskId = Number(sub.task);
        const entry = attemptsByUser[sub.login][taskId];
        if (!entry || entry.okTime !== null) return;

        if (sub.verdict === "OK") {
          entry.okTime = Math.floor((sub.date - start) / 60000);
        } else {
          entry.wrongCount += 1;
        }
      });

      const table = regUsers.map(login => {
        const attempts = Object.values(attemptsByUser[login]);
        const result = calcPenalty(attempts);
        return {
          login,
          solved: result.solved,
          penalty: result.penalty
        };
      });

      table.sort((a, b) => {
        if (b.solved !== a.solved) return b.solved - a.solved;
        return a.penalty - b.penalty;
      });

      table.forEach((row, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td>${profileLink(row.login)}</td>
          <td>${row.solved}</td>
          <td>${row.penalty}</td>
        `;
        body.appendChild(tr);
      });
    }

    loadContest();
  </script>
</body>

</html>
