  <link rel="stylesheet" href="theme-dark.css">
  <style>
    :root {
      --ink: #f4f2ec;
      --text: #d2cfc7;
      --muted: #8d8a82;
      --accent: #F59E0B;
      --green: 34, 197, 94;
      --red: 239, 68, 68;
      --glass: linear-gradient(135deg, rgba(255, 255, 255, 0.105), rgba(255, 255, 255, 0.025) 48%, rgba(245, 158, 11, 0.045));
      --rim: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.07);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      height: 72px;
      background: rgba(5, 5, 5, 0.6);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border-radius: 0;
    }

    .logo { font-size: 20px; font-weight: 700; letter-spacing: 0.4px; color: #fff; }
    nav a { margin-left: 20px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; }
    nav a:hover { color: var(--accent); }

    /* Slow drifting light behind the glass, so the blur has something to refract. */
    .aura { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .aura i {
      position: absolute;
      width: 46vmax;
      height: 46vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.5;
      animation: drift 26s ease-in-out infinite alternate;
    }
    .aura i:nth-child(1) { background: radial-gradient(circle, rgba(245, 158, 11, 0.32), transparent 65%); top: -18vmax; right: -10vmax; }
    .aura i:nth-child(2) { background: radial-gradient(circle, rgba(34, 197, 94, 0.14), transparent 65%); bottom: -22vmax; left: -14vmax; animation-duration: 32s; animation-delay: -9s; }
    .aura i:nth-child(3) { background: radial-gradient(circle, rgba(96, 165, 250, 0.1), transparent 65%); top: 30%; left: 40%; width: 30vmax; height: 30vmax; animation-duration: 38s; animation-delay: -17s; }
    @keyframes drift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-6vmax, 4vmax, 0) scale(1.12); }
      100% { transform: translate3d(5vmax, -3vmax, 0) scale(0.94); }
    }

    .wrap {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 40px clamp(16px, 3vw, 40px) 80px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: clamp(48px, 5vw, 80px);
      align-items: start;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .contest-content { min-width: 0; padding: 8px 0; animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }

    /* Floating tabs above the open standings. */
    .tabs { position: relative; display: inline-flex; border-radius: 15px; padding: 4px; border: 1px solid var(--line); background: rgba(255, 255, 255, .025); margin-bottom: 22px; }
    .tabs .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 11px; background: linear-gradient(145deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .055)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12); transition: transform .35s cubic-bezier(.2, .8, .2, 1), width .35s cubic-bezier(.2, .8, .2, 1); }
    .tabs button.tab {
      position: relative;
      z-index: 1;
      border: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
      color: var(--muted) !important;
      padding: 11px 20px;
      border-radius: 11px;
      font: 600 16px/1.2 system-ui, sans-serif;
      cursor: pointer;
      transition: color .2s;
    }
    .tabs button.tab:hover { color: var(--ink) !important; }
    .tabs button.tab.active { color: var(--ink) !important; }
    .tabs button.tab:focus-visible, .task:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .pane { animation: fade .35s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Tasks: letter, name, arrow that lights up. */
    .task {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 12px;
      font-size: 17px;
      margin-top: 5px;
      border: 1px solid transparent;
      border-radius: 13px;
      transition: border-color .25s, background .25s;
      color: var(--ink);
      text-decoration: none;
      overflow: hidden;
      animation: fade .45s ease both;
      animation-delay: calc(var(--i) * 45ms);
    }
    .task:hover { border-color: var(--line); background: rgba(255, 255, 255, .025); }
    .task::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.12), transparent 70%);
      opacity: 0;
      transition: opacity .25s;
    }
    .task:hover::before { opacity: 1; }
    .task .k { position: relative; width: 22px; font: 600 15px var(--mono); color: var(--muted); }
    .task .nm { position: relative; flex: 1; min-width: 0; font-weight: 600; transition: color .2s; }
    .task svg { position: relative; flex: 0 0 18px; width: 18px; height: 18px; color: var(--muted); transition: transform .25s, color .25s; }
    .task:hover .nm { color: #fff; }
    .task:hover svg { color: var(--accent); transform: translateX(5px); }
    .task.solved .k, .task.solved .nm, .task.solved svg { color: #4ade80; }
    .task.solved::before { background: linear-gradient(90deg, rgba(34, 197, 94, 0.12), transparent 70%); }
    .task.solved:hover svg { color: #86efac; }

    .empty-note { color: var(--muted); padding: 10px 2px; background: transparent !important; box-shadow: none !important; }

    .reg-btn {
      justify-self: start;
      padding: 10px 16px;
      border-radius: 12px !important;
      transition: transform .2s ease, filter .2s ease;
      font-weight: 700;
      cursor: pointer;
      border: 0;
    }

    .reg-btn:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.08); }
    .reg-btn:not(:disabled):active { transform: translateY(0); }
    .reg-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* Standings retain compact, equal-sized cells. */
    .tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 5px 4px 8px; }
    table.st {
      border-collapse: separate;
      border-spacing: 8px;
      font-size: 16px;
      width: max-content;
      min-width: 100%;
      background: transparent !important;
      box-shadow: none !important;
    }
    table.st th {
      background: transparent !important;
      border: 0 !important;
      font: 600 13px system-ui, sans-serif;
      color: var(--muted) !important;
      text-align: center;
      padding: 0 2px 8px;
      white-space: nowrap;
    }
    table.st th.l, table.st td.l { text-align: left; }
    table.st td { border: 0 !important; padding: 0; }
    table.st tr:hover { background: transparent !important; }
    table.st tbody tr { animation: fade .4s ease both; animation-delay: calc(var(--i) * 40ms); }
    table.st tbody tr:hover td.user { filter: brightness(1.35); }
    td.place { font: 600 14px var(--mono); color: var(--muted); text-align: center; width: 22px; }
    td.user {
      border-radius: 11px;
      white-space: nowrap;
      padding: 0 18px 0 14px !important;
      min-width: 160px;
      height: 60px;
      font-weight: 700;
      border-left: 3px solid var(--ucol) !important;
      background-color: #121212;
      background-size: cover;
      background-position: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: filter .2s;
    }
    td.user a { text-decoration: none; }
    td.pen, td.sum { font: 700 16px var(--mono); color: var(--ink); text-align: center; white-space: nowrap; padding: 0 6px !important; }
    td.sq { width: 60px; min-width: 60px; height: 60px; }
    .cell {
      width: 60px;
      height: 60px;
      margin-inline: auto;
      display: grid;
      place-items: center;
      font: 700 16px var(--mono);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 0;
      background: linear-gradient(145deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .01));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), filter .25s, box-shadow .25s;
    }
    .cell.ok { background: linear-gradient(145deg, rgba(var(--green), calc(var(--a) * .65)), rgba(var(--green), calc(var(--a) * .28))); border-color: rgba(var(--green), calc(var(--a) * .45 + .1)); color: #c4fbd6; box-shadow: inset 0 1px 0 rgba(206, 255, 220, .14), 0 4px 14px rgba(var(--green), calc(var(--a) * .1)); }
    .cell.wa { background: linear-gradient(145deg, rgba(var(--red), calc(var(--a) * .65)), rgba(var(--red), calc(var(--a) * .28))); border-color: rgba(var(--red), calc(var(--a) * .45 + .1)); color: #ffe0df; box-shadow: inset 0 1px 0 rgba(255, 220, 220, .12); }
    .cell.ok, .cell.wa { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) backwards; animation-delay: calc(var(--i) * 40ms + 120ms); }
    .cell:hover { transform: translateY(-2px) scale(1.04); filter: brightness(1.18); position: relative; z-index: 1; }
    @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }

    /* Amber rail: right-aligned contest identity, status and personal result. */
    .banner { position: sticky; top: 104px; min-width: 0; padding: 8px 22px 8px 0; border-right: 2px solid var(--accent); display: grid; justify-items: end; text-align: right; gap: 14px; animation: rise .6s .08s ease both; }
    .banner-eyebrow { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 1.8px; text-transform: uppercase; }
    .banner .reg-btn { justify-self: end; max-width: 100%; }
    .banner h1 { margin: 0; font: 750 32px/1.15 system-ui, sans-serif; letter-spacing: -.7px; color: var(--ink); text-wrap: balance; overflow-wrap: anywhere; max-width: 100%; }
    .banner-status { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; color: var(--accent); font-size: 13px; font-weight: 550; }
    .banner-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .banner-status[data-status="upcoming"] { color: var(--muted); }
    .timer { font: 600 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
    .timer.soon { color: var(--accent); }
    .meta { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .meta b { color: var(--ink); font-weight: 600; white-space: nowrap; }
    .banner-metrics { display: flex; justify-content: flex-end; gap: 30px; width: 100%; margin: 8px 0 0; padding-top: 20px; border-top: 1px solid var(--line); }
    .banner-metrics > div { display: flex; flex-direction: column; gap: 2px; }
    .banner-metrics dt { order: 1; font-size: 12px; color: var(--muted); }
    .banner-metrics dd { margin: 0; font: 650 24px/1.3 var(--mono); color: var(--ink); }

    @media (max-width: 1024px) {
      .wrap { grid-template-columns: 1fr; padding-top: 18px; }
      .banner { position: static; order: -1; }
      .wrap { gap: 20px; }
      .banner { padding: 8px 20px 8px 0; gap: 12px; width: min(100%, 300px); justify-self: end; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aura i, .banner, .contest-content, .pane, .task, table.st tbody tr, .cell.ok, .cell.wa { animation: none; }
      .tabs .ind, .tabs button.tab, .task, .task::before, .task .nm, .task svg, .reg-btn, td.user, .cell { transition: none; }
      .cell:hover, .reg-btn:not(:disabled):hover, .task:hover svg { transform: none; }
    }
  </style>

<body class="cb-footer-layout">
  <header class="cb-site-header">
    <div class="logo">CodeBug</div>
    <nav id="nav-links"></nav>
  </header>
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="wrap">
    <main class="contest-content" aria-label="Задачи и таблица">
      <div class="tabs" role="tablist">
        <span class="ind" id="tabInd"></span>
        <button class="tab active" role="tab" id="tasksTabBtn" onclick="openTab('tasks')">Задачи</button>
        <button class="tab" role="tab" id="tableTabBtn" onclick="openTab('table')">Таблица</button>
      </div>

      <section id="tasksPanel" class="pane">
        <div id="tasksList"></div>
        <div id="tasksEmpty" class="empty-note" hidden></div>
      </section>

      <section id="tablePanel" class="pane" hidden>
        <div class="tbl-wrap"><table class="st" id="standings"></table></div>
        <div id="standingsEmpty" class="empty-note" hidden>Нет зарегистрированных участников.</div>
      </section>
    </main>

    <aside class="banner" aria-label="Статус соревнования">
      <div class="banner-eyebrow">Соревнование</div>
      <h1 id="contestTitle">Загрузка…</h1>
      <div class="banner-status" id="contestStatus" hidden>
        <span id="contestStatusLabel"></span><span class="timer" id="timer" hidden></span>
      </div>
      <div class="meta" id="contestWhen" hidden></div>
      <dl class="banner-metrics" id="contestMetrics" hidden>
        <div><dt id="contestTaskLabel">задач</dt><dd id="contestTaskCount">—</dd></div>
        <div><dt>место</dt><dd id="contestPlace" aria-label="Ваше место">—</dd></div>
      </dl>
      <button class="reg-btn" id="registerBtn" onclick="registerForContest()" hidden>Зарегистрироваться</button>
    </aside>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

  <script src="auth.js?v=20261030-1"></script>

  <script>
    updateNavbar();

    const user = getUser();
    const url = new URL(location.href);
    const contestId = url.searchParams.get("id");
    const TASKS_BASE = () => (window.getTasksApiBase ? window.getTasksApiBase() : (window.TASKS_API_BASE || "https://codebug.onrender.com"));
    const PENALTY = 20;

    let contestData = null;
    let isRegistered = false;
    let contestStatus = "upcoming";
    let allSubs = null;
    const taskTitles = {};

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function letter(i) {
      return i < 26 ? String.fromCharCode(65 + i) : `${String.fromCharCode(65 + Math.floor(i / 26) - 1)}${String.fromCharCode(65 + (i % 26))}`;
    }

    function formatMsk(ts) {
      if (!ts) return "—";
      return new Date(ts).toLocaleTimeString("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit" }) + " МСК";
    }

    const contestUserSubCache = {};
    const contestUserExpCache = {};
    const contestUserCoverCache = {};
    const contestProfileRequests = new Map();

    function loadParticipantProfile(login) {
      if (!contestProfileRequests.has(login)) {
        contestProfileRequests.set(login, CodeBugData.profile(login).then(profile => {
          contestUserSubCache[login] = profile.subscription || {};
          contestUserExpCache[login] = Number(profile.stats?.exp || 0);
          contestUserCoverCache[login] = { ...(profile.profileStyle || {}), coverUrl: profile.coverUrl || profile.profileStyle?.coverUrl || "" };
        }).catch(() => {}));
      }
      return contestProfileRequests.get(login);
    }

    // Same preset backgrounds as the profile cover picker.
    const COVER_PRESETS = [
      { id: "cover_1", name: "Amber code", bg: "linear-gradient(120deg,#121212 0%,#F59E0B 100%)" },
      { id: "cover_2", name: "Dark build", bg: "linear-gradient(120deg,#050505 0%,#D97706 55%,#FBBF24 100%)" },
      { id: "cover_3", name: "Deep terminal", bg: "linear-gradient(120deg,#050505 0%,#3A2A12 100%)" },
      { id: "cover_4", name: "Баг найден", bg: "linear-gradient(120deg,#0B0B0B 0%,#EF4444 100%)" },
      { id: "cover_5", name: "Ночной техно", bg: "linear-gradient(120deg,#050505 0%,#121212 50%,#2A2A2A 100%)" },
      { id: "cover_6", name: "Slate terminal", bg: "linear-gradient(120deg,#0B0B0B 0%,#242424 100%)" },
      { id: "cover_7", name: "Compiler amber", bg: "linear-gradient(120deg,#121212 0%,#B45309 100%)" },
      { id: "cover_8", name: "Debug console", bg: "linear-gradient(120deg,#050505 0%,#1A1A1A 50%,#F59E0B 100%)" },
      { id: "cover_9", name: "Runtime trace", bg: "linear-gradient(120deg,#0B0B0B 0%,#F59E0B 35%,#F59E0B 100%)" },
      { id: "cover_10", name: "Cold deploy", bg: "linear-gradient(120deg,#050505 0%,#121212 50%,#FBBF24 100%)" }
    ];

    function nickColor(login) {
      const sub = contestUserSubCache[String(login)] || {};
      const exp = Number(contestUserExpCache[String(login)] || 0);
      const level = typeof getSubscriptionLevel === "function" ? getSubscriptionLevel(sub) : "free";
      if (level !== "free" && typeof getSubscriptionNickColor === "function") return getSubscriptionNickColor(sub);
      return typeof getRankNickColorByExp === "function" ? getRankNickColorByExp(exp) : "#FFFFFF";
    }

    function participantCover(login) {
      const style = contestUserCoverCache[login] || {};
      const preset = COVER_PRESETS.find(item => item.id === String(style.coverId || "").toLowerCase()) || COVER_PRESETS[0];
      const sub = contestUserSubCache[login] || {};
      const level = typeof getSubscriptionLevel === "function" ? getSubscriptionLevel(sub) : "free";
      const custom = String(style.coverUrl || "").trim();
      let background = preset.bg;
      if (level !== "free" && (/^https?:\/\//i.test(custom) || custom.startsWith("/"))) {
        const url = typeof getOptimizedCoverUrl === "function" ? getOptimizedCoverUrl(custom) : custom;
        // Quote as a CSS string; assign through the style API after rendering.
        background = `url(${JSON.stringify(url)})`;
      }
      return `linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.2)), ${background}`;
    }

    function profileLink(login) {
      const sub = contestUserSubCache[String(login)] || {};
      const color = nickColor(login);
      const level = typeof getSubscriptionLevel === "function" ? getSubscriptionLevel(sub) : "free";
      const nickHtml = level !== "free" && typeof buildStyledNickHtml === "function"
        ? buildStyledNickHtml(login, sub, color)
        : `<span style="color:${color}">${escapeHtml(login)}</span>`;
      return `<a href="profile.html?user=${encodeURIComponent(login)}">${nickHtml}</a>`;
    }

    function getStatus(start, end) {
      const now = Date.now();
      if (now < start) return "upcoming";
      if (now <= end) return "ongoing";
      return "finished";
    }

    function openTab(tab) {
      const tasksBtn = document.getElementById("tasksTabBtn");
      const tableBtn = document.getElementById("tableTabBtn");
      tasksBtn.classList.toggle("active", tab === "tasks");
      tableBtn.classList.toggle("active", tab === "table");
      tasksBtn.setAttribute("aria-selected", tab === "tasks");
      tableBtn.setAttribute("aria-selected", tab === "table");
      document.getElementById("tasksPanel").hidden = tab !== "tasks";
      document.getElementById("tablePanel").hidden = tab !== "table";
      moveIndicator();
    }

    function moveIndicator() {
      const active = document.querySelector(".tabs .tab.active");
      const ind = document.getElementById("tabInd");
      if (!active || !ind) return;
      ind.style.width = `${active.offsetWidth}px`;
      ind.style.transform = `translateX(${active.offsetLeft - 4}px)`;
    }

    let timerHandle = null;
    function startTimer() {
      clearInterval(timerHandle);
      const el = document.getElementById("timer");
      const tick = () => {
        const now = Date.now();
        const status = getStatus(contestData.start, contestData.end);
        if (status !== contestStatus) {
          contestStatus = status;
          renderBanner();
          renderTasks();
          loadStandings();
        }
        el.hidden = status !== "ongoing";
        if (status !== "ongoing") {
          el.textContent = "";
          if (status === "finished") clearInterval(timerHandle);
          return;
        }
        const left = Math.max(0, Math.floor((contestData.end - now) / 1000));
        const h = Math.floor(left / 3600);
        const m = Math.floor((left % 3600) / 60);
        const sec = left % 60;
        el.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
        el.className = left < 600 ? "timer soon" : "timer";
      };
      tick();
      if (contestStatus !== "finished") timerHandle = setInterval(tick, 1000);
    }

    function renderBanner() {
      const status = document.getElementById("contestStatus");
      status.hidden = false;
      status.dataset.status = contestStatus;
      document.getElementById("contestStatusLabel").textContent = {
        upcoming: "Не началось", ongoing: "В процессе", finished: "Дорешивание"
      }[contestStatus];
      document.getElementById("timer").hidden = contestStatus !== "ongoing";
      const when = document.getElementById("contestWhen");
      when.hidden = contestStatus === "finished";
      when.innerHTML = contestStatus === "upcoming"
        ? `Начало <b>${formatMsk(contestData.start)}</b>`
        : `Завершение <b>${formatMsk(contestData.end)}</b>`;
      const count = Array.isArray(contestData.tasks) ? contestData.tasks.length : 0;
      const mod10 = count % 10, mod100 = count % 100;
      const taskWord = mod10 === 1 && mod100 !== 11 ? "задача"
        : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14) ? "задачи" : "задач";
      document.getElementById("contestTaskCount").textContent = count;
      document.getElementById("contestTaskLabel").textContent = taskWord;
      document.getElementById("contestMetrics").hidden = false;
      document.getElementById("registerBtn").hidden = isRegistered || contestStatus === "finished";
    }

    async function registerForContest() {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }
      const auth = typeof getAuth === "function" ? getAuth() : null;
      const token = auth?.currentUser ? await auth.currentUser.getIdToken() : "";
      // Fail closed: without a token this is an unauthenticated call to a
      // privileged endpoint, which the server rejects with an opaque 401.
      if (!token) {
        alert("Не удалось получить токен авторизации. Войдите заново.");
        return;
      }
      const res = await fetch(`${TASKS_BASE()}/contest/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ contestId })
      });
      if (!res.ok) {
        const payload = await res.json().catch(() => ({}));
        alert(payload.error || "Не удалось зарегистрироваться");
        return;
      }
      isRegistered = true;
      CodeBugData.write(CodeBugData.privateKey(user, "registration:" + contestId), true);
      renderBanner();
      renderTasks();
      loadStandings();
    }

    function showUnavailable(text) {
      document.getElementById("contestTitle").innerText = text;
      document.getElementById("timer").textContent = "";
      ["contestStatus", "contestWhen", "contestMetrics", "registerBtn"].forEach(id => document.getElementById(id).hidden = true);
      document.getElementById("tasksEmpty").textContent = "";
    }

    async function loadContest() {
      if (!contestId) return showUnavailable("Соревнование не найдено");

      const cached = CodeBugData.read("contests:public") || [];
      const saved = cached.find(item => item.id === contestId);
      const key = user ? CodeBugData.privateKey(user, "contest:" + contestId) : "contest:" + contestId;
      const previous = CodeBugData.read(key) || saved;
      if (previous && previous.visibility !== "private") {
        contestData = previous;
        document.getElementById("contestTitle").textContent = previous.title || "Соревнование";
        contestStatus = getStatus(previous.start, previous.end); renderBanner(); startTimer();
      }
      contestData = await CodeBugData.load(key, async () => {
        const snap = await db.ref(`contests/${contestId}`).get();
        if (!snap.exists()) throw new Error("contest_not_found");
        return snap.val();
      }, { ttl: 30000 }).catch(() => previous);
      if (!contestData) return showUnavailable("Соревнование не найдено");
      const visibility = String(contestData.visibility || "public").toLowerCase();
      const owner = String(contestData.ownerLogin || "").trim();
      const allowed = Array.isArray(contestData.allowedUsers) ? contestData.allowedUsers.map(v => String(v || "").trim()) : [];
      if (visibility === "private" && user !== owner && !allowed.includes(user)) {
        return showUnavailable("Соревнование недоступно");
      }
      contestStatus = getStatus(contestData.start, contestData.end);
      document.getElementById("contestTitle").innerText = contestData.title || "Соревнование";
      document.title = `${contestData.title || "Соревнование"} — CodeBug`;

      if (user) {
        const regSnap = await db.ref(`contest_regs/${contestId}/${user}`).get();
        isRegistered = regSnap.exists();
      }
      renderBanner();
      startTimer();

      const tasks = Array.isArray(contestData.tasks) ? contestData.tasks : [];
      renderTasks();
      const catalog = CodeBugData.read("catalog") || [];
      catalog.forEach(task => { taskTitles[task.id] = task.title; });
      renderTasks();
      CodeBugData.catalog().then(items => { items.forEach(task => { taskTitles[task.id] = task.title; }); renderTasks(); }).catch(() => {});
      await Promise.all(tasks.filter(taskId => !taskTitles[taskId]).map(async (taskId) => {
        try {
          const res = await fetch(`${TASKS_BASE()}/tasks/${taskId}/meta.json`);
          const meta = await res.json();
          taskTitles[taskId] = meta.title;
        } catch (e) {}
      }));

      renderTasks();
      loadStandings();
    }

    async function fetchSubs() {
      if (allSubs) return allSubs;
      allSubs = await CodeBugData.submissions({ contestId });
      return allSubs;
    }

    async function renderTasks() {
      const list = document.getElementById("tasksList");
      const empty = document.getElementById("tasksEmpty");
      list.innerHTML = "";
      const tasks = Array.isArray(contestData?.tasks) ? contestData.tasks : [];
      const note = !tasks.length
        ? (contestStatus === "finished" ? "У этого соревнования нет опубликованных задач." : "Задачи появятся позже.")
        : contestStatus === "upcoming" ? "Задачи откроются в момент старта."
        : contestStatus === "ongoing" && !isRegistered ? "Зарегистрируйтесь, чтобы открыть задачи."
        : "";
      empty.textContent = note;
      empty.hidden = !note;
      if (note) return;

      let solved = new Set();
      if (user) {
        const subs = await CodeBugData.submissions({ login: user });
        subs.forEach((sub) => {
          if (sub.login === user && sub.verdict === "OK") solved.add(Number(sub.task));
        });
      }

      list.innerHTML = tasks.map((taskId, i) => {
        const title = taskTitles[taskId] || `Задача #${taskId}`;
        const href = `problem.html?id=${encodeURIComponent(taskId)}&contest=${encodeURIComponent(contestId)}`;
        return `<a class="task${solved.has(Number(taskId)) ? " solved" : ""}" style="--i:${i}" href="${href}">
          <span class="k">${letter(i)}</span><span class="nm">${escapeHtml(title)}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="m12.6 6.6 5.4 5.4-5.4 5.4"/></svg>
        </a>`;
      }).join("");
    }

    // Accepted: brightest on the first try, fainter with each earlier miss.
    // Not accepted: faint after one try, full red from about the fifth.
    function cellHtml(entry, rowIndex) {
      if (!entry || (!entry.wrongCount && entry.okTime === null)) return `<div class="cell"></div>`;
      if (entry.okTime !== null) {
        const alpha = Math.max(0.3, 1 - 0.18 * entry.wrongCount).toFixed(2);
        return `<div class="cell ok" style="--a:${alpha};--i:${rowIndex}" title="решено на ${entry.okTime} минуте">+${entry.wrongCount || ""}</div>`;
      }
      const alpha = Math.min(1, 0.15 + 0.2 * (entry.wrongCount - 1)).toFixed(2);
      return `<div class="cell wa" style="--a:${alpha};--i:${rowIndex}" title="попыток: ${entry.wrongCount}">−${entry.wrongCount}</div>`;
    }

    async function loadStandings() {
      const table = document.getElementById("standings");
      const empty = document.getElementById("standingsEmpty");
      // Keep the previous table visible during refresh.
      document.getElementById("contestPlace").textContent ||= "—";
      if (!contestData) return;

      const regsSnap = await db.ref(`contest_regs/${contestId}`).get();
      if (!regsSnap.exists()) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;

      const regs = regsSnap.val() || {};
      const regUsers = Object.entries(regs).map(([key, value]) => String((value && value.login) || key)).filter(Boolean);
      for (const login of regUsers) {
        const profile = CodeBugData.read("profile:" + login) || {};
        contestUserSubCache[login] = profile.subscription || {};
        contestUserExpCache[login] = Number(profile.stats?.exp || 0);
        contestUserCoverCache[login] = { ...(profile.profileStyle || {}), coverUrl: profile.coverUrl || profile.profileStyle?.coverUrl || "" };
      }

      const subs = (await fetchSubs()).slice().sort((a, b) => Number(a.date || 0) - Number(b.date || 0));
      const { start, end } = contestData;
      const tasks = (contestData.tasks || []).map(Number);

      const attempts = {};
      regUsers.forEach((login) => {
        attempts[login] = {};
        tasks.forEach((taskId) => { attempts[login][taskId] = { wrongCount: 0, okTime: null }; });
      });

      subs.forEach((sub) => {
        if (sub.contestId !== contestId || !attempts[sub.login]) return;
        if (sub.date < start || sub.date > end) return;
        const entry = attempts[sub.login][Number(sub.task)];
        if (!entry || entry.okTime !== null) return;
        if (sub.verdict === "OK") entry.okTime = Math.floor((sub.date - start) / 60000);
        else entry.wrongCount += 1;
      });

      const rows = regUsers.map((login) => {
        let solved = 0;
        let penalty = 0;
        tasks.forEach((taskId) => {
          const e = attempts[login][taskId];
          if (e.okTime === null) return;
          solved += 1;
          penalty += e.okTime + e.wrongCount * PENALTY;
        });
        return { login, solved, penalty };
      }).sort((a, b) => (b.solved - a.solved) || (a.penalty - b.penalty));

      const viewerIndex = rows.findIndex(row => row.login === user);
      document.getElementById("contestPlace").textContent = contestStatus !== "upcoming" && viewerIndex >= 0 ? String(viewerIndex + 1) : "—";

      const head = `<thead><tr><th>#</th><th class="l">Участник</th><th>Сумма</th><th>Штраф</th>${tasks.map((_, i) => `<th>${letter(i)}</th>`).join("")}</tr></thead>`;
      const body = rows.map((row, idx) => `<tr style="--i:${idx}">
          <td class="place">${idx + 1}</td>
          <td class="user l" style="--ucol:${nickColor(row.login)}">${profileLink(row.login)}</td>
          <td class="sum">${row.solved}</td>
          <td class="pen">${row.penalty}</td>
          ${tasks.map((taskId) => `<td class="sq">${cellHtml(attempts[row.login][taskId], idx)}</td>`).join("")}
        </tr>`).join("");
      table.innerHTML = `${head}<tbody>${body}</tbody>`;
      const participantCells = Array.from(table.querySelectorAll("td.user"));
      participantCells.forEach((cell, index) => {
        cell.style.backgroundImage = participantCover(rows[index].login);
      });
      // Match the profile page's fresh cover and subscription data without delaying the table.
      let nextParticipant = 0;
      async function refreshParticipantCovers() {
        while (nextParticipant < participantCells.length) {
          const index = nextParticipant++;
          const cell = participantCells[index];
          const login = rows[index].login;
          if (!cell.isConnected) return;
          await loadParticipantProfile(login);
          if (!cell.isConnected) continue;
          cell.style.backgroundImage = participantCover(login);
          cell.style.setProperty("--ucol", nickColor(login));
          cell.innerHTML = profileLink(login);
        }
      }
      await Promise.all(Array.from({ length: Math.min(4, participantCells.length) }, refreshParticipantCovers));
    }

    window.addEventListener("resize", moveIndicator);
    requestAnimationFrame(moveIndicator);
    loadContest();
  </script>
