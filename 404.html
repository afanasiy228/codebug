<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy. GitHub Pages cannot send headers, so it is declared
      here. The host list is the set these pages actually load; 'unsafe-inline' is
      required because the page logic lives in inline <script> blocks, so the value
      of this policy is that it pins WHICH hosts may serve scripts and WHERE data
      may be sent - not inline-script suppression.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta> tag.
      Clickjacking protection for this static site needs an HTTP header at the CDN.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://codebug.onrender.com http://localhost:7777 http://127.0.0.1:7777 https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app https://www.google.com https://api.cloudinary.com;
        frame-src https://www.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self'
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeBug — 404</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --stroke: rgba(255, 255, 255, 0.08);
            --text: #FFFFFF;
            --muted: #B0B0B0;
            --accent: #F59E0B;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top right, rgba(245, 158, 11, 0.08), transparent 60%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.03), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .card {
            width: min(680px, 100%);
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        .code {
            margin: 0;
            font-size: clamp(42px, 8vw, 88px);
            line-height: 1;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 0;
        }
        h1 {
            margin: 12px 0 0;
            font-size: clamp(22px, 4vw, 32px);
            line-height: 1.2;
            letter-spacing: 0;
        }
        p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }
        .actions {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid rgba(245, 158, 11, 0.55);
            background: rgba(245, 158, 11, 0.15);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn:hover {
            border-color: rgba(251, 191, 36, 0.95);
            color: #FFFFFF;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.18);
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">404</p>
        <h1>Страница не найдена</h1>
        <p>Ссылка может быть устаревшей или страница была перенесена.</p>
        <div class="actions">
            <a class="btn" href="/index.html">На главную</a>
            <a class="btn" href="/train.html">К тренировкам</a>
            <a class="btn" href="/donate.html">Подписки</a>
        </div>
    </main>
</body>
</html>
