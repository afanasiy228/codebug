<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeBug — 404</title>
    <link rel="icon" type="image/png" href="/logo.png?v=2">
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --stroke: rgba(148, 163, 184, 0.28);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #3B82F6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% -10%, rgba(59, 130, 246, 0.20), transparent 70%),
                radial-gradient(circle at 100% 0%, rgba(59, 130, 246, 0.10), transparent 70%),
                var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .card {
            width: min(680px, 100%);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.96));
            border: 1px solid var(--stroke);
            border-radius: 14px;
            padding: 28px 24px;
            box-shadow: 0 24px 70px rgba(2, 6, 23, 0.65);
        }
        .code {
            margin: 0;
            font-size: clamp(42px, 8vw, 88px);
            line-height: 1;
            font-weight: 800;
            color: #7dd3fc;
            letter-spacing: 0;
        }
        h1 {
            margin: 12px 0 0;
            font-size: clamp(22px, 4vw, 32px);
            line-height: 1.2;
            letter-spacing: 0;
        }
        p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }
        .actions {
            margin-top: 22px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid rgba(125, 211, 252, 0.55);
            background: rgba(2, 6, 23, 0.55);
            color: #bae6fd;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .btn:hover {
            border-color: rgba(125, 211, 252, 0.95);
            color: #e0f2fe;
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="code">404</p>
        <h1>Страница не найдена</h1>
        <p>Ссылка может быть устаревшей или страница была перенесена.</p>
        <div class="actions">
            <a class="btn" href="/index.html">На главную</a>
            <a class="btn" href="/train.html">К тренировкам</a>
            <a class="btn" href="/donate.html">Подписки</a>
        </div>
    </main>
</body>
</html>
